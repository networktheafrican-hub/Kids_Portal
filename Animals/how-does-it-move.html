<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>How Does It Move?</title>
<!-- Kids_Portal · Animals/how-does-it-move.html · slug: animal-move -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#FBF6EC;font-family:'Comic Sans MS','Chalkboard SE','Segoe UI',cursive,sans-serif;
    padding:16px 12px 40px;color:#2d1b0a;text-align:center}
  .card{max-width:660px;margin:0 auto;background:#FFF8E6;border-radius:30px;padding:20px 16px 26px;
    border:6px solid #C8901E;box-shadow:0 10px 22px rgba(0,0,0,.12)}
  h1{font-size:1.7rem;color:#A81B1B;text-shadow:2px 2px 0 #feda7a}
  .sub{font-size:1rem;color:#4d2f12;background:#ffe39c;padding:6px 18px;border-radius:40px;
    display:inline-block;margin:10px 0;border:3px solid #f8b86a}
  .status{background:#fff1c7;border:3px solid #f7b86a;border-radius:40px;padding:9px 16px;
    font-weight:bold;font-size:1rem;margin:16px auto 0;max-width:470px;min-height:2.8em}
  .fin{background:#f5c542;border:4px solid #af6f2a;border-radius:40px;padding:12px 30px;
    font-size:1.15rem;font-weight:bold;color:#2d1b0a;box-shadow:0 5px 0 #7a4d1a;cursor:pointer;
    font-family:inherit;margin-top:16px}
  .dots{display:flex;gap:5px;justify-content:center;margin:12px 0 4px}
  .dots i{width:20px;height:11px;border-radius:4px;background:#EFE7D7;border:2px solid #14563A}
  .dots i.hit{background:#14563A}.dots i.miss{background:#A81B1B;border-color:#6E1111}
  .opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
  .opt{background:#fef7e6;border:4px solid #b48b3a;border-radius:22px;padding:12px 18px;
    min-width:96px;font-size:1.25rem;font-weight:bold;color:#1f3a2f;font-family:inherit;
    cursor:pointer;box-shadow:0 5px 0 #7a5a1f;transition:.12s}
  .opt:active{transform:translateY(3px);box-shadow:0 2px 0 #7a5a1f}
  .opt.ok{background:#14563A;color:#fff;border-color:#0d3a26}
  .opt.no{background:#A81B1B;color:#fff;border-color:#6E1111;animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
    75%{transform:translateX(7px)}}
  :focus-visible{outline:3px solid #A81B1B;outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  @media(min-width:700px){h1{font-size:2.2rem}}

  .q{background:#14563A;color:#fff;border:5px solid #f3d48a;border-radius:26px;padding:20px 16px;
    font-size:1.1rem;font-weight:bold;margin:14px 0;min-height:150px;display:flex;
    align-items:center;justify-content:center;flex-direction:column;gap:8px}
  .q .huge{font-size:1.6rem;line-height:1.35;word-break:break-word;max-width:420px}
  .q .em{font-size:3.6rem;line-height:1}
  .result{font-size:1.35rem;font-weight:bold;color:#14563A;margin-top:12px}

  .bins{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:6px}
  .bin{background:#fef7e6;border:4px solid #b48b3a;border-radius:22px;padding:14px 8px;
    font-size:1.05rem;font-weight:bold;color:#1f3a2f;font-family:inherit;cursor:pointer;
    box-shadow:0 5px 0 #7a5a1f}
  .bin .ic{font-size:2.1rem;display:block;line-height:1.1}
  .bin .en{font-size:.74rem;font-weight:700;opacity:.7;display:block}
  .bin.ok{background:#14563A;color:#fff;border-color:#0d3a26}
  .bin.no{background:#A81B1B;color:#fff;border-color:#6E1111;animation:shake .35s}
  @media(min-width:560px){.bins{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="card">
  <h1>🏃 How Does It Move?</h1>
  <span class="sub">Walk, fly, swim or crawl?</span>
  <div class="dots" id="dots"></div>
  <div class="q" id="q"></div>
  <div class="bins" id="bins"></div>
  <p class="status" id="status"></p>
  <div id="end"></div>
</div>
<script>
var A=[
 {w:'akokɔ',     en:'chicken',   f:'chicken',   ic:'🐔', move:'walk', legs:2, size:3, home:'farm'},
 {w:'odwan',     en:'sheep',     f:'sheep',     ic:'🐑', move:'walk', legs:4, size:5, home:'farm'},
 {w:'abirekyie', en:'goat',      f:'goat',      ic:'🐐', move:'walk', legs:4, size:5, home:'farm'},
 {w:'nantwie',   en:'cow',       f:'cow',       ic:'🐄', move:'walk', legs:4, size:7, home:'farm'},
 {w:'prako',     en:'pig',       f:'pig',       ic:'🐖', move:'walk', legs:4, size:5, home:'farm'},
 {w:'pɔnkɔ',     en:'horse',     f:'horse',     ic:'🐎', move:'walk', legs:4, size:7, home:'farm'},
 {w:'kraman',    en:'dog',       f:'dog',       ic:'🐕', move:'walk', legs:4, size:4, home:'farm'},
 {w:'agyinamoa', en:'cat',       f:'cat',       ic:'🐈', move:'walk', legs:4, size:3, home:'farm'},
 {w:'gyata',     en:'lion',      f:'lion',      ic:'🦁', move:'walk', legs:4, size:7, home:'bush'},
 {w:'ɔsono',     en:'elephant',  f:'elephant',  ic:'🐘', move:'walk', legs:4, size:9, home:'bush'},
 {w:'adoe',      en:'monkey',    f:'monkey',    ic:'🐒', move:'walk', legs:4, size:4, home:'bush'},
 {w:'akyekyedeɛ',en:'tortoise',  f:'tortoise',  ic:'🐢', move:'walk', legs:4, size:3, home:'bush'},
 {w:'ɔwɔ',       en:'snake',     f:'snake',     ic:'🐍', move:'crawl',legs:0, size:4, home:'bush'},
 {w:'adanko',    en:'rabbit',    f:'rabbit',    ic:'🐇', move:'walk', legs:4, size:3, home:'bush'},
 {w:'kɔtɔkɔ',    en:'porcupine', f:'porcupine', ic:'🦔', move:'walk', legs:4, size:3, home:'bush'},
 {w:'ɔdɛnkyɛm',  en:'crocodile', f:'crocodile', ic:'🐊', move:'swim', legs:4, size:7, home:'water'},
 {w:'anomaa',    en:'bird',      f:'bird',      ic:'🐦', move:'fly',  legs:2, size:2, home:'sky'},
 {w:'akorɔma',   en:'hawk',      f:'hawk',      ic:'🦅', move:'fly',  legs:2, size:4, home:'sky'},
 {w:'ananse',    en:'spider',    f:'spider',    ic:'🕷️', move:'crawl',legs:8, size:1, home:'house'},
 {w:'ntontom',   en:'mosquito',  f:'mosquito',  ic:'🦟', move:'fly',  legs:6, size:1, home:'house'},
 {w:'nwansena',  en:'housefly',  f:'housefly',  ic:'🪰', move:'fly',  legs:6, size:1, home:'house'},
 {w:'kɔtɔ',      en:'crab',      f:'crab',      ic:'🦀', move:'crawl',legs:8, size:2, home:'water'},
 {w:'nsuomnam',  en:'fish',      f:'fish',      ic:'🐟', move:'swim', legs:0, size:2, home:'water'},
 {w:'akura',     en:'mouse',     f:'mouse',     ic:'🐁', move:'walk', legs:4, size:1, home:'house'}
];
var MOVE=[
 {k:'walk', t:'Ɛnante',  en:'it walks',  ic:'🚶'},
 {k:'fly',  t:'Ɛtu',     en:'it flies',  ic:'🕊️'},
 {k:'swim', t:'Ɛdware',  en:'it swims',  ic:'🌊'},
 {k:'crawl',t:'Ɛwea',    en:'it crawls', ic:'〰️'}
];
/* One true, distinctive fact per animal, so a riddle has exactly one answer.
   These are the things a Ghanaian child would say about them. */
var CLUE={
 'akokɔ':'I wake the whole house at dawn',
 'odwan':'My coat is wool, and people make blankets from it',
 'abirekyie':'I have a beard and I climb on anything',
 'nantwie':'People drink my milk',
 'prako':'I love to roll in the mud',
 'pɔnkɔ':'People ride on my back',
 'kraman':'I guard the house and I am your friend',
 'agyinamoa':'I catch mice and I purr',
 'gyata':'They call me the king of the bush',
 'ɔsono':'I am the biggest, and my nose is long',
 'adoe':'I swing in the trees and I love bananas',
 'akyekyedeɛ':'I carry my house on my back',
 'ɔwɔ':'I have no legs at all, and I hiss',
 'adanko':'My ears are long and I hop',
 'kɔtɔkɔ':'My back is full of sharp spines',
 'ɔdɛnkyɛm':'I wait in the river with big teeth',
 'anomaa':'I sing in the morning and build a nest',
 'akorɔma':'I circle high up and swoop on chickens',
 'ananse':'I have eight legs and a hundred stories',
 'ntontom':'I bite you at night and you scratch',
 'nwansena':'I sit on the food and you wave me away',
 'kɔtɔ':'I walk sideways and I have claws',
 'nsuomnam':'I live in water and I never close my eyes',
 'akura':'I am small and grey, and the cat wants me'
};
var byA={}; A.forEach(function(x){byA[x.w]=x});
var ANUM={0:'hwee',2:'mmienu',4:'ɛnan',6:'nsia',8:'nwɔtwe'};
function sayA(f){var a=new Audio('/audio?f=animals/'+encodeURIComponent(f+'.m4a'));
  a.play().catch(function(){});return a}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));
  var t=a[i];a[i]=a[j];a[j]=t}return a}
function report(s,m){if(window.__sent||window.parent===window)return;window.__sent=1;
  parent.postMessage({type:'sg:complete',score:s,maxScore:m},'*')}

(function(){
  var TOTAL=9;
  var quiz=shuffle(A.slice()).slice(0,TOTAL);
  var at=0,score=0,lock=false,marks=[];
  var qEl=document.getElementById('q'),binsEl=document.getElementById('bins'),
      statusEl=document.getElementById('status'),dotsEl=document.getElementById('dots'),
      endEl=document.getElementById('end');
  function dots(){dotsEl.innerHTML='';for(var k=0;k<TOTAL;k++){var e=document.createElement('i');
    if(marks[k]===true)e.className='hit';else if(marks[k]===false)e.className='miss';
    dotsEl.appendChild(e)}}
  function show(){
    if(at>=quiz.length)return finish();
    lock=false;var q=quiz[at];
    qEl.innerHTML='<span class="em">'+q.ic+'</span><span class="huge">'+q.w+'</span>'
      +'<span style="font-size:.9rem;opacity:.85">'+q.en+'</span>';
    statusEl.textContent='How does it get about?';dots();sayA(q.f);
    binsEl.innerHTML='';
    MOVE.forEach(function(z){
      var b=document.createElement('button');b.className='bin';b.type='button';b.dataset.k=z.k;
      b.innerHTML='<span class="ic">'+z.ic+'</span>'+z.t+'<span class="en">'+z.en+'</span>';
      b.onclick=function(){answer(b,z,q)};binsEl.appendChild(b);
    });
  }
  function answer(btn,z,q){
    if(lock)return;lock=true;
    var ok=z.k===q.move;marks[at]=ok;
    var right=MOVE.filter(function(x){return x.k===q.move})[0];
    if(ok){score++;btn.classList.add('ok');statusEl.textContent='✅ '+q.w+' — '+right.en+'.'}
    else{btn.classList.add('no');
      Array.prototype.forEach.call(binsEl.children,function(c){
        if(c.dataset.k===q.move)c.classList.add('ok')});
      statusEl.textContent='❌ '+q.w+' — '+right.en+'.'}
    dots();at++;setTimeout(show,1800);
  }
  function finish(){
    dots();qEl.innerHTML='<span class="em">🎉</span>';binsEl.innerHTML='';
    statusEl.textContent='You got '+score+' out of '+TOTAL+'.';
    endEl.innerHTML='<button class="fin" id="again">🔄 Play again</button>';
    document.getElementById('again').onclick=function(){location.reload()};
    report(score,TOTAL);
  }
  show();
})();
</script>
</body>
</html>
