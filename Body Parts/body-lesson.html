<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My Body in Twi</title>
<!-- Kids_Portal · Body Parts/body-lesson.html · slug: body-lesson
     Picture-first: every part shows a big picture, the Twi word and the
     English. Tapping plays the real recording, not a robot voice. -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:linear-gradient(160deg,#fde8b3 0%,#fcc8d0 52%,#c0e8e0 100%);
    font-family:'Comic Sans MS','Chalkboard SE','Segoe UI',cursive,sans-serif;
    padding:16px 12px 40px;color:#2d1b0a;text-align:center;min-height:100vh}
  .card{max-width:760px;margin:0 auto;background:rgba(255,250,240,.86);
    border-radius:34px;padding:20px 14px 26px;border:6px solid #f59e5b;
    box-shadow:0 14px 30px rgba(0,0,0,.16)}
  h1{font-size:1.8rem;color:#9b2c2c;text-shadow:3px 3px 0 #ffd966}
  .sub{font-size:1rem;color:#1e3a1e;background:#d9f99d;padding:6px 18px;border-radius:40px;
    display:inline-block;margin:10px 0;border:3px solid #65a30d;font-weight:bold}
  .grp{font-size:1.05rem;color:#9a3412;font-weight:bold;margin-top:20px;
    background:#ffedd5;border-radius:30px;padding:5px 16px;display:inline-block;
    border:2px dashed #fdba74}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));
    gap:12px;margin-top:10px}
  .part{background:#fffaf0;border-radius:30px 30px 22px 22px;padding:12px 6px 10px;
    display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;
    border:3px solid #ffe0b5;box-shadow:0 9px 0 #d4a373;font-family:inherit;
    transition:transform .08s}
  .part:active{transform:translateY(6px);box-shadow:0 3px 0 #d4a373}
  .part .pic{font-size:3.2rem;line-height:1.1}
  .part .tw{font-size:1.14rem;font-weight:900;color:#7b341e;background:#fef3c7;
    padding:2px 11px;border-radius:30px;border:2px dotted #d97706;word-break:break-word}
  .part .en{font-size:.74rem;color:#4b3a2b;font-weight:bold;text-transform:uppercase;
    background:#e9d8c0;padding:1px 10px;border-radius:30px}
  .part.playing{border-color:#14563A;box-shadow:0 0 0 4px #14563A}
  .part.got .tw{background:#dcfce7;border-color:#22c55e}
  .bar{height:16px;border-radius:99px;background:#fff;border:3px solid #9b2c2c;
    overflow:hidden;margin:18px auto 0;max-width:420px}
  .bar i{display:block;height:100%;width:0;background:#f97316;transition:width .3s}
  .status{background:#dcfce7;border:3px dashed #22c55e;border-radius:40px;padding:9px 16px;
    font-weight:bold;font-size:1rem;margin:12px auto 0;max-width:470px;min-height:2.6em;
    color:#164e3b}
  .fin{background:#f5c542;border:4px solid #af6f2a;border-radius:40px;padding:12px 30px;
    font-size:1.15rem;font-weight:bold;color:#2d1b0a;box-shadow:0 5px 0 #7a4d1a;
    cursor:pointer;font-family:inherit;margin-top:14px}
  :focus-visible{outline:3px solid #9b2c2c;outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media(max-width:560px){
    h1{font-size:1.45rem}
    .part .pic{font-size:2.6rem}
    .part .tw{font-size:1rem}
    .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px}
  }
</style>
</head>
<body>
<div class="card">
  <h1>🧍 My Body in Twi</h1>
  <span class="sub">🔊 Tap a picture to hear it</span>
  <div id="groups"></div>
  <div class="bar"><i id="bar"></i></div>
  <p class="status" id="status">Tap every part to hear its name.</p>
  <div id="end"></div>
</div>
<script>
var B=[{"w": "etire", "e": "head", "ic": "🧠", "g": "head", "f": "head"}, {"w": "nwi", "e": "hair", "ic": "💇🏾", "g": "head", "f": "hair"}, {"w": "anim", "e": "face", "ic": "😊", "g": "head", "f": "face"}, {"w": "ani", "e": "eye", "ic": "👁️", "g": "head", "f": "eye"}, {"w": "ɛhwene", "e": "nose", "ic": "👃🏾", "g": "head", "f": "nose"}, {"w": "aso", "e": "ear", "ic": "👂🏾", "g": "head", "f": "ear"}, {"w": "ano", "e": "mouth", "ic": "👄", "g": "head", "f": "mouth"}, {"w": "ɛse", "e": "tooth", "ic": "🦷", "g": "head", "f": "tooth"}, {"w": "tɛkyerɛma", "e": "tongue", "ic": "👅", "g": "head", "f": "tongue"}, {"w": "moma", "e": "forehead", "ic": "🙂", "g": "head", "f": "forehead"}, {"w": "afono", "e": "cheek", "ic": "😄", "g": "head", "f": "cheek"}, {"w": "ɛkɔn", "e": "neck", "ic": "🧣", "g": "arm", "f": "neck"}, {"w": "abatire", "e": "shoulder", "ic": "🤷🏾", "g": "arm", "f": "shoulder"}, {"w": "abasa", "e": "arm", "ic": "💪🏾", "g": "arm", "f": "arm"}, {"w": "nsa", "e": "hand", "ic": "🖐🏾", "g": "arm", "f": "hand"}, {"w": "nsateaa", "e": "finger", "ic": "👆🏾", "g": "arm", "f": "finger"}, {"w": "yafunu", "e": "belly", "ic": "🫃🏾", "g": "leg", "f": "belly"}, {"w": "kotodwe", "e": "knee", "ic": "🦿", "g": "leg", "f": "knee"}, {"w": "ɛnan", "e": "leg", "ic": "🦵🏾", "g": "leg", "f": "leg"}, {"w": "nantabono", "e": "foot", "ic": "🦶🏾", "g": "leg", "f": "foot"}];
(function(){
  var GROUP={head:'Wo tiri — your head and face',
             arm:'Wo basa — your neck and arms',
             leg:'Wo nipadua — your body and legs'};
  var heard={},cur=null,curEl=null;
  var groupsEl=document.getElementById('groups'),statusEl=document.getElementById('status'),
      barEl=document.getElementById('bar'),endEl=document.getElementById('end');

  /* The real recording, not the browser's robot voice - it mangles ɛ and ɔ. */
  function say(f){
    var a=new Audio('/audio?f=body/'+encodeURIComponent(f+'.m4a'));
    a.play().catch(function(){});
    return a;
  }

  ['head','arm','leg'].forEach(function(g){
    var h=document.createElement('p');h.className='grp';h.textContent=GROUP[g];
    groupsEl.appendChild(h);
    var wrap=document.createElement('div');wrap.className='grid';
    B.filter(function(x){return x.g===g}).forEach(function(x){
      var b=document.createElement('button');b.className='part';b.type='button';
      b.setAttribute('aria-label',x.w+', '+x.e);
      b.innerHTML='<span class="pic">'+x.ic+'</span>'
        +'<span class="tw">'+x.w+'</span><span class="en">'+x.e+'</span>';
      b.onclick=function(){
        if(cur)cur.pause();
        if(curEl)curEl.classList.remove('playing');
        cur=say(x.f);curEl=b;b.classList.add('playing');
        cur.addEventListener('ended',function(){b.classList.remove('playing')});
        cur.addEventListener('error',function(){b.classList.remove('playing')});
        b.classList.add('got');
        heard[x.f]=1;
        var n=Object.keys(heard).length;
        barEl.style.width=Math.round(n/B.length*100)+'%';
        statusEl.textContent = n<B.length
          ? '🔊 '+x.w+' — '+x.e+'  ·  '+n+' of '+B.length
          : '🎉 You heard every part!';
        if(n>=B.length&&!endEl.innerHTML){
          endEl.innerHTML='<button class="fin" id="done">✅ I know my body words</button>';
          document.getElementById('done').onclick=function(){
            if(window.parent===window)return;
            parent.postMessage({type:'sg:complete',score:5,maxScore:5},'*');
            document.getElementById('done').textContent='Saved ⭐';
            document.getElementById('done').disabled=true;
          };
        }
      };
      wrap.appendChild(b);
    });
    groupsEl.appendChild(wrap);
  });
})();
</script>
</body>
</html>
