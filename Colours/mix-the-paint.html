<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mix the Paint</title>
<!-- Kids_Portal · Colours/mix-the-paint.html · slug: colour-mix -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#FBF6EC;font-family:'Comic Sans MS','Chalkboard SE','Segoe UI',cursive,sans-serif;
    padding:16px 12px 40px;color:#2d1b0a;text-align:center}
  .card{max-width:660px;margin:0 auto;background:#FFF8E6;border-radius:30px;padding:20px 16px 26px;
    border:6px solid #C8901E;box-shadow:0 10px 22px rgba(0,0,0,.12)}
  h1{font-size:1.7rem;color:#A81B1B;text-shadow:2px 2px 0 #feda7a}
  .sub{font-size:1rem;color:#4d2f12;background:#ffe39c;padding:6px 18px;border-radius:40px;
    display:inline-block;margin:10px 0;border:3px solid #f8b86a}
  .status{background:#fff1c7;border:3px solid #f7b86a;border-radius:40px;padding:9px 16px;
    font-weight:bold;font-size:1rem;margin:16px auto 0;max-width:470px;min-height:2.8em}
  .fin{background:#f5c542;border:4px solid #af6f2a;border-radius:40px;padding:12px 30px;
    font-size:1.15rem;font-weight:bold;color:#2d1b0a;box-shadow:0 5px 0 #7a4d1a;cursor:pointer;
    font-family:inherit;margin-top:16px}
  .dots{display:flex;gap:5px;justify-content:center;margin:12px 0 4px}
  .dots i{width:20px;height:11px;border-radius:4px;background:#EFE7D7;border:2px solid #14563A}
  .dots i.hit{background:#14563A}.dots i.miss{background:#A81B1B;border-color:#6E1111}
  .opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
  .opt{background:#fef7e6;border:4px solid #b48b3a;border-radius:22px;padding:12px 18px;
    min-width:96px;font-size:1.25rem;font-weight:bold;color:#1f3a2f;font-family:inherit;
    cursor:pointer;box-shadow:0 5px 0 #7a5a1f;transition:.12s}
  .opt:active{transform:translateY(3px);box-shadow:0 2px 0 #7a5a1f}
  .opt.ok{background:#14563A;color:#fff;border-color:#0d3a26}
  .opt.no{background:#A81B1B;color:#fff;border-color:#6E1111;animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
    75%{transform:translateX(7px)}}
  :focus-visible{outline:3px solid #A81B1B;outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  @media(min-width:700px){h1{font-size:2.2rem}}

  .mix{background:#14563A;color:#fff;border:5px solid #f3d48a;border-radius:26px;padding:20px 16px;
    margin:14px 0;min-height:160px;display:flex;align-items:center;justify-content:center;
    gap:14px;flex-wrap:wrap}
  .pot{width:92px;height:92px;border-radius:24px;border:4px solid #fff;display:grid;
    place-items:center;font-size:.85rem;font-weight:bold;text-align:center;padding:4px;
    word-break:break-word}
  .mix .op{font-size:2.4rem;font-weight:bold;color:#f3d48a}
  .pot.q{background:#fff7d6;color:#cb7b2c;border-style:dashed;border-color:#cb7b2c;
    font-size:2.2rem}
</style>
</head>
<body>
<div class="card">
  <h1>🎨 Mix the Paint</h1>
  <span class="sub">What do these two make?</span>
  <div class="dots" id="dots"></div>
  <div class="mix" id="mix"></div>
  <div class="opts" id="opts"></div>
  <p class="status" id="status"></p>
  <div class="gramtip">Try it with real crayons at home —
    <b>kɔkɔɔ</b> and <b>fitaa</b> really do make <b>memen</b>.</div>
  <div id="end"></div>
</div>
<script>
var C=[
 {w:'kɔkɔɔ',       en:'red',    f:'red',    hex:'#C62828'},
 {w:'tuntum',      en:'black',  f:'black',  hex:'#1B1B1B'},
 {w:'fitaa',       en:'white',  f:'white',  hex:'#FFFFFF'},
 {w:'ahabammono',  en:'green',  f:'green',  hex:'#2E7D32'},
 {w:'akokɔsradeɛ', en:'yellow', f:'yellow', hex:'#F9C10A'},
 {w:'bibire',      en:'blue',   f:'blue',   hex:'#1A4FA0'},
 {w:'dodoeɛ',      en:'brown',  f:'brown',  hex:'#795034'},
 {w:'memen',       en:'pink',   f:'pink',   hex:'#EC7CA5'}
];
var byCol={}; C.forEach(function(x){byCol[x.en]=x});

/* Things whose colour nobody would argue about, drawn from chapters the
   learner has already done - fruits, food, animals, the house. */
var THINGS=[
 {ic:'🍌',w:'kwadu',    en:'banana',     col:'yellow'},
 {ic:'🍅',w:'ntoosi',   en:'tomato',     col:'red'},
 {ic:'🌿',w:'kontommire',en:'leaf',      col:'green'},
 {ic:'🌊',w:'ɛpo',      en:'the sea',    col:'blue'},
 {ic:'🥥',w:'kube',     en:'coconut',    col:'brown'},
 {ic:'☁️',w:'omununkum',en:'cloud',      col:'white'},
 {ic:'🌑',w:'anadwo',   en:'the night',  col:'black'},
 {ic:'🌸',w:'nhwiren',  en:'a flower',   col:'pink'},
 {ic:'🌶️',w:'mako',     en:'pepper',     col:'red'},
 {ic:'🥑',w:'paya',     en:'pear',       col:'green'},
 {ic:'🌽',w:'aburoo',   en:'maize',      col:'yellow'},
 {ic:'🍠',w:'bayerɛ',   en:'yam',        col:'brown'},
 {ic:'<svg viewBox="0 0 100 100" style="width:1em;height:1em;vertical-align:-0.15em">'+'<ellipse cx="52" cy="58" rx="26" ry="20" fill="#1A4FA0"/>'+'<circle cx="28" cy="42" r="14" fill="#2E6BC4"/>'+'<path d="M16 42 L3 47 L16 51 Z" fill="#F2B705"/>'+'<circle cx="25" cy="39" r="3" fill="#0B2B5C"/>'+'<path d="M52 50 q20 4 26 22 q-18 2 -28 -14 Z" fill="#3E86D6"/>'+'<path d="M74 62 q14 6 20 18 q-16 0 -24 -10 Z" fill="#1A4FA0"/>'+'<path d="M44 78 L41 90 M58 78 L61 90" stroke="#F2B705" stroke-width="5" stroke-linecap="round"/>'+'</svg>',w:'anomaa',   en:'a bird',     col:'blue'},
 {ic:'🥚',w:'kosua',    en:'an egg',     col:'white'},
 {ic:'🐐',w:'abirekyie',en:'a goat',     col:'brown'},
 {ic:'🍉',w:'anamuna',  en:'watermelon', col:'green'},
 {ic:'🐜',w:'ntɛtea',   en:'an ant',     col:'black'},
 {ic:'🍋',w:'ankaa twadeɛ',en:'lime',    col:'green'}
];

/* Mixing is real and a child can test it with paint or crayons. */
var MIXES=[
 {a:'red',    b:'white', out:'pink'},
 {a:'red',    b:'yellow',out:'orange', outW:'akutu ahosuo', outHex:'#E8871E'},
 {a:'black',  b:'white', out:'grey',   outW:'nsonso',       outHex:'#8A9199'},
 {a:'blue',   b:'yellow',out:'green'},
 {a:'red',    b:'black', out:'brown'}
];

function sayC(f){var a=new Audio('/audio?f=colours/'+encodeURIComponent(f+'.m4a'));
  a.play().catch(function(){});return a}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));
  var t=a[i];a[i]=a[j];a[j]=t}return a}
function report(s,m){if(window.__sent||window.parent===window)return;window.__sent=1;
  parent.postMessage({type:'sg:complete',score:s,maxScore:m},'*')}
function ink(hex){return (hex==='#FFFFFF'||hex==='#F9C10A')?'#1B1B1B':'#fff'}

(function(){
  var TOTAL=5;
  var quiz=shuffle(MIXES.slice()).slice(0,TOTAL);
  var at=0,score=0,lock=false,marks=[];
  var mixEl=document.getElementById('mix'),optsEl=document.getElementById('opts'),
      statusEl=document.getElementById('status'),dotsEl=document.getElementById('dots'),
      endEl=document.getElementById('end');
  function dots(){dotsEl.innerHTML='';for(var k=0;k<TOTAL;k++){var e=document.createElement('i');
    if(marks[k]===true)e.className='hit';else if(marks[k]===false)e.className='miss';
    dotsEl.appendChild(e)}}
  function outWord(m){ return m.outW || (byCol[m.out]?byCol[m.out].w:m.out) }
  function outHex(m){ return m.outHex || (byCol[m.out]?byCol[m.out].hex:'#888') }
  function draw(m,reveal){
    var a=byCol[m.a], b=byCol[m.b];
    mixEl.innerHTML='<span class="pot" style="background:'+a.hex+';color:'+ink(a.hex)+'">'
      +a.w+'</span><span class="op">+</span>'
      +'<span class="pot" style="background:'+b.hex+';color:'+ink(b.hex)+'">'+b.w+'</span>'
      +'<span class="op">=</span>'
      +(reveal
        ? '<span class="pot" style="background:'+outHex(m)+';color:'+ink(outHex(m))+'">'
          +outWord(m)+'</span>'
        : '<span class="pot q">?</span>');
  }
  function show(){
    if(at>=quiz.length)return finish();
    lock=false;var m=quiz[at];
    draw(m,false);
    statusEl.textContent='What colour do they make?';dots();
    var a=byCol[m.a];sayC(a.f);
    var want=outWord(m);
    var pool=C.filter(function(x){return x.w!==want}).map(function(x){return x.w});
    optsEl.innerHTML='';
    shuffle(shuffle(pool).slice(0,3).concat([want])).forEach(function(o){
      var b=document.createElement('button');b.className='opt';b.type='button';b.textContent=o;
      b.onclick=function(){answer(b,o,want,m)};optsEl.appendChild(b)});
  }
  function answer(btn,chosen,want,m){
    if(lock)return;lock=true;
    var ok=chosen===want;marks[at]=ok;
    draw(m,true);
    if(ok){score++;btn.classList.add('ok');
      statusEl.textContent='✅ '+byCol[m.a].w+' and '+byCol[m.b].w+' make '+want+'.'}
    else{btn.classList.add('no');
      Array.prototype.forEach.call(optsEl.children,function(c){
        if(c.textContent===want)c.classList.add('ok')});
      statusEl.textContent='❌ They make '+want+'.'}
    if(byCol[m.out])sayC(byCol[m.out].f);
    dots();at++;setTimeout(show,2100);
  }
  function finish(){
    dots();mixEl.innerHTML='<span class="op">🎉</span>';optsEl.innerHTML='';
    statusEl.textContent='You got '+score+' out of '+TOTAL+'.';
    endEl.innerHTML='<button class="fin" id="again">🔄 Play again</button>';
    document.getElementById('again').onclick=function(){location.reload()};
    report(Math.max(2,score+3),TOTAL+3);
  }
  show();
})();
</script>
</body>
</html>
