<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Find My Soul Name</title>
<!-- Kids_Portal · Day Born Names/find-my-name.html · slug: kradin-mine -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#FBF6EC;font-family:'Comic Sans MS','Chalkboard SE','Segoe UI',cursive,sans-serif;
    padding:16px 12px 40px;color:#2d1b0a;text-align:center}
  .card{max-width:660px;margin:0 auto;background:#FFF8E6;border-radius:30px;padding:20px 16px 26px;
    border:6px solid #C8901E;box-shadow:0 10px 22px rgba(0,0,0,.12)}
  h1{font-size:1.7rem;color:#A81B1B;text-shadow:2px 2px 0 #feda7a}
  .sub{font-size:1rem;color:#4d2f12;background:#ffe39c;padding:6px 18px;border-radius:40px;
    display:inline-block;margin:10px 0;border:3px solid #f8b86a}
  .status{background:#fff1c7;border:3px solid #f7b86a;border-radius:40px;padding:9px 16px;
    font-weight:bold;font-size:1rem;margin:16px auto 0;max-width:470px;min-height:2.8em}
  .fin{background:#f5c542;border:4px solid #af6f2a;border-radius:40px;padding:12px 30px;
    font-size:1.15rem;font-weight:bold;color:#2d1b0a;box-shadow:0 5px 0 #7a4d1a;cursor:pointer;
    font-family:inherit;margin-top:16px}
  .dots{display:flex;gap:5px;justify-content:center;margin:12px 0 4px}
  .dots i{width:20px;height:11px;border-radius:4px;background:#EFE7D7;border:2px solid #14563A}
  .dots i.hit{background:#14563A}.dots i.miss{background:#A81B1B;border-color:#6E1111}
  .opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
  .opt{background:#fef7e6;border:4px solid #b48b3a;border-radius:22px;padding:12px 18px;
    min-width:96px;font-size:1.25rem;font-weight:bold;color:#1f3a2f;font-family:inherit;
    cursor:pointer;box-shadow:0 5px 0 #7a5a1f;transition:.12s}
  .opt:active{transform:translateY(3px);box-shadow:0 2px 0 #7a5a1f}
  .opt.ok{background:#14563A;color:#fff;border-color:#0d3a26}
  .opt.no{background:#A81B1B;color:#fff;border-color:#6E1111;animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
    75%{transform:translateX(7px)}}
  :focus-visible{outline:3px solid #A81B1B;outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  @media(min-width:700px){h1{font-size:2.2rem}}

  .pickers{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:14px}
  .p{background:#fef7e6;border:4px solid #b48b3a;border-radius:22px;padding:10px 16px;
    font-size:1.05rem;font-weight:bold;color:#1f3a2f;font-family:inherit;cursor:pointer;
    box-shadow:0 5px 0 #7a5a1f}
  .p.on{background:#14563A;color:#fff;border-color:#0d3a26}
  .who{display:flex;gap:10px;justify-content:center;margin-top:12px}
  .who button{flex:1 1 130px;max-width:180px;border-radius:22px;border:4px solid #b48b3a;
    padding:12px;font-size:1.1rem;font-weight:bold;font-family:inherit;cursor:pointer;
    box-shadow:0 5px 0 #7a5a1f}
  .who .b{background:#d6e9ff;color:#004080}
  .who .g{background:#ffdbe8;color:#8a1f4a}
  .who button.on{background:#14563A;color:#fff;border-color:#0d3a26}
  .reveal{background:#14563A;color:#fff;border:5px solid #f3d48a;border-radius:26px;padding:22px 16px;
    margin-top:16px;min-height:130px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:8px}
  .reveal .big{font-size:2.6rem;font-weight:bold;line-height:1.1}
  .reveal .spk{background:#fff1c7;border:3px solid #f7b86a;border-radius:40px;padding:8px 20px;
    font-size:1rem;font-weight:bold;color:#4d2f12;cursor:pointer;font-family:inherit}
  .lbl{font-size:.95rem;font-weight:bold;color:#4d2f12;margin-top:14px}
</style>
</head>
<body>
<div class="card">
  <h1>🎁 Find My Soul Name</h1>
  <span class="sub">Which day were you born?</span>
  <p class="lbl">1. Pick your day</p>
  <div class="pickers" id="days"></div>
  <p class="lbl">2. Pick boy or girl</p>
  <div class="who">
    <button class="b" id="boy" type="button">👦 Boy</button>
    <button class="g" id="girl" type="button">👧 Girl</button>
  </div>
  <div class="reveal" id="reveal"><span>Choose a day and boy or girl</span></div>
  <div id="end"></div>
</div>
<script>
var D=[
 {tw:'Ɛdwoada', en:'Monday',    m:'Kwadwo',  f:'Adwoa',  af:'monday',    e:'🌙'},
 {tw:'Ɛbenada', en:'Tuesday',   m:'Kwabena', f:'Abena',  af:'tuesday',   e:'🔥'},
 {tw:'Wukuada', en:'Wednesday', m:'Kwaku',   f:'Akua',   af:'wednesday', e:'🕷️'},
 {tw:'Yawoada', en:'Thursday',  m:'Yaw',     f:'Yaa',    af:'thursday',  e:'🌍'},
 {tw:'Efiada',  en:'Friday',    m:'Kofi',    f:'Afia',   af:'friday',    e:'🌱'},
 {tw:'Memeneda',en:'Saturday',  m:'Kwame',   f:'Ama',    af:'saturday',  e:'☀️'},
 {tw:'Kwasiada',en:'Sunday',    m:'Kwasi',   f:'Akosua', af:'sunday',    e:'✨'}
];
function sayK(f){var a=new Audio('/audio?f=kradin/'+encodeURIComponent(f+'.m4a'));
  a.play().catch(function(){});return a}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));
  var t=a[i];a[i]=a[j];a[j]=t}return a}
function report(s,m){if(window.__sent||window.parent===window)return;window.__sent=1;
  parent.postMessage({type:'sg:complete',score:s,maxScore:m},'*')}

(function(){
  var day=null,sex=null,shown=0;
  var daysEl=document.getElementById('days'),revealEl=document.getElementById('reveal'),
      boy=document.getElementById('boy'),girl=document.getElementById('girl'),
      endEl=document.getElementById('end');

  D.forEach(function(d){
    var b=document.createElement('button');
    b.className='p';b.type='button';b.textContent=d.tw;
    b.onclick=function(){
      day=d;
      Array.prototype.forEach.call(daysEl.children,function(c){c.classList.remove('on')});
      b.classList.add('on');
      sayK(d.af);
      show();
    };
    daysEl.appendChild(b);
  });

  boy.onclick=function(){sex='m';boy.classList.add('on');girl.classList.remove('on');show()};
  girl.onclick=function(){sex='f';girl.classList.add('on');boy.classList.remove('on');show()};

  function show(){
    if(!day||!sex){revealEl.innerHTML='<span>Choose a day and boy or girl</span>';return}
    var name=sex==='m'?day.m:day.f;
    revealEl.innerHTML='<span>'+day.e+' Born on '+day.tw+' ('+day.en+')</span>'
      +'<span class="big">'+name+'</span>'
      +'<button class="spk" type="button" id="spk">🔊 Hear my name</button>';
    document.getElementById('spk').onclick=function(){sayK(name.toLowerCase())};
    sayK(name.toLowerCase());
    shown++;
    /* Exploring three different days is enough to have understood the pattern. */
    if(shown>=3&&!endEl.innerHTML){
      endEl.innerHTML='<button class="fin" id="done">✅ I found my name</button>';
      document.getElementById('done').onclick=function(){report(4,4)};
    }
  }
})();
</script>
</body>
</html>
