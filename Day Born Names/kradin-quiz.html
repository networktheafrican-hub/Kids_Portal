<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kradin Quiz</title>
<!-- Kids_Portal · Day Born Names/kradin-quiz.html · slug: kradin-quiz -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#FBF6EC;font-family:'Comic Sans MS','Chalkboard SE','Segoe UI',cursive,sans-serif;
    padding:16px 12px 40px;color:#2d1b0a;text-align:center}
  .card{max-width:660px;margin:0 auto;background:#FFF8E6;border-radius:30px;padding:20px 16px 26px;
    border:6px solid #C8901E;box-shadow:0 10px 22px rgba(0,0,0,.12)}
  h1{font-size:1.7rem;color:#A81B1B;text-shadow:2px 2px 0 #feda7a}
  .sub{font-size:1rem;color:#4d2f12;background:#ffe39c;padding:6px 18px;border-radius:40px;
    display:inline-block;margin:10px 0;border:3px solid #f8b86a}
  .status{background:#fff1c7;border:3px solid #f7b86a;border-radius:40px;padding:9px 16px;
    font-weight:bold;font-size:1rem;margin:16px auto 0;max-width:470px;min-height:2.8em}
  .fin{background:#f5c542;border:4px solid #af6f2a;border-radius:40px;padding:12px 30px;
    font-size:1.15rem;font-weight:bold;color:#2d1b0a;box-shadow:0 5px 0 #7a4d1a;cursor:pointer;
    font-family:inherit;margin-top:16px}
  .dots{display:flex;gap:5px;justify-content:center;margin:12px 0 4px}
  .dots i{width:20px;height:11px;border-radius:4px;background:#EFE7D7;border:2px solid #14563A}
  .dots i.hit{background:#14563A}.dots i.miss{background:#A81B1B;border-color:#6E1111}
  .opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
  .opt{background:#fef7e6;border:4px solid #b48b3a;border-radius:22px;padding:12px 18px;
    min-width:96px;font-size:1.25rem;font-weight:bold;color:#1f3a2f;font-family:inherit;
    cursor:pointer;box-shadow:0 5px 0 #7a5a1f;transition:.12s}
  .opt:active{transform:translateY(3px);box-shadow:0 2px 0 #7a5a1f}
  .opt.ok{background:#14563A;color:#fff;border-color:#0d3a26}
  .opt.no{background:#A81B1B;color:#fff;border-color:#6E1111;animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
    75%{transform:translateX(7px)}}
  :focus-visible{outline:3px solid #A81B1B;outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  @media(min-width:700px){h1{font-size:2.2rem}}

  .q{background:#14563A;color:#fff;border:5px solid #f3d48a;border-radius:26px;padding:18px 16px;
    font-size:1.1rem;font-weight:bold;margin:14px 0;min-height:112px;display:flex;
    align-items:center;justify-content:center;flex-direction:column;gap:7px}
  .q .huge{font-size:2.2rem;line-height:1.2}
  .q .spk{background:#fff1c7;border:3px solid #f7b86a;border-radius:40px;padding:8px 20px;
    font-size:1rem;font-weight:bold;color:#4d2f12;cursor:pointer;font-family:inherit}
  .result{font-size:1.35rem;font-weight:bold;color:#14563A;margin-top:12px}
</style>
</head>
<body>
<div class="card">
  <h1>🏁 Kradin Quiz</h1>
  <span class="sub">Days and soul names</span>
  <div class="dots" id="dots"></div>
  <div class="q" id="q"></div>
  <div class="opts" id="opts"></div>
  <p class="status" id="status"></p>
  <div id="end"></div>
</div>
<script>
var D=[
 {tw:'Ɛdwoada', en:'Monday',    m:'Kwadwo',  f:'Adwoa',  af:'monday',    e:'🌙'},
 {tw:'Ɛbenada', en:'Tuesday',   m:'Kwabena', f:'Abena',  af:'tuesday',   e:'🔥'},
 {tw:'Wukuada', en:'Wednesday', m:'Kwaku',   f:'Akua',   af:'wednesday', e:'🕷️'},
 {tw:'Yawoada', en:'Thursday',  m:'Yaw',     f:'Yaa',    af:'thursday',  e:'🌍'},
 {tw:'Efiada',  en:'Friday',    m:'Kofi',    f:'Afia',   af:'friday',    e:'🌱'},
 {tw:'Memeneda',en:'Saturday',  m:'Kwame',   f:'Ama',    af:'saturday',  e:'☀️'},
 {tw:'Kwasiada',en:'Sunday',    m:'Kwasi',   f:'Akosua', af:'sunday',    e:'✨'}
];
function sayK(f){var a=new Audio('/audio?f=kradin/'+encodeURIComponent(f+'.m4a'));
  a.play().catch(function(){});return a}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));
  var t=a[i];a[i]=a[j];a[j]=t}return a}
function report(s,m){if(window.__sent||window.parent===window)return;window.__sent=1;
  parent.postMessage({type:'sg:complete',score:s,maxScore:m},'*')}

(function(){
  var TOTAL=8;
  var pick1=function(a){return a[Math.floor(Math.random()*a.length)]};
  var names=function(boy){return D.map(function(x){return boy?x.m:x.f})};

  function qDay(){var d=pick1(D);
    return {html:'<span class="huge">'+d.tw+'</span><span>Which day is this in English?</span>',
      answer:d.en, opts:shuffle(shuffle(D.filter(function(x){return x.en!==d.en})
        .map(function(x){return x.en})).slice(0,3).concat([d.en])), say:d.af,
      prompt:'Read the Twi day name.'};}
  function qName(){var d=pick1(D),boy=Math.random()<0.5;
    var want=boy?d.m:d.f;
    return {html:'<span>'+d.e+'</span><span class="huge">'+d.tw+'</span>'
      +'<span>'+(boy?'A boy':'A girl')+' born on this day is called?</span>',
      answer:want, opts:shuffle(shuffle(names(boy).filter(function(n){return n!==want}))
        .slice(0,3).concat([want])), say:want.toLowerCase(),
      prompt:'Think of the kradin.'};}
  function qBack(){var d=pick1(D),boy=Math.random()<0.5;
    var given=boy?d.m:d.f;
    return {html:'<span class="huge">'+given+'</span><span>Which day was this child born?</span>',
      answer:d.tw, opts:shuffle(shuffle(D.filter(function(x){return x.en!==d.en})
        .map(function(x){return x.tw})).slice(0,3).concat([d.tw])), say:given.toLowerCase(),
      prompt:'The name tells you the day.'};}
  function qHear(){var d=pick1(D),boy=Math.random()<0.5;
    var want=boy?d.m:d.f;
    return {html:'<span class="huge">👂</span><button class="spk" type="button" id="qspk">🔊 Play it again</button>',
      answer:want, opts:shuffle(shuffle(names(boy).filter(function(n){return n!==want}))
        .slice(0,3).concat([want])), say:want.toLowerCase(), auto:true,
      prompt:'Which name did you hear?'};}

  var makers=[qDay,qName,qBack,qHear];
  var quiz=[];for(var i=0;i<TOTAL;i++)quiz.push(makers[i%makers.length]());
  quiz=shuffle(quiz);

  var at=0,score=0,lock=false,marks=[];
  var qEl=document.getElementById('q'),optsEl=document.getElementById('opts'),
      statusEl=document.getElementById('status'),dotsEl=document.getElementById('dots'),
      endEl=document.getElementById('end');

  function dots(){dotsEl.innerHTML='';for(var k=0;k<TOTAL;k++){var e=document.createElement('i');
    if(marks[k]===true)e.className='hit';else if(marks[k]===false)e.className='miss';
    dotsEl.appendChild(e)}}

  function show(){
    if(at>=quiz.length)return finish();
    lock=false;var q=quiz[at];
    qEl.innerHTML=q.html;statusEl.textContent=q.prompt;dots();
    optsEl.innerHTML='';
    q.opts.forEach(function(o){
      var b=document.createElement('button');
      b.className='opt';b.type='button';b.textContent=o;
      b.onclick=function(){answer(b,o,q)};
      optsEl.appendChild(b);
    });
    var spk=document.getElementById('qspk');
    if(spk)spk.onclick=function(){sayK(q.say)};
    if(q.auto)sayK(q.say);
  }

  function answer(btn,chosen,q){
    if(lock)return;lock=true;
    var right=chosen===q.answer;marks[at]=right;
    if(right){score++;btn.classList.add('ok');statusEl.textContent='✅ Correct!'}
    else{btn.classList.add('no');
      Array.prototype.forEach.call(optsEl.children,function(c){
        if(c.textContent===q.answer)c.classList.add('ok')});
      statusEl.textContent='❌ The answer is '+q.answer+'.'}
    sayK(q.say);dots();at++;setTimeout(show,1700);
  }

  function finish(){
    dots();
    qEl.innerHTML='<span class="huge">'+(score===TOTAL?'🏆':score>=TOTAL*0.6?'🎉':'💪')+'</span>';
    optsEl.innerHTML='';
    statusEl.textContent=score===TOTAL?'Full marks! Every single one.':
      score>=TOTAL*0.6?'Well done — you know your kradin.':
      'Good try. Play the games again and come back.';
    endEl.innerHTML='<p class="result">'+score+' out of '+TOTAL+'</p>'
      +'<button class="fin" id="again">🔄 Try again</button>';
    document.getElementById('again').onclick=function(){location.reload()};
    report(score,TOTAL);
  }
  show();
})();
</script>
</body>
</html>
