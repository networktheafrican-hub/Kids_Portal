<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ka wo abusua ho asɛm</title>
<!-- Kids_Portal · Family/my-own-family.html · slug: fam-aboutme -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#FBF6EC;font-family:'Comic Sans MS','Chalkboard SE','Segoe UI',cursive,sans-serif;
    padding:16px 12px 40px;color:#2d1b0a;text-align:center}
  .card{max-width:660px;margin:0 auto;background:#FFF8E6;border-radius:30px;padding:20px 16px 26px;
    border:6px solid #C8901E;box-shadow:0 10px 22px rgba(0,0,0,.12)}
  h1{font-size:1.7rem;color:#A81B1B;text-shadow:2px 2px 0 #feda7a}
  .sub{font-size:1rem;color:#4d2f12;background:#ffe39c;padding:6px 18px;border-radius:40px;
    display:inline-block;margin:10px 0;border:3px solid #f8b86a}
  .status{background:#fff1c7;border:3px solid #f7b86a;border-radius:40px;padding:9px 16px;
    font-weight:bold;font-size:1rem;margin:16px auto 0;max-width:470px;min-height:2.8em}
  .fin{background:#f5c542;border:4px solid #af6f2a;border-radius:40px;padding:12px 30px;
    font-size:1.15rem;font-weight:bold;color:#2d1b0a;box-shadow:0 5px 0 #7a4d1a;cursor:pointer;
    font-family:inherit;margin-top:16px}
  .dots{display:flex;gap:5px;justify-content:center;margin:12px 0 4px}
  .dots i{width:20px;height:11px;border-radius:4px;background:#EFE7D7;border:2px solid #14563A}
  .dots i.hit{background:#14563A}.dots i.miss{background:#A81B1B;border-color:#6E1111}
  .opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
  .opt{background:#fef7e6;border:4px solid #b48b3a;border-radius:22px;padding:12px 18px;
    min-width:96px;font-size:1.25rem;font-weight:bold;color:#1f3a2f;font-family:inherit;
    cursor:pointer;box-shadow:0 5px 0 #7a5a1f;transition:.12s}
  .opt:active{transform:translateY(3px);box-shadow:0 2px 0 #7a5a1f}
  .opt.ok{background:#14563A;color:#fff;border-color:#0d3a26}
  .opt.no{background:#A81B1B;color:#fff;border-color:#6E1111;animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
    75%{transform:translateX(7px)}}
  :focus-visible{outline:3px solid #A81B1B;outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  @media(min-width:700px){h1{font-size:2.2rem}}

  .step{background:#14563A;color:#fff;border:5px solid #f3d48a;border-radius:26px;padding:20px 16px;
    margin:14px 0;text-align:center}
  .step .n{font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
  .step .tw{font-family:"Baloo 2",cursive;font-size:1.9rem;line-height:1.2;margin-top:4px;
    word-break:break-word}
  .step .en{font-size:.92rem;opacity:.9;font-weight:700;margin-top:2px}
  .step .add{background:#fff1c7;color:#4d2f12;border-radius:30px;padding:6px 14px;font-size:.82rem;
    font-weight:800;display:inline-block;margin-top:9px}
  .rowb{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
  .rb{border:3px solid #3A2A1C;border-radius:20px;padding:14px 18px;font-weight:800;font-size:1rem;
    background:#fff;cursor:pointer;min-width:130px;box-shadow:0 4px 0 #3A2A1C;font-family:inherit;
    color:#14261D}
  .rb:active{transform:translateY(3px);box-shadow:none}
  .rb.rec{background:#A81B1B;color:#fff;border-color:#6E1111}
  .rb.stop{background:#6E1111;color:#fff}
  .rb.gold{background:#C8901E;color:#3A2A05}
  .rb[disabled]{opacity:.4;pointer-events:none}
  .lvl{height:14px;border-radius:99px;background:#EFE7D7;border:2px solid #3A2A1C;overflow:hidden;
    margin-top:12px}
  .lvl i{display:block;height:100%;width:0;background:#A81B1B}
  .track{display:flex;gap:6px;justify-content:center;margin-top:14px;flex-wrap:wrap}
  .track b{width:34px;height:34px;border-radius:50%;border:3px solid #14563A;background:#fff;
    display:grid;place-items:center;font-size:.85rem;font-weight:800;color:#14563A;cursor:pointer}
  .track b.done{background:#14563A;color:#fff}
  .track b.now{box-shadow:0 0 0 4px #C8901E}
  .finale{background:#C8901E;color:#3A2A05;border:4px solid #14563A;border-radius:24px;padding:18px;
    text-align:center;margin-top:16px}
  .tip{background:#EFE7D7;border:2px dashed #3A2A1C;border-radius:18px;padding:12px;font-size:.85rem;
    font-weight:700;color:#5A6B60;margin-top:14px;line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <h1>🎙️ Ka wo abusua ho asɛm</h1>
  <span class="sub">Tell about your own family, in your voice</span>
  <div class="track" id="track"></div>
  <div class="step" id="step"></div>
  <div class="lvl"><i id="meter"></i></div>
  <div class="rowb">
    <button class="rb gold" id="hear">🔊 Hear it</button>
    <button class="rb rec" id="go">🎤 Record me</button>
  </div>
  <div class="rowb"><button class="rb" id="mine" disabled>▶️ Just me</button></div>
  <p class="status" id="status">Listen first, then say the whole sentence with your own words.</p>
  <div class="rowb">
    <button class="rb" id="prev">← Before</button>
    <button class="rb" id="next">Next →</button>
  </div>
  <div id="finale"></div>
  <p class="tip">Your voice stays on this phone. Play it to the person you are talking about —
    that is the best way to practise.</p>
</div>
<script>
var FAM=[
 {w:'papa',      e:'father',            f:'father',      g:'close', reg:'casual',  pair:'agya',  ic:'👨'},
 {w:'agya',      e:'father',            f:'father2',     g:'close', reg:'respect', pair:'papa',  ic:'👨'},
 {w:'maame',     e:'mother',            f:'mother',      g:'close', reg:'casual',  pair:'ɛna',   ic:'👩'},
 {w:'ɛna',       e:'mother',            f:'mother2',     g:'close', reg:'respect', pair:'maame', ic:'👩'},
 {w:'nana',      e:'grandparent, elder',f:'grandparent', g:'close', ic:'🧓'},
 {w:'nua',       e:'sibling',           f:'sibling',     g:'close', pl:'anuanom', ic:'🧑'},
 {w:'nuabarima', e:'brother',           f:'brother',     g:'close', ic:'👦'},
 {w:'nuabaa',    e:'sister',            f:'sister',      g:'close', ic:'👧'},
 {w:'ɔba',       e:'child',             f:'child',       g:'close', pl:'mma', ic:'🧒'},
 {w:'wɔfa',      e:'uncle',             f:'uncle',       g:'wider', ic:'👨‍🦱'},
 {w:'sewaa',     e:'aunt',              f:'aunt',        g:'wider', ic:'👩‍🦱'},
 {w:'adamfo',    e:'friend',            f:'friend',      g:'wider', pl:'nnamfoɔ', ic:'🤝'},
 {w:'abusua',    e:'family, clan',      f:'family',      g:'wider', ic:'🏡'},
 {w:'ɔbarima',   e:'man',               f:'man',         g:'people', ic:'🧔'},
 {w:'ɔbaa',      e:'woman',             f:'woman',       g:'people', ic:'👩‍🦰'},
 {w:'abɔfra',    e:'little child',      f:'littlechild', g:'people', ic:'👶'},
 {w:'akwakoraa', e:'old man',           f:'oldman',      g:'people', ic:'👴'},
 {w:'aberewa',   e:'old woman',         f:'oldwoman',    g:'people', ic:'👵'},
 {w:'onipa',     e:'person',            f:'person',      g:'people', pl:'nnipa', ic:'🧍'}
];
/* One becomes many - a real Twi pattern, not just extra words. */
var PLURALS=[
 {one:'ɔba',   many:'mma',      e:'child → children',   f1:'child',  f2:'children'},
 {one:'nua',   many:'anuanom',  e:'sibling → siblings', f1:'sibling',f2:'siblings'},
 {one:'adamfo',many:'nnamfoɔ',  e:'friend → friends',   f1:'friend', f2:'friends'},
 {one:'onipa', many:'nnipa',    e:'person → people',    f1:'person', f2:'people'}
];
/* Two words for the same parent - one you use with your friends, one you use
   before an elder. Knowing which is which is the mark of someone raised right. */
var REGISTER=[
 {casual:'papa',  respect:'agya', e:'father', fc:'father', fr:'father2'},
 {casual:'maame', respect:'ɛna',  e:'mother', fc:'mother', fr:'mother2'}
];
var SAY=[
 {w:'me maame din de…', e:"my mother's name is…", f:'mymothername',  slot:'name'},
 {w:'me papa din de…',  e:"my father's name is…", f:'myfathername',  slot:'name'},
 {w:'me nua din de…',   e:"my sibling's name is…",f:'mysiblingname', slot:'name'},
 {w:'mewɔ nuabaa',      e:'I have a sister',      f:'ihavesister'},
 {w:'mewɔ nuabarima',   e:'I have a brother',     f:'ihavebrother'}
];
var FGRP={close:'The people closest to you',wider:'The wider family',
          people:'Words for people'};
var FNUM={1:'baako',2:'mmienu',3:'mmiensa',4:'ɛnan',5:'enum',6:'nsia'};
var byFam={}; FAM.forEach(function(x){byFam[x.f]=x});

function sayF(f){var a=new Audio('/audio?f=family/'+encodeURIComponent(f+'.m4a'));
  a.play().catch(function(){});return a}
function sayNum(f){var a=new Audio('/audio?f=twi-numbers/'+encodeURIComponent(f+'.m4a'));
  a.play().catch(function(){});return a}
function sayThen(f1,d2,f2){
  var a=sayF(f1);
  a.addEventListener('ended',function(){
    var b=new Audio('/audio?f='+d2+'/'+encodeURIComponent(f2+'.m4a'));b.play().catch(function(){});
  });
  return a;
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));
  var t=a[i];a[i]=a[j];a[j]=t}return a}
function report(s,m){if(window.__sent||window.parent===window)return;window.__sent=1;
  parent.postMessage({type:'sg:complete',score:s,maxScore:m},'*')}

(function(){
  var STEPS=[
   {f:'mymothername', add:'…and her name'},
   {f:'myfathername', add:'…and his name'},
   {f:'mysiblingname',add:'…and their name'},
   {f:'ihavesister',  add:'say it, or change it to nuabarima'},
   {f:'ihavebrother', add:'say it, or say how many'}
  ];
  var LBL={mymothername:['me maame din de…',"my mother's name is…"],
           myfathername:['me papa din de…',"my father's name is…"],
           mysiblingname:['me nua din de…',"my sibling's name is…"],
           ihavesister:['mewɔ nuabaa','I have a sister'],
           ihavebrother:['mewɔ nuabarima','I have a brother']};
  var at=0,rec=null,chunks=[],stream=null,takes={};
  var $=function(i){return document.getElementById(i)};

  function draw(){
    var s=STEPS[at], L=LBL[s.f];
    $('step').innerHTML='<div class="n">Part '+(at+1)+' of '+STEPS.length+'</div>'
      +'<div class="tw">'+L[0]+'</div><div class="en">'+L[1]+'</div>'
      +'<div class="add">'+s.add+'</div>';
    $('mine').disabled=!takes[at];
    $('go').textContent=takes[at]?'🎤 Record again':'🎤 Record me';
    $('go').className='rb rec';$('meter').style.width='0%';
    $('status').textContent=takes[at]?'Saved. Move on, or record it again.'
      :'Listen first, then say the whole sentence with your own words.';
    drawTrack();drawFinale();
  }
  function drawTrack(){
    $('track').innerHTML='';
    STEPS.forEach(function(s,i){
      var b=document.createElement('b');b.textContent=i+1;
      if(takes[i])b.className='done';
      if(i===at)b.className+=' now';
      b.onclick=function(){at=i;draw()};
      $('track').appendChild(b);
    });
  }
  function drawFinale(){
    if(Object.keys(takes).length<STEPS.length){$('finale').innerHTML='';return}
    $('finale').innerHTML='<div class="finale"><h2 style="font-size:1.3rem">🎉 All done</h2>'
      +'<p style="font-weight:700;font-size:.9rem">Hear yourself talk about your family.</p>'
      +'<button class="rb" id="playall" style="margin-top:8px">▶️ Play it all</button>'
      +'<button class="rb" id="done2" style="margin-top:8px">✅ I am finished</button></div>';
    $('playall').onclick=playAll;
    $('done2').onclick=function(){report(6,6);$('status').textContent='Well done. Saved.'};
  }
  async function toggle(){
    if(rec&&rec.state==='recording'){rec.stop();return}
    try{ if(!stream)stream=await navigator.mediaDevices.getUserMedia({audio:true}); }
    catch(err){ $('status').textContent='I cannot reach the microphone. Allow it, then try again.'; return }
    chunks=[];rec=new MediaRecorder(stream);
    rec.ondataavailable=function(e){ if(e.data.size)chunks.push(e.data) };
    rec.onstop=function(){
      takes[at]=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType||'audio/webm'}));
      $('mine').disabled=false;$('go').textContent='🎤 Record again';$('go').className='rb rec';
      $('status').textContent='Saved. Listen to yourself, or move on.';
      $('meter').style.width='0%';drawTrack();drawFinale();
    };
    rec.start();
    $('go').textContent='⏹ Stop';$('go').className='rb stop';
    $('status').textContent='Recording… say the whole sentence.';
    try{
      var ac=new (window.AudioContext||window.webkitAudioContext)();
      var src=ac.createMediaStreamSource(stream),an=ac.createAnalyser();
      an.fftSize=256;src.connect(an);
      var buf=new Uint8Array(an.frequencyBinCount);
      (function tick(){
        if(!rec||rec.state!=='recording'){ac.close().catch(function(){});return}
        an.getByteFrequencyData(buf);
        var sum=0;for(var i=0;i<buf.length;i++)sum+=buf[i];
        $('meter').style.width=Math.min(100,(sum/buf.length)*2.2)+'%';
        requestAnimationFrame(tick);
      })();
    }catch(e){}
    setTimeout(function(){ if(rec&&rec.state==='recording')rec.stop() },12000);
  }
  function playAll(){
    var i=0;$('status').textContent='Playing…';
    (function next(){
      if(i>=STEPS.length){$('status').textContent='That was you, talking about your family. 🎉';return}
      var a=new Audio(takes[i]);
      a.addEventListener('ended',function(){i++;setTimeout(next,350)});
      a.addEventListener('error',function(){i++;next()});
      a.play().catch(function(){i++;next()});
    })();
  }
  $('hear').onclick=function(){sayF(STEPS[at].f)};
  $('go').onclick=toggle;
  $('mine').onclick=function(){ if(takes[at])new Audio(takes[at]).play().catch(function(){}) };
  $('prev').onclick=function(){at=(at-1+STEPS.length)%STEPS.length;draw()};
  $('next').onclick=function(){at=(at+1)%STEPS.length;draw()};
  draw();
})();
</script>
</body>
</html>
