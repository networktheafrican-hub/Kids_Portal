<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Which One Is Different?</title>
<!-- Kids_Portal · Food/odd-one-out.html · slug: food-odd -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#FBF6EC;font-family:'Comic Sans MS','Chalkboard SE','Segoe UI',cursive,sans-serif;
    padding:16px 12px 40px;color:#2d1b0a;text-align:center}
  .card{max-width:660px;margin:0 auto;background:#FFF8E6;border-radius:30px;padding:20px 16px 26px;
    border:6px solid #C8901E;box-shadow:0 10px 22px rgba(0,0,0,.12)}
  h1{font-size:1.7rem;color:#A81B1B;text-shadow:2px 2px 0 #feda7a}
  .sub{font-size:1rem;color:#4d2f12;background:#ffe39c;padding:6px 18px;border-radius:40px;
    display:inline-block;margin:10px 0;border:3px solid #f8b86a}
  .status{background:#fff1c7;border:3px solid #f7b86a;border-radius:40px;padding:9px 16px;
    font-weight:bold;font-size:1rem;margin:16px auto 0;max-width:470px;min-height:2.8em}
  .fin{background:#f5c542;border:4px solid #af6f2a;border-radius:40px;padding:12px 30px;
    font-size:1.15rem;font-weight:bold;color:#2d1b0a;box-shadow:0 5px 0 #7a4d1a;cursor:pointer;
    font-family:inherit;margin-top:16px}
  .dots{display:flex;gap:5px;justify-content:center;margin:12px 0 4px}
  .dots i{width:20px;height:11px;border-radius:4px;background:#EFE7D7;border:2px solid #14563A}
  .dots i.hit{background:#14563A}.dots i.miss{background:#A81B1B;border-color:#6E1111}
  .opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
  .opt{background:#fef7e6;border:4px solid #b48b3a;border-radius:22px;padding:12px 18px;
    min-width:96px;font-size:1.25rem;font-weight:bold;color:#1f3a2f;font-family:inherit;
    cursor:pointer;box-shadow:0 5px 0 #7a5a1f;transition:.12s}
  .opt:active{transform:translateY(3px);box-shadow:0 2px 0 #7a5a1f}
  .opt.ok{background:#14563A;color:#fff;border-color:#0d3a26}
  .opt.no{background:#A81B1B;color:#fff;border-color:#6E1111;animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
    75%{transform:translateX(7px)}}
  :focus-visible{outline:3px solid #A81B1B;outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  @media(min-width:700px){h1{font-size:2.2rem}}

  .q2{background:#14563A;color:#fff;border:5px solid #f3d48a;border-radius:26px;padding:15px;
    font-size:1.15rem;font-weight:bold;margin:14px 0}
  .four{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
  .one{background:#fff;border:4px solid #b48b3a;border-radius:22px;padding:14px 6px;
    cursor:pointer;font-family:inherit;box-shadow:0 5px 0 #7a5a1f;text-align:center}
  .one .ic{font-size:2.6rem;display:block;line-height:1}
  .one .w{font-size:.92rem;font-weight:bold;color:#492f16;margin-top:3px;word-break:break-word}
  .one.ok{background:#14563A;color:#fff;border-color:#0d3a26}
  .one.ok .w{color:#fff}
  .one.no{background:#A81B1B;color:#fff;border-color:#6E1111;animation:shake .35s}
  .one.no .w{color:#fff}
  @media(min-width:520px){.four{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="card">
  <h1>🧩 Which One Is Different?</h1>
  <span class="sub">Three belong together. One does not.</span>
  <div class="dots" id="dots"></div>
  <p class="q2" id="q2">Find the odd one.</p>
  <div class="four" id="four"></div>
  <p class="status" id="status"></p>
  <div id="end"></div>
</div>
<script>
var FD=[
 {w:'bankye',      en:'cassava',        f:'cassava',    ic:'🥔', g:'root'},
 {w:'borɔdeɛ',     en:'plantain',       f:'plantain',   ic:'🍌', g:'root'},
 {w:'bayerɛ',      en:'yam',            f:'yam',        ic:'🍠', g:'root'},
 {w:'mankani',     en:'cocoyam',        f:'cocoyam',    ic:'🟤', g:'root'},
 {w:'aborɔdwomaa', en:'potato',         f:'potato',     ic:'🥔', g:'root'},
 {w:'aburoo',      en:'maize',          f:'maize',      ic:'🌽', g:'grain'},
 {w:'ɛmo',         en:'rice',           f:'rice',       ic:'🍚', g:'grain'},
 {w:'gyeene',      en:'onion',          f:'onion',      ic:'🧅', g:'veg'},
 {w:'mako',        en:'pepper',         f:'pepper',     ic:'🌶️', g:'veg'},
 {w:'ntoosi',      en:'tomato',         f:'tomato',     ic:'🍅', g:'veg'},
 {w:'nyaadewa',    en:'garden egg',     f:'gardenegg',  ic:'🍆', g:'veg'},
 {w:'nkuruma',     en:'okro',           f:'okro',       ic:'🫑', g:'veg'},
 {w:'kontommire',  en:'cocoyam leaves', f:'kontommire', ic:'🥬', g:'veg'},
 {w:'adua',        en:'bean',           f:'bean',       ic:'🫘', g:'grain'},
 {w:'kosua',       en:'egg',            f:'egg',        ic:'🥚', g:'protein'},
 {w:'nsuomnam',    en:'fish',           f:'fish',       ic:'🐟', g:'protein'},
 {w:'paanoo',      en:'bread',          f:'paanoo',     ic:'🍞', g:'made'},
 {w:'nkyene',      en:'salt',           f:'salt',       ic:'🧂', g:'made'}
];
var FGROUP={root:'grows under the ground',grain:'a grain or seed',
            veg:'a vegetable',protein:'from an animal',made:'made in a kitchen'};

/* Real Ghanaian dishes. Getting the ingredients right is knowledge a child
   picks up in their grandmother's kitchen, not from a word list. */
var DISHES=[
 {name:'Kontommire stew', tw:'Kontommire abomu',  ic:'🥬',
  need:['kontommire','ntoosi','gyeene','mako']},
 {name:'Light soup',      tw:'Nkrakra',           ic:'🍲',
  need:['ntoosi','gyeene','mako','nsuomnam']},
 {name:'Red red',         tw:'Adua ne borɔdeɛ',   ic:'🫘',
  need:['adua','borɔdeɛ','ntoosi','gyeene']},
 {name:'Fufu and soup',   tw:'Fufuo',             ic:'🥣',
  need:['bankye','borɔdeɛ','nsuomnam','mako']},
 {name:'Okro stew',       tw:'Nkuruma abomu',     ic:'🫑',
  need:['nkuruma','ntoosi','mako','nsuomnam']}
];
var DNUM={1:'baako',2:'mmienu',3:'mmiensa',4:'ɛnan',5:'enum'};
var DNUMF={1:'one',2:'two',3:'three',4:'four',5:'five'};
var byFd={}; FD.forEach(function(x){byFd[x.w]=x});
function sayFd(f){var a=new Audio('/audio?f=food/'+encodeURIComponent(f+'.m4a'));
  a.play().catch(function(){});return a}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));
  var t=a[i];a[i]=a[j];a[j]=t}return a}
function report(s,m){if(window.__sent||window.parent===window)return;window.__sent=1;
  parent.postMessage({type:'sg:complete',score:s,maxScore:m},'*')}

(function(){
  var TOTAL=8;
  /* Three from one group, one from another. The child has to work out what
     the three have in common before they can spot the stranger. */
  var byGroup={};
  FD.forEach(function(x){(byGroup[x.g]=byGroup[x.g]||[]).push(x)});
  var usable=Object.keys(byGroup).filter(function(k){return byGroup[k].length>=3});

  var quiz=[],guard=0;
  while(quiz.length<TOTAL&&guard<500){
    guard++;
    var g=usable[Math.floor(Math.random()*usable.length)];
    var trio=shuffle(byGroup[g].slice()).slice(0,3);
    var others=FD.filter(function(x){return x.g!==g});
    var odd=others[Math.floor(Math.random()*others.length)];
    quiz.push({trio:trio,odd:odd,g:g});
  }
  var at=0,score=0,lock=false,marks=[];
  var fourEl=document.getElementById('four'),statusEl=document.getElementById('status'),
      dotsEl=document.getElementById('dots'),endEl=document.getElementById('end'),
      q2El=document.getElementById('q2');
  function dots(){dotsEl.innerHTML='';for(var k=0;k<TOTAL;k++){var e=document.createElement('i');
    if(marks[k]===true)e.className='hit';else if(marks[k]===false)e.className='miss';
    dotsEl.appendChild(e)}}
  function show(){
    if(at>=quiz.length)return finish();
    lock=false;var q=quiz[at];
    q2El.textContent='Three of these belong together. Which is the stranger?';
    statusEl.textContent='Take your time.';dots();
    fourEl.innerHTML='';
    shuffle(q.trio.concat([q.odd])).forEach(function(x){
      var b=document.createElement('button');b.className='one';b.type='button';b.dataset.w=x.w;
      b.innerHTML='<span class="ic">'+x.ic+'</span><span class="w">'+x.w+'</span>';
      b.onclick=function(){answer(b,x,q)};fourEl.appendChild(b);
    });
  }
  function answer(btn,x,q){
    if(lock)return;lock=true;
    var ok=x.w===q.odd.w;marks[at]=ok;
    if(ok){score++;btn.classList.add('ok');
      statusEl.textContent='✅ Yes — the other three '+FGROUP[q.g]+'.'}
    else{btn.classList.add('no');
      Array.prototype.forEach.call(fourEl.children,function(c){
        if(c.dataset.w===q.odd.w)c.classList.add('ok')});
      statusEl.textContent='❌ '+q.odd.w+' was the stranger — the other three '+FGROUP[q.g]+'.'}
    sayFd(q.odd.f);dots();at++;setTimeout(show,2300);
  }
  function finish(){
    dots();q2El.textContent='🎉';fourEl.innerHTML='';
    statusEl.textContent='You got '+score+' out of '+TOTAL+'.';
    endEl.innerHTML='<button class="fin" id="again">🔄 Play again</button>';
    document.getElementById('again').onclick=function(){location.reload()};
    report(score,TOTAL);
  }
  show();
})();
</script>
</body>
</html>
