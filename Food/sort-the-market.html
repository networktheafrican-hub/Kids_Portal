<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sort the Market</title>
<!-- Kids_Portal · Food/sort-the-market.html · slug: food-sort -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#FBF6EC;font-family:'Comic Sans MS','Chalkboard SE','Segoe UI',cursive,sans-serif;
    padding:16px 12px 40px;color:#2d1b0a;text-align:center}
  .card{max-width:660px;margin:0 auto;background:#FFF8E6;border-radius:30px;padding:20px 16px 26px;
    border:6px solid #C8901E;box-shadow:0 10px 22px rgba(0,0,0,.12)}
  h1{font-size:1.7rem;color:#A81B1B;text-shadow:2px 2px 0 #feda7a}
  .sub{font-size:1rem;color:#4d2f12;background:#ffe39c;padding:6px 18px;border-radius:40px;
    display:inline-block;margin:10px 0;border:3px solid #f8b86a}
  .status{background:#fff1c7;border:3px solid #f7b86a;border-radius:40px;padding:9px 16px;
    font-weight:bold;font-size:1rem;margin:16px auto 0;max-width:470px;min-height:2.8em}
  .fin{background:#f5c542;border:4px solid #af6f2a;border-radius:40px;padding:12px 30px;
    font-size:1.15rem;font-weight:bold;color:#2d1b0a;box-shadow:0 5px 0 #7a4d1a;cursor:pointer;
    font-family:inherit;margin-top:16px}
  .dots{display:flex;gap:5px;justify-content:center;margin:12px 0 4px}
  .dots i{width:20px;height:11px;border-radius:4px;background:#EFE7D7;border:2px solid #14563A}
  .dots i.hit{background:#14563A}.dots i.miss{background:#A81B1B;border-color:#6E1111}
  .opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
  .opt{background:#fef7e6;border:4px solid #b48b3a;border-radius:22px;padding:12px 18px;
    min-width:96px;font-size:1.25rem;font-weight:bold;color:#1f3a2f;font-family:inherit;
    cursor:pointer;box-shadow:0 5px 0 #7a5a1f;transition:.12s}
  .opt:active{transform:translateY(3px);box-shadow:0 2px 0 #7a5a1f}
  .opt.ok{background:#14563A;color:#fff;border-color:#0d3a26}
  .opt.no{background:#A81B1B;color:#fff;border-color:#6E1111;animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
    75%{transform:translateX(7px)}}
  :focus-visible{outline:3px solid #A81B1B;outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  @media(min-width:700px){h1{font-size:2.2rem}}

  .item{background:#14563A;color:#fff;border:5px solid #f3d48a;border-radius:26px;padding:16px;
    margin:14px 0;min-height:132px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:6px}
  .item .pic{background:#fff;border-radius:20px;padding:8px;display:inline-flex}
  .item .w{font-size:1.3rem;font-weight:bold}
  .bins{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .bin{flex:1 1 150px;max-width:210px;border:4px solid #b48b3a;border-radius:24px;padding:14px 10px;
    font-size:1rem;font-weight:bold;font-family:inherit;cursor:pointer;box-shadow:0 5px 0 #7a5a1f;
    background:#fef7e6;color:#1f3a2f}
  .bin .e{font-size:1.9rem;display:block}
  .bin:active{transform:translateY(3px);box-shadow:0 2px 0 #7a5a1f}
  .bin.ok{background:#14563A;color:#fff;border-color:#0d3a26}
  .bin.no{background:#A81B1B;color:#fff;border-color:#6E1111;animation:shake .35s}
</style>
</head>
<body>
<div class="card">
  <h1>🧺 Sort the Market</h1>
  <span class="sub">Where does it belong?</span>
  <div class="dots" id="dots"></div>
  <div class="item" id="item"></div>
  <div class="bins" id="bins"></div>
  <p class="status" id="status"></p>
  <div id="end"></div>
</div>
<script>
/* Root crops have no distinct emoji, so the four that would collide are drawn.
   Everything else uses an emoji that reads clearly at small size. */
function rootSVG(kind){
  var S='<svg viewBox="0 0 100 100" width="100%" height="100%">';
  var LN='#5A3A1E';
  if(kind==='cassava')
    return S+'<path d="M28 14 C40 8 52 16 56 34 C60 54 66 74 74 88 C66 92 58 86 52 72 C44 52 38 34 28 26 Z" fill="#C9A87C" stroke="'+LN+'" stroke-width="4"/>'
      +'<path d="M34 22 L46 44 M44 48 L56 70" stroke="'+LN+'" stroke-width="3" opacity=".5"/>'
      +'<path d="M26 16 C18 6 34 2 32 12" fill="#3F7A34" stroke="'+LN+'" stroke-width="3"/></svg>';
  if(kind==='yam')
    return S+'<path d="M36 10 C58 10 66 26 64 50 C62 74 58 90 48 92 C36 92 32 74 32 50 C32 28 26 10 36 10 Z" fill="#8B6238" stroke="'+LN+'" stroke-width="4"/>'
      +'<path d="M40 26 L54 30 M38 48 L58 52 M40 70 L54 72" stroke="'+LN+'" stroke-width="3" opacity=".45"/></svg>';
  if(kind==='cocoyam')
    return S+'<ellipse cx="50" cy="58" rx="28" ry="32" fill="#A9835A" stroke="'+LN+'" stroke-width="4"/>'
      +'<path d="M24 44 Q50 52 76 44 M24 62 Q50 70 76 62 M26 76 Q50 82 74 76" stroke="'+LN+'" stroke-width="3" fill="none" opacity=".5"/>'
      +'<path d="M50 26 C44 12 58 8 56 22" fill="#3F7A34" stroke="'+LN+'" stroke-width="3"/></svg>';
  return S+'<ellipse cx="50" cy="54" rx="34" ry="26" fill="#D2B48C" stroke="'+LN+'" stroke-width="4"/>'
    +'<circle cx="38" cy="46" r="3" fill="'+LN+'" opacity=".6"/>'
    +'<circle cx="58" cy="60" r="3" fill="'+LN+'" opacity=".6"/>'
    +'<circle cx="64" cy="42" r="2.5" fill="'+LN+'" opacity=".6"/></svg>';
}
var FOOD=[
 {w:'bankye',      en:'cassava',       f:'cassava',    svg:'cassava',  grp:'staple'},
 {w:'borɔdeɛ',     en:'plantain',      f:'plantain',   e:'🍌',        grp:'staple'},
 {w:'bayerɛ',      en:'yam',           f:'yam',        svg:'yam',      grp:'staple'},
 {w:'mankani',     en:'cocoyam',       f:'cocoyam',    svg:'cocoyam',  grp:'staple'},
 {w:'aborɔdwomaa', en:'potato',        f:'potato',     svg:'potato',   grp:'staple'},
 {w:'aburoo',      en:'maize',         f:'maize',      e:'🌽',        grp:'staple'},
 {w:'gyeene',      en:'onion',         f:'onion',      e:'🧅',        grp:'veg'},
 {w:'mako',        en:'pepper',        f:'pepper',     e:'🌶️',        grp:'veg'},
 {w:'ntoosi',      en:'tomato',        f:'tomato',     e:'🍅',        grp:'veg'},
 {w:'nyaadewa',    en:'garden egg',    f:'gardenegg',  e:'🍆',        grp:'veg'},
 {w:'nkuruma',     en:'okro',          f:'okro',       e:'🫑',        grp:'veg'},
 {w:'kontommire',  en:'cocoyam leaves',f:'kontommire', e:'🥬',        grp:'veg'},
 {w:'ɛmo',         en:'rice',          f:'rice',       e:'🍚',        grp:'daily'},
 {w:'adua',        en:'bean',          f:'bean',       e:'🫘',        grp:'daily'},
 {w:'kosua',       en:'egg',           f:'egg',        e:'🥚',        grp:'daily'},
 {w:'paanoo',      en:'bread',         f:'paanoo',     e:'🍞',        grp:'daily'},
 {w:'nsuomnam',    en:'fish',          f:'fish',       e:'🐟',        grp:'daily'},
 {w:'nkyene',      en:'salt',          f:'salt',       e:'🧂',        grp:'daily'}
];
var FGRP={staple:'From the farm',veg:'Vegetables',daily:'Everyday food'};
var DNUM={1:'baako',2:'mmienu',3:'mmiensa',4:'ɛnan',5:'enum',6:'nsia',7:'nson',8:'nwɔtwe',9:'nkron',10:'du'};
function foodPic(x,px){
  px=px||64;
  return x.svg
    ? '<span style="display:inline-block;width:'+px+'px;height:'+px+'px">'+rootSVG(x.svg)+'</span>'
    : '<span style="font-size:'+Math.round(px*0.86)+'px;line-height:1">'+x.e+'</span>';
}
function sayD(f){var a=new Audio('/audio?f=food/'+encodeURIComponent(f+'.m4a'));
  a.play().catch(function(){});return a}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));
  var t=a[i];a[i]=a[j];a[j]=t}return a}
function report(s,m){if(window.__sent||window.parent===window)return;window.__sent=1;
  parent.postMessage({type:'sg:complete',score:s,maxScore:m},'*')}

(function(){
  var TOTAL=8;
  var BINS=[{g:'staple',t:'From the farm',e:'🌾'},{g:'veg',t:'Vegetables',e:'🥬'},
            {g:'daily',t:'Everyday food',e:'🍚'}];
  /* Even spread across the three groups so guessing one bin cannot win. */
  var quiz=[];
  ['staple','veg','daily'].forEach(function(g){
    quiz=quiz.concat(shuffle(FOOD.filter(function(x){return x.grp===g})).slice(0,3));
  });
  quiz=shuffle(quiz).slice(0,TOTAL);
  var at=0,score=0,lock=false,marks=[];
  var itemEl=document.getElementById('item'),binsEl=document.getElementById('bins'),
      statusEl=document.getElementById('status'),dotsEl=document.getElementById('dots'),
      endEl=document.getElementById('end');
  function dots(){dotsEl.innerHTML='';for(var k=0;k<TOTAL;k++){var e=document.createElement('i');
    if(marks[k]===true)e.className='hit';else if(marks[k]===false)e.className='miss';
    dotsEl.appendChild(e)}}
  function show(){
    if(at>=quiz.length)return finish();
    lock=false;var q=quiz[at];
    itemEl.innerHTML='<span class="pic">'+foodPic(q,72)+'</span><span class="w">'+q.w+'</span>';
    statusEl.textContent='Which basket does it go in?';dots();sayD(q.f);
    binsEl.innerHTML='';
    BINS.forEach(function(b){
      var el=document.createElement('button');el.className='bin';el.type='button';
      el.innerHTML='<span class="e">'+b.e+'</span>'+b.t;el.dataset.g=b.g;
      el.onclick=function(){answer(el,b,q)};binsEl.appendChild(el);
    });
  }
  function answer(el,b,q){
    if(lock)return;lock=true;
    var right=b.g===q.grp;marks[at]=right;
    el.classList.add(right?'ok':'no');
    if(right){score++;statusEl.textContent='✅ Yes — '+q.w+' is '+FGRP[q.grp].toLowerCase()+'.'}
    else{
      Array.prototype.forEach.call(binsEl.children,function(c){
        if(c.dataset.g===q.grp)c.classList.add('ok')});
      statusEl.textContent='❌ '+q.w+' belongs in '+FGRP[q.grp].toLowerCase()+'.';
    }
    dots();at++;setTimeout(show,1700);
  }
  function finish(){
    dots();itemEl.innerHTML='<span class="w">🎉</span>';binsEl.innerHTML='';
    statusEl.textContent='You got '+score+' out of '+TOTAL+'.';
    endEl.innerHTML='<button class="fin" id="again">🔄 Play again</button>';
    document.getElementById('again').onclick=function(){location.reload()};
    report(score,TOTAL);
  }
  show();
})();
</script>
</body>
</html>
