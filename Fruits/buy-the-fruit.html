<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Buy the Fruit</title>
<!-- Kids_Portal · Fruits/buy-the-fruit.html · slug: fruit-buy -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#FBF6EC;font-family:'Comic Sans MS','Chalkboard SE','Segoe UI',cursive,sans-serif;
    padding:16px 12px 40px;color:#2d1b0a;text-align:center}
  .card{max-width:660px;margin:0 auto;background:#FFF8E6;border-radius:30px;padding:20px 16px 26px;
    border:6px solid #C8901E;box-shadow:0 10px 22px rgba(0,0,0,.12)}
  h1{font-size:1.7rem;color:#A81B1B;text-shadow:2px 2px 0 #feda7a}
  .sub{font-size:1rem;color:#4d2f12;background:#ffe39c;padding:6px 18px;border-radius:40px;
    display:inline-block;margin:10px 0;border:3px solid #f8b86a}
  .status{background:#fff1c7;border:3px solid #f7b86a;border-radius:40px;padding:9px 16px;
    font-weight:bold;font-size:1rem;margin:16px auto 0;max-width:470px;min-height:2.8em}
  .fin{background:#f5c542;border:4px solid #af6f2a;border-radius:40px;padding:12px 30px;
    font-size:1.15rem;font-weight:bold;color:#2d1b0a;box-shadow:0 5px 0 #7a4d1a;cursor:pointer;
    font-family:inherit;margin-top:16px}
  .dots{display:flex;gap:5px;justify-content:center;margin:12px 0 4px}
  .dots i{width:20px;height:11px;border-radius:4px;background:#EFE7D7;border:2px solid #14563A}
  .dots i.hit{background:#14563A}.dots i.miss{background:#A81B1B;border-color:#6E1111}
  .opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
  .opt{background:#fef7e6;border:4px solid #b48b3a;border-radius:22px;padding:12px 18px;
    min-width:96px;font-size:1.25rem;font-weight:bold;color:#1f3a2f;font-family:inherit;
    cursor:pointer;box-shadow:0 5px 0 #7a5a1f;transition:.12s}
  .opt:active{transform:translateY(3px);box-shadow:0 2px 0 #7a5a1f}
  .opt.ok{background:#14563A;color:#fff;border-color:#0d3a26}
  .opt.no{background:#A81B1B;color:#fff;border-color:#6E1111;animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
    75%{transform:translateX(7px)}}
  :focus-visible{outline:3px solid #A81B1B;outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  @media(min-width:700px){h1{font-size:2.2rem}}

  .stall{background:#d9e9b0;border:5px solid #14563A;border-radius:26px;padding:16px 12px;
    margin:14px 0;min-height:130px;display:flex;align-items:center;justify-content:center;
    gap:10px;flex-wrap:wrap}
  .order{background:#14563A;color:#fff;border-radius:20px;padding:14px;font-size:1.25rem;
    font-weight:bold;border:4px solid #f3d48a;margin-top:4px}
  .order small{display:block;font-size:.85rem;opacity:.85;font-weight:700;margin-top:3px}
  .basket{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:54px;
    background:#fff;border:4px dashed #cb7b2c;border-radius:20px;padding:10px;margin-top:10px;
    font-size:2rem;align-items:center}
  .basket .empty{font-size:.9rem;color:#8a7a5a;font-weight:bold}
  .shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
  .pick{background:#fff;border:4px solid #b48b3a;border-radius:20px;padding:9px 3px;
    cursor:pointer;font-family:inherit;box-shadow:0 5px 0 #7a5a1f;text-align:center}
  .pick .ic{font-size:2rem;display:block;line-height:1}
  .pick .w{font-size:.68rem;font-weight:bold;color:#492f16;word-break:break-word}
  .row2{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
  .act{background:#f5c542;border:4px solid #af6f2a;border-radius:40px;padding:11px 22px;
    font-size:1rem;font-weight:bold;color:#2d1b0a;box-shadow:0 5px 0 #7a4d1a;cursor:pointer;
    font-family:inherit}
  .act.clear{background:#e8d9bd}
  @media(min-width:560px){.shelf{grid-template-columns:repeat(7,1fr)}}
</style>
</head>
<body>
<div class="card">
  <h1>🧺 Buy the Fruit</h1>
  <span class="sub">Ama asks for it in Twi. Fill her basket.</span>
  <div class="dots" id="dots"></div>
  <p class="order" id="order"></p>
  <div class="basket" id="basket"></div>
  <div class="shelf" id="shelf"></div>
  <div class="row2">
    <button class="act" id="done" type="button">✅ Give it to her</button>
    <button class="act clear" id="clear" type="button">↩️ Empty basket</button>
  </div>
  <p class="status" id="status"></p>
  <div class="gramtip">The fruit comes first, then how many:
    <b>amango mmienu</b> — two mangoes.</div>
  <div id="end"></div>
</div>
<script>
var FR=[
 {w:'ankaa',        en:'orange',     f:'orange',     ic:'🍊', grow:'tree',   size:2},
 {w:'ankaa twadeɛ', en:'lime',       f:'lime',       ic:'🍋', grow:'tree',   size:1},
 {w:'kwadu',        en:'banana',     f:'banana',     ic:'🍌', grow:'plant',  size:2},
 {w:'borɔferɛ',     en:'pawpaw',     f:'pawpaw',     ic:'🍈', grow:'tree',   size:3},
 {w:'aborɔbɛ',      en:'pineapple',  f:'pineapple',  ic:'🍍', grow:'ground', size:3},
 {w:'kube',         en:'coconut',    f:'coconut',    ic:'🥥', grow:'palm',   size:3},
 {w:'paya',         en:'pear',       f:'pear',       ic:'🥑', grow:'tree',   size:2},
 {w:'amango',       en:'mango',      f:'mango',      ic:'🥭', grow:'tree',   size:2},
 {w:'anamuna',      en:'watermelon', f:'watermelon', ic:'🍉', grow:'ground', size:4},
 {w:'abɛ',          en:'palm fruit', f:'palmfruit',  ic:'🌴', grow:'palm',   size:1},
 {w:'atadwe',       en:'tigernut',   f:'tigernut',   ic:'🌰', grow:'ground', size:1},
 {w:'nkateɛ',       en:'groundnut',  f:'groundnut',  ic:'🥜', grow:'ground', size:1},
 {w:'ahwedeɛ',      en:'sugarcane',  f:'sugarcane',  ic:'🎋', grow:'plant',  size:3}
];
/* Where a thing grows is real knowledge a diaspora child rarely has: nkateɛ
   and atadwe come out of the soil, kube and abɛ off a palm. */
var GROW=[
 {k:'tree',   t:'Dua so',      en:'on a tree',   ic:'🌳'},
 {k:'palm',   t:'Abɛ so',      en:'on a palm',   ic:'🌴'},
 {k:'ground', t:'Fam',         en:'in the ground', ic:'🪴'},
 {k:'plant',  t:'Afifideɛ so', en:'on a plant',  ic:'🌱'}
];
var FNUM={1:'baako',2:'mmienu',3:'mmiensa',4:'ɛnan',5:'enum'};
var FNUMF={1:'one',2:'two',3:'three',4:'four',5:'five'};
var byFr={}; FR.forEach(function(x){byFr[x.w]=x});
function sayFr(f){var a=new Audio('/audio?f=fruits/'+encodeURIComponent(f+'.m4a'));
  a.play().catch(function(){});return a}
function sayFnum(f){var a=new Audio('/audio?f=twi-numbers/'+encodeURIComponent(f+'.m4a'));
  a.play().catch(function(){});return a}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));
  var t=a[i];a[i]=a[j];a[j]=t}return a}
function report(s,m){if(window.__sent||window.parent===window)return;window.__sent=1;
  parent.postMessage({type:'sg:complete',score:s,maxScore:m},'*')}

(function(){
  var TOTAL=6;
  /* Listening plus counting plus choosing - the three things a market actually
     asks of you, in one game. */
  var quiz=[];
  for(var i=0;i<TOTAL;i++){
    quiz.push({fr:FR[Math.floor(Math.random()*FR.length)], n:1+Math.floor(Math.random()*5)});
  }
  var at=0,score=0,lock=false,marks=[],basket=[];
  var orderEl=document.getElementById('order'),basketEl=document.getElementById('basket'),
      shelfEl=document.getElementById('shelf'),statusEl=document.getElementById('status'),
      dotsEl=document.getElementById('dots'),endEl=document.getElementById('end');
  function dots(){dotsEl.innerHTML='';for(var k=0;k<TOTAL;k++){var e=document.createElement('i');
    if(marks[k]===true)e.className='hit';else if(marks[k]===false)e.className='miss';
    dotsEl.appendChild(e)}}
  function drawBasket(){
    if(!basket.length){basketEl.innerHTML='<span class="empty">basket is empty</span>';return}
    basketEl.innerHTML=basket.map(function(x){return x.ic}).join('');
  }
  function show(){
    if(at>=quiz.length)return finish();
    lock=false;basket=[];
    var q=quiz[at];
    orderEl.innerHTML='🗣️ "Mepɛ '+q.fr.w+' '+FNUM[q.n]+'"'
      +'<small>I want '+q.n+' '+q.fr.en+'</small>';
    sayFr(q.fr.f);
    setTimeout(function(){sayFnum(FNUMF[q.n])},900);
    statusEl.textContent='Tap the fruit until you have the right number.';
    drawBasket();dots();
    shelfEl.innerHTML='';
    FR.forEach(function(x){
      var b=document.createElement('button');b.className='pick';b.type='button';
      b.innerHTML='<span class="ic">'+x.ic+'</span><span class="w">'+x.w+'</span>';
      b.onclick=function(){
        if(lock||basket.length>=8)return;
        basket.push(x);sayFr(x.f);drawBasket();
      };
      shelfEl.appendChild(b);
    });
  }
  document.getElementById('clear').onclick=function(){ if(!lock){basket=[];drawBasket()} };
  document.getElementById('done').onclick=function(){
    if(lock)return;
    var q=quiz[at];
    if(!basket.length){statusEl.textContent='The basket is still empty.';return}
    lock=true;
    var rightFruit=basket.every(function(x){return x.w===q.fr.w});
    var ok=rightFruit&&basket.length===q.n;
    marks[at]=ok;
    if(ok){score++;statusEl.textContent='✅ Perfect — '+q.fr.w+' '+FNUM[q.n]+'.'}
    else if(!rightFruit)statusEl.textContent='❌ She asked for '+q.fr.w+' — '+q.fr.en+'.';
    else statusEl.textContent='❌ She wanted '+q.n+', you gave '+basket.length+'.';
    dots();at++;setTimeout(show,2000);
  };
  function finish(){
    dots();orderEl.textContent='🎉';basketEl.innerHTML='';shelfEl.innerHTML='';
    document.querySelector('.row2').style.display='none';
    statusEl.textContent='You filled '+score+' of '+TOTAL+' orders correctly.';
    endEl.innerHTML='<button class="fin" id="again">🔄 Play again</button>';
    document.getElementById('again').onclick=function(){location.reload()};
    report(score,TOTAL);
  }
  show();
})();
</script>
</body>
</html>
