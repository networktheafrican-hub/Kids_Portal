<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Where Does It Grow?</title>
<!-- Kids_Portal · Fruits/where-does-it-grow.html · slug: fruit-grow -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#FBF6EC;font-family:'Comic Sans MS','Chalkboard SE','Segoe UI',cursive,sans-serif;
    padding:16px 12px 40px;color:#2d1b0a;text-align:center}
  .card{max-width:660px;margin:0 auto;background:#FFF8E6;border-radius:30px;padding:20px 16px 26px;
    border:6px solid #C8901E;box-shadow:0 10px 22px rgba(0,0,0,.12)}
  h1{font-size:1.7rem;color:#A81B1B;text-shadow:2px 2px 0 #feda7a}
  .sub{font-size:1rem;color:#4d2f12;background:#ffe39c;padding:6px 18px;border-radius:40px;
    display:inline-block;margin:10px 0;border:3px solid #f8b86a}
  .status{background:#fff1c7;border:3px solid #f7b86a;border-radius:40px;padding:9px 16px;
    font-weight:bold;font-size:1rem;margin:16px auto 0;max-width:470px;min-height:2.8em}
  .fin{background:#f5c542;border:4px solid #af6f2a;border-radius:40px;padding:12px 30px;
    font-size:1.15rem;font-weight:bold;color:#2d1b0a;box-shadow:0 5px 0 #7a4d1a;cursor:pointer;
    font-family:inherit;margin-top:16px}
  .dots{display:flex;gap:5px;justify-content:center;margin:12px 0 4px}
  .dots i{width:20px;height:11px;border-radius:4px;background:#EFE7D7;border:2px solid #14563A}
  .dots i.hit{background:#14563A}.dots i.miss{background:#A81B1B;border-color:#6E1111}
  .opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
  .opt{background:#fef7e6;border:4px solid #b48b3a;border-radius:22px;padding:12px 18px;
    min-width:96px;font-size:1.25rem;font-weight:bold;color:#1f3a2f;font-family:inherit;
    cursor:pointer;box-shadow:0 5px 0 #7a5a1f;transition:.12s}
  .opt:active{transform:translateY(3px);box-shadow:0 2px 0 #7a5a1f}
  .opt.ok{background:#14563A;color:#fff;border-color:#0d3a26}
  .opt.no{background:#A81B1B;color:#fff;border-color:#6E1111;animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
    75%{transform:translateX(7px)}}
  :focus-visible{outline:3px solid #A81B1B;outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  @media(min-width:700px){h1{font-size:2.2rem}}

  .q{background:#14563A;color:#fff;border:5px solid #f3d48a;border-radius:26px;padding:18px 16px;
    font-size:1.1rem;font-weight:bold;margin:14px 0;min-height:150px;display:flex;
    align-items:center;justify-content:center;flex-direction:column;gap:6px}
  .q .huge{font-size:1.9rem;line-height:1.25;word-break:break-word}
  .q .em{font-size:4rem;line-height:1}
  .q .en{font-size:.9rem;opacity:.85;font-weight:700}
  .result{font-size:1.35rem;font-weight:bold;color:#14563A;margin-top:12px}
  .gramtip{background:#21274D;color:#fff;border-radius:18px;padding:11px 14px;margin-top:14px;
    border:3px solid #C8901E;font-size:.86rem;font-weight:700;line-height:1.5}
  .gramtip b{color:#E9C97A}

  .bins{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:6px}
  .bin{background:#fef7e6;border:4px solid #b48b3a;border-radius:22px;padding:14px 8px;
    font-size:1.02rem;font-weight:bold;color:#1f3a2f;font-family:inherit;cursor:pointer;
    box-shadow:0 5px 0 #7a5a1f}
  .bin .ic{font-size:2.1rem;display:block;line-height:1.1}
  .bin .en{font-size:.74rem;font-weight:700;opacity:.7;display:block}
  .bin.ok{background:#14563A;color:#fff;border-color:#0d3a26}
  .bin.no{background:#A81B1B;color:#fff;border-color:#6E1111;animation:shake .35s}
  @media(min-width:560px){.bins{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="card">
  <h1>🌳 Where Does It Grow?</h1>
  <span class="sub">On a tree, a palm, a plant, or in the ground?</span>
  <div class="dots" id="dots"></div>
  <div class="q" id="q"></div>
  <div class="bins" id="bins"></div>
  <p class="status" id="status"></p>
  <div id="end"></div>
</div>
<script>
var FR=[
 {w:'ankaa',        en:'orange',     f:'orange',     ic:'🍊', grow:'tree',   size:2},
 {w:'ankaa twadeɛ', en:'lime',       f:'lime',       ic:'🍋', grow:'tree',   size:1},
 {w:'kwadu',        en:'banana',     f:'banana',     ic:'🍌', grow:'plant',  size:2},
 {w:'borɔferɛ',     en:'pawpaw',     f:'pawpaw',     ic:'🍈', grow:'tree',   size:3},
 {w:'aborɔbɛ',      en:'pineapple',  f:'pineapple',  ic:'🍍', grow:'ground', size:3},
 {w:'kube',         en:'coconut',    f:'coconut',    ic:'🥥', grow:'palm',   size:3},
 {w:'paya',         en:'pear',       f:'pear',       ic:'🥑', grow:'tree',   size:2},
 {w:'amango',       en:'mango',      f:'mango',      ic:'🥭', grow:'tree',   size:2},
 {w:'anamuna',      en:'watermelon', f:'watermelon', ic:'🍉', grow:'ground', size:4},
 {w:'abɛ',          en:'palm fruit', f:'palmfruit',  ic:'🌴', grow:'palm',   size:1},
 {w:'atadwe',       en:'tigernut',   f:'tigernut',   ic:'🌰', grow:'ground', size:1},
 {w:'nkateɛ',       en:'groundnut',  f:'groundnut',  ic:'🥜', grow:'ground', size:1},
 {w:'ahwedeɛ',      en:'sugarcane',  f:'sugarcane',  ic:'🎋', grow:'plant',  size:3}
];
/* Where a thing grows is real knowledge a diaspora child rarely has: nkateɛ
   and atadwe come out of the soil, kube and abɛ off a palm. */
var GROW=[
 {k:'tree',   t:'Dua so',      en:'on a tree',   ic:'🌳'},
 {k:'palm',   t:'Abɛ so',      en:'on a palm',   ic:'🌴'},
 {k:'ground', t:'Fam',         en:'in the ground', ic:'🪴'},
 {k:'plant',  t:'Afifideɛ so', en:'on a plant',  ic:'🌱'}
];
var FNUM={1:'baako',2:'mmienu',3:'mmiensa',4:'ɛnan',5:'enum'};
var FNUMF={1:'one',2:'two',3:'three',4:'four',5:'five'};
var byFr={}; FR.forEach(function(x){byFr[x.w]=x});
function sayFr(f){var a=new Audio('/audio?f=fruits/'+encodeURIComponent(f+'.m4a'));
  a.play().catch(function(){});return a}
function sayFnum(f){var a=new Audio('/audio?f=twi-numbers/'+encodeURIComponent(f+'.m4a'));
  a.play().catch(function(){});return a}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));
  var t=a[i];a[i]=a[j];a[j]=t}return a}
function report(s,m){if(window.__sent||window.parent===window)return;window.__sent=1;
  parent.postMessage({type:'sg:complete',score:s,maxScore:m},'*')}

(function(){
  var TOTAL=9;
  var quiz=shuffle(FR.slice()).slice(0,TOTAL);
  var at=0,score=0,lock=false,marks=[];
  var qEl=document.getElementById('q'),binsEl=document.getElementById('bins'),
      statusEl=document.getElementById('status'),dotsEl=document.getElementById('dots'),
      endEl=document.getElementById('end');
  function dots(){dotsEl.innerHTML='';for(var k=0;k<TOTAL;k++){var e=document.createElement('i');
    if(marks[k]===true)e.className='hit';else if(marks[k]===false)e.className='miss';
    dotsEl.appendChild(e)}}
  function show(){
    if(at>=quiz.length)return finish();
    lock=false;var q=quiz[at];
    qEl.innerHTML='<span class="em">'+q.ic+'</span><span class="huge">'+q.w+'</span>'
      +'<span class="en">'+q.en+'</span>';
    statusEl.textContent='Where does it come from?';dots();sayFr(q.f);
    binsEl.innerHTML='';
    GROW.forEach(function(z){
      var b=document.createElement('button');b.className='bin';b.type='button';
      b.dataset.k=z.k;
      b.innerHTML='<span class="ic">'+z.ic+'</span>'+z.t+'<span class="en">'+z.en+'</span>';
      b.onclick=function(){answer(b,z,q)};binsEl.appendChild(b);
    });
  }
  function answer(btn,z,q){
    if(lock)return;lock=true;
    var ok=z.k===q.grow;marks[at]=ok;
    var right=GROW.filter(function(x){return x.k===q.grow})[0];
    if(ok){score++;btn.classList.add('ok');
      statusEl.textContent='✅ '+q.w+' grows '+right.en+'.'}
    else{btn.classList.add('no');
      Array.prototype.forEach.call(binsEl.children,function(c){
        if(c.dataset.k===q.grow)c.classList.add('ok')});
      statusEl.textContent='❌ '+q.w+' grows '+right.en+'.'}
    dots();at++;setTimeout(show,1900);
  }
  function finish(){
    dots();qEl.innerHTML='<span class="em">🎉</span>';binsEl.innerHTML='';
    statusEl.textContent='You got '+score+' out of '+TOTAL+'.';
    endEl.innerHTML='<button class="fin" id="again">🔄 Play again</button>';
    document.getElementById('again').onclick=function(){location.reload()};
    report(score,TOTAL);
  }
  show();
})();
</script>
</body>
</html>
