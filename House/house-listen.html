<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Listen and Find</title>
<!-- Kids_Portal · House/house-listen.html · slug: house-listen -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#FBF6EC;font-family:'Comic Sans MS','Chalkboard SE','Segoe UI',cursive,sans-serif;
    padding:16px 12px 40px;color:#2d1b0a;text-align:center}
  .card{max-width:660px;margin:0 auto;background:#FFF8E6;border-radius:30px;padding:20px 16px 26px;
    border:6px solid #C8901E;box-shadow:0 10px 22px rgba(0,0,0,.12)}
  h1{font-size:1.7rem;color:#A81B1B;text-shadow:2px 2px 0 #feda7a}
  .sub{font-size:1rem;color:#4d2f12;background:#ffe39c;padding:6px 18px;border-radius:40px;
    display:inline-block;margin:10px 0;border:3px solid #f8b86a}
  .status{background:#fff1c7;border:3px solid #f7b86a;border-radius:40px;padding:9px 16px;
    font-weight:bold;font-size:1rem;margin:16px auto 0;max-width:470px;min-height:2.8em}
  .fin{background:#f5c542;border:4px solid #af6f2a;border-radius:40px;padding:12px 30px;
    font-size:1.15rem;font-weight:bold;color:#2d1b0a;box-shadow:0 5px 0 #7a4d1a;cursor:pointer;
    font-family:inherit;margin-top:16px}
  .dots{display:flex;gap:5px;justify-content:center;margin:12px 0 4px}
  .dots i{width:20px;height:11px;border-radius:4px;background:#EFE7D7;border:2px solid #14563A}
  .dots i.hit{background:#14563A}.dots i.miss{background:#A81B1B;border-color:#6E1111}
  .opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
  .opt{background:#fef7e6;border:4px solid #b48b3a;border-radius:22px;padding:12px 18px;
    min-width:96px;font-size:1.25rem;font-weight:bold;color:#1f3a2f;font-family:inherit;
    cursor:pointer;box-shadow:0 5px 0 #7a5a1f;transition:.12s}
  .opt:active{transform:translateY(3px);box-shadow:0 2px 0 #7a5a1f}
  .opt.ok{background:#14563A;color:#fff;border-color:#0d3a26}
  .opt.no{background:#A81B1B;color:#fff;border-color:#6E1111;animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
    75%{transform:translateX(7px)}}
  :focus-visible{outline:3px solid #A81B1B;outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  @media(min-width:700px){h1{font-size:2.2rem}}

  .q{background:#14563A;color:#fff;border:5px solid #f3d48a;border-radius:26px;padding:18px 16px;
    font-size:1.1rem;font-weight:bold;margin:14px 0;min-height:136px;display:flex;
    align-items:center;justify-content:center;flex-direction:column;gap:8px}
  .q .huge{font-size:1.9rem;line-height:1.25;word-break:break-word}
  .q .em{font-size:3.4rem;line-height:1}
  .q .spk{background:#fff1c7;border:3px solid #f7b86a;border-radius:40px;padding:8px 20px;
    font-size:1rem;font-weight:bold;color:#4d2f12;cursor:pointer;font-family:inherit}
  .result{font-size:1.35rem;font-weight:bold;color:#14563A;margin-top:12px}

  .big{background:#14563A;color:#fff;border:5px solid #f3d48a;border-radius:30px;font-size:1.2rem;
    font-weight:bold;padding:20px;margin:14px auto;max-width:420px;cursor:pointer;font-family:inherit;
    display:block;width:100%;box-shadow:0 6px 0 #0d3a26}
  .big .em{font-size:2.5rem;display:block}
  .pads{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px}
  .pad{background:#fff;border:4px solid #b48b3a;border-radius:20px;padding:12px 4px;cursor:pointer;
    font-family:inherit;box-shadow:0 5px 0 #7a5a1f;font-size:2.3rem;line-height:1}
  .pad.ok{background:#d4edda;border-color:#14563A;box-shadow:0 0 0 4px #14563A}
  .pad.no{background:#f8d7da;border-color:#A81B1B;animation:shake .35s}
</style>
</head>
<body>
<div class="card">
  <h1>👂 Listen and Find</h1>
  <span class="sub">Hear it, then tap it</span>
  <div class="dots" id="dots"></div>
  <button class="big" id="play"><span class="em">🔊</span>Tap to hear</button>
  <div class="pads" id="pads"></div>
  <p class="status" id="status">Tap the speaker to begin.</p>
  <div id="end"></div>
</div>
<script>
var H=[
 {w:'piam',      e:'bedroom',      f:'bedroom',     g:'room', ic:'😴'},
 {w:'mukaase',   e:'kitchen',      f:'kitchen',     g:'room', ic:'🍳'},
 {w:'adwareeɛ',  e:'bathroom',     f:'bathroom',    g:'room', ic:'🚿'},
 {w:'adidibea',  e:'dining place', f:'diningplace', g:'room', ic:'🍛'},
 {w:'asa so',    e:'hall',         f:'hall',        g:'room', ic:'🛋️'},
 {w:'abranaa so',e:'veranda',      f:'veranda',     g:'room', ic:'🏡'},
 {w:'ɛpono',     e:'door',         f:'door',        g:'room', ic:'🚪'},
 {w:'mpoma',     e:'window',       f:'window',      g:'room', ic:'🪟'},

 {w:'mpa',       e:'bed',          f:'bed',         g:'thing', ic:'🛏️'},
 {w:'sumiiɛ',    e:'pillow',       f:'pillow',      g:'thing', ic:'🛌'},
 {w:'kɛtɛ',      e:'mat',          f:'mat',         g:'thing', ic:'🟫'},
 {w:'kuntu',     e:'blanket',      f:'blanket',     g:'thing', ic:'🧣'},
 {w:'akonnwa',   e:'chair',        f:'chair',       g:'thing', ic:'🪑'},
 {w:'didipono',  e:'eating table', f:'table',       g:'thing', ic:'🍽️'},
 {w:'kanea',     e:'lantern',      f:'lantern',     g:'thing', ic:'🏮'},
 {w:'ahwehwɛ',   e:'mirror',       f:'mirror',      g:'thing', ic:'🪞'},
 {w:'praeɛ',     e:'broom',        f:'broom',       g:'thing', ic:'🧹'},
 {w:'bokiti',    e:'bucket',       f:'bucket',      g:'thing', ic:'🪣'},
 {w:'kyiniiɛ',   e:'umbrella',     f:'umbrella',    g:'thing', ic:'☂️'},

 {w:'atere',     e:'spoon',        f:'spoon',       g:'kitchen', ic:'🥄'},
 {w:'adinam',    e:'fork',         f:'fork',        g:'kitchen', ic:'🍴'},
 {w:'sekammoa',  e:'knife',        f:'knife',       g:'kitchen', ic:'🔪'},
 {w:'prɛte',     e:'plate',        f:'plate',       g:'kitchen', ic:'🥘'},
 {w:'tɔmmɛ',     e:'glass',        f:'glass',       g:'kitchen', ic:'🥛'},
 {w:'waduro',    e:'mortar',       f:'mortar',      g:'kitchen', ic:'🫙'},
 {w:'wɔma',      e:'pestle',       f:'pestle',      g:'kitchen', ic:'🏏'}
];
var HGRP={room:'Rooms and parts of the house',thing:'Things in the house',
          kitchen:'In the kitchen'};
var WHERE=[
 {w:'wɔ',  e:'is at',   f:'isat'},
 {w:'mu',  e:'inside',  f:'inside'},
 {w:'so',  e:'on top',  f:'ontop'},
 {w:'ase', e:'under',   f:'under'}
];
var ADJ=[
 {w:'kɛseɛ',  e:'big',   f:'big',   ic:'🐘'},
 {w:'ketewa', e:'small', f:'small', ic:'🐁'},
 {w:'foforɔ', e:'new',   f:'new',   ic:'✨'},
 {w:'dada',   e:'old',   f:'old',   ic:'🕰️'}
];
var byH={}; H.forEach(function(x){byH[x.f]=x});
function sayH(f){var a=new Audio('/audio?f=house/'+encodeURIComponent(f+'.m4a'));
  a.play().catch(function(){});return a}
function sayHPair(f1,f2){
  var a=sayH(f1);
  a.addEventListener('ended',function(){sayH(f2)});
  return a;
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));
  var t=a[i];a[i]=a[j];a[j]=t}return a}
function report(s,m){if(window.__sent||window.parent===window)return;window.__sent=1;
  parent.postMessage({type:'sg:complete',score:s,maxScore:m},'*')}

(function(){
  var TOTAL=8;
  var quiz=shuffle(H.slice()).slice(0,TOTAL);
  var at=0,score=0,lock=false,heard=false,marks=[];
  var padsEl=document.getElementById('pads'),statusEl=document.getElementById('status'),
      dotsEl=document.getElementById('dots'),endEl=document.getElementById('end'),
      playEl=document.getElementById('play');
  function dots(){dotsEl.innerHTML='';for(var k=0;k<TOTAL;k++){var e=document.createElement('i');
    if(marks[k]===true)e.className='hit';else if(marks[k]===false)e.className='miss';
    dotsEl.appendChild(e)}}
  function show(){
    if(at>=quiz.length)return finish();
    lock=false;heard=false;var q=quiz[at];
    dots();statusEl.textContent='Tap the speaker, then tap the thing.';
    var pool=H.filter(function(x){return x.w!==q.w});
    padsEl.innerHTML='';
    shuffle(shuffle(pool).slice(0,3).concat([q])).forEach(function(o){
      var b=document.createElement('button');b.className='pad';b.type='button';
      b.textContent=o.ic;b.dataset.w=o.w;b.setAttribute('aria-label',o.e);
      b.onclick=function(){pick(b,o,q)};padsEl.appendChild(b)});
  }
  playEl.onclick=function(){heard=true;sayH(quiz[at].f);
    statusEl.textContent='Now tap what you heard.'};
  function pick(btn,o,q){
    if(lock)return;
    if(!heard){statusEl.textContent='👂 Listen first — tap the big speaker.';return}
    lock=true;
    var ok=o.w===q.w;marks[at]=ok;
    if(ok){score++;btn.classList.add('ok')}
    else{btn.classList.add('no');
      Array.prototype.forEach.call(padsEl.children,function(c){
        if(c.dataset.w===q.w)c.classList.add('ok')})}
    statusEl.textContent=(ok?'✅ ':'❌ ')+q.w+' — '+q.e;
    sayH(q.f);dots();at++;setTimeout(show,1700);
  }
  function finish(){
    dots();padsEl.innerHTML='';playEl.style.display='none';
    statusEl.textContent='You got '+score+' out of '+TOTAL+'.';
    endEl.innerHTML='<button class="fin" id="again">🔄 Play again</button>';
    document.getElementById('again').onclick=function(){location.reload()};
    report(score,TOTAL);
  }
  show();
})();
</script>
</body>
</html>
