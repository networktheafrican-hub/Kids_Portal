<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Put the Haggle in Order</title>
<!-- Kids_Portal · Market/haggle-in-order.html · slug: mkt-order -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#FBF6EC;font-family:'Comic Sans MS','Chalkboard SE','Segoe UI',cursive,sans-serif;
    padding:16px 12px 40px;color:#2d1b0a;text-align:center}
  .card{max-width:660px;margin:0 auto;background:#FFF8E6;border-radius:30px;padding:20px 16px 26px;
    border:6px solid #C8901E;box-shadow:0 10px 22px rgba(0,0,0,.12)}
  h1{font-size:1.7rem;color:#A81B1B;text-shadow:2px 2px 0 #feda7a}
  .sub{font-size:1rem;color:#4d2f12;background:#ffe39c;padding:6px 18px;border-radius:40px;
    display:inline-block;margin:10px 0;border:3px solid #f8b86a}
  .status{background:#fff1c7;border:3px solid #f7b86a;border-radius:40px;padding:9px 16px;
    font-weight:bold;font-size:1rem;margin:16px auto 0;max-width:470px;min-height:2.8em}
  .fin{background:#f5c542;border:4px solid #af6f2a;border-radius:40px;padding:12px 30px;
    font-size:1.15rem;font-weight:bold;color:#2d1b0a;box-shadow:0 5px 0 #7a4d1a;cursor:pointer;
    font-family:inherit;margin-top:16px}
  .dots{display:flex;gap:5px;justify-content:center;margin:12px 0 4px}
  .dots i{width:20px;height:11px;border-radius:4px;background:#EFE7D7;border:2px solid #14563A}
  .dots i.hit{background:#14563A}.dots i.miss{background:#A81B1B;border-color:#6E1111}
  .opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
  .opt{background:#fef7e6;border:4px solid #b48b3a;border-radius:22px;padding:12px 18px;
    min-width:96px;font-size:1.25rem;font-weight:bold;color:#1f3a2f;font-family:inherit;
    cursor:pointer;box-shadow:0 5px 0 #7a5a1f;transition:.12s}
  .opt:active{transform:translateY(3px);box-shadow:0 2px 0 #7a5a1f}
  .opt.ok{background:#14563A;color:#fff;border-color:#0d3a26}
  .opt.no{background:#A81B1B;color:#fff;border-color:#6E1111;animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
    75%{transform:translateX(7px)}}
  :focus-visible{outline:3px solid #A81B1B;outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  @media(min-width:700px){h1{font-size:2.2rem}}

  .gramtip{background:#21274D;color:#fff;border-radius:18px;padding:11px 14px;margin-top:14px;
    border:3px solid #C8901E;font-size:.86rem;font-weight:700;line-height:1.5}
  .gramtip b{color:#E9C97A}

  .chat{background:#EFE7D7;border:5px solid #14563A;border-radius:24px;padding:12px;margin:14px 0;
    min-height:220px;display:flex;flex-direction:column;gap:8px}
  .slot{min-height:48px;border-radius:16px;border:3px dashed #8a7a5a;display:flex;
    align-items:center;gap:9px;padding:8px 11px;font-size:.98rem;font-weight:bold;
    color:#8a7a5a;background:rgba(255,255,255,.4)}
  .slot.filled{border-style:solid;border-color:#14563A;background:#fff;color:#1f3a2f}
  .slot small{display:block;font-size:.72rem;color:#5A6B60;font-weight:700}
  .pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
  .tile{background:#fef7e6;border:4px solid #b48b3a;border-radius:20px;padding:10px 13px;
    font-size:.95rem;font-weight:bold;color:#1f3a2f;font-family:inherit;cursor:pointer;
    box-shadow:0 5px 0 #7a5a1f}
  .tile small{display:block;font-size:.7rem;color:#5A6B60;font-weight:700}
  .tile.gone{opacity:.22;pointer-events:none}
  .tile.no{background:#A81B1B;color:#fff;border-color:#6E1111;animation:shake .35s}
  .tile.no small{color:#f3cfcf}
</style>
</head>
<body>
<div class="card">
  <h1>🔢 Put the Haggle in Order</h1>
  <span class="sub">What do you say first, and what last?</span>
  <div class="chat" id="chat"></div>
  <div class="pool" id="pool"></div>
  <p class="status" id="status">Start with what you say when you see the price.</p>
  <div class="gramtip">Ask, complain, request, offer, agree, thank —
    that is the shape of every bargain.</div>
  <div id="end"></div>
</div>
<script>
var M=[
 {w:'Meretɔ…',          e:"I'm buying…",        f:'imbuying',    g:'buy',  stem:1},
 {w:'Mepɛ…',            e:'I want…',            f:'iwant',       g:'buy',  stem:1},
 {w:'Wɔwɔ…?',           e:'Do you have…?',      f:'doyouhave',   g:'buy',  stem:1, ask:1},
 {w:'Aane, mewɔ bi',    e:'Yes, I have some',   f:'yesihave',    g:'buy'},
 {w:'Dabi, menni bi',   e:"No, I don't have",   f:'nodonthave',  g:'buy'},
 {w:'wei',              e:'this',               f:'this',        g:'buy'},
 {w:'wei yɛ',           e:'this is',            f:'thisis',      g:'buy'},
 {w:'Wei yɛ sɛn?',      e:'How much is this?',  f:'howmuchthis', g:'price', ask:1},
 {w:'Ne boɔ yɛ sɛn?',   e:'How much does it cost?', f:'howmuchcost', g:'price', ask:1},
 {w:'Ɛyɛ sɛn?',         e:'How much?',          f:'howmuch',     g:'price', ask:1},
 {w:'Ne boɔ yɛ den',    e:'It is expensive',    f:'expensive',   g:'bargain'},
 {w:'Ne boɔ yɛ den dodo',e:'It is too expensive',f:'tooexpensive',g:'bargain'},
 {w:'Mepa wo kyɛw, te so',e:'Please, reduce it',f:'reduce',      g:'bargain'},
 {w:'Mɛma wo…',         e:'I will give you…',   f:'illgive',     g:'bargain', stem:1},
 {w:'Mɛtɔ wei',         e:"I'll take this",     f:'illtake',     g:'close'},
 {w:'Medaase',          e:'Thank you',          f:'thanks',      g:'close'},
 {w:'Merekɔ',           e:'I am going',         f:'imgoing',     g:'close'},
 {w:'sika',             e:'money',              f:'money',       g:'money'},
 {w:'sidi',             e:'cedi',               f:'cedi',        g:'money'},
 {w:'pesewa',           e:'pesewa',             f:'pesewa',      g:'money'}
];
var MGRP={buy:'Asking for what you want',price:'Asking the price',
          bargain:'Bringing the price down',close:'Finishing',money:'Money words'};

/* Things to buy, with the folder each recording lives in, so a price sentence
   can be spoken from parts the learner already knows. */
var GOODS=[
 {w:'amango',   e:'mango',      d:'fruits', f:'mango',    ic:'🥭', price:5},
 {w:'kwadu',    e:'banana',     d:'fruits', f:'banana',   ic:'🍌', price:3},
 {w:'ankaa',    e:'orange',     d:'fruits', f:'orange',   ic:'🍊', price:2},
 {w:'aborɔbɛ',  e:'pineapple',  d:'fruits', f:'pineapple',ic:'🍍', price:10},
 {w:'kube',     e:'coconut',    d:'fruits', f:'coconut',  ic:'🥥', price:6},
 {w:'anamuna',  e:'watermelon', d:'fruits', f:'watermelon',ic:'🍉',price:20},
 {w:'ntoosi',   e:'tomato',     d:'food',   f:'tomato',   ic:'🍅', price:4},
 {w:'gyeene',   e:'onion',      d:'food',   f:'onion',    ic:'🧅', price:3},
 {w:'mako',     e:'pepper',     d:'food',   f:'pepper',   ic:'🌶️', price:2},
 {w:'bayerɛ',   e:'yam',        d:'food',   f:'yam',      ic:'🍠', price:15},
 {w:'ɛmo',      e:'rice',       d:'food',   f:'rice',     ic:'🍚', price:30},
 {w:'nsuomnam', e:'fish',       d:'food',   f:'fish',     ic:'🐟', price:10}
];
/* Number words, with the folder each one lives in. */
var PRICE={
 1:{w:'baako',d:'twi-numbers',f:'one'},     2:{w:'mmienu',d:'twi-numbers',f:'two'},
 3:{w:'mmiensa',d:'twi-numbers',f:'three'}, 4:{w:'ɛnan',d:'twi-numbers',f:'four'},
 5:{w:'enum',d:'twi-numbers',f:'five'},     6:{w:'nsia',d:'twi-numbers',f:'six'},
 10:{w:'du',d:'twi-numbers',f:'ten'},       15:{w:'du nnum',d:'big-numbers',f:'fifteen'},
 20:{w:'aduonu',d:'big-numbers',f:'twenty'},30:{w:'aduasa',d:'big-numbers',f:'thirty'},
 40:{w:'aduanan',d:'big-numbers',f:'forty'},50:{w:'aduonum',d:'big-numbers',f:'fifty'}
};
/* Which side of the stall each line comes from. */
var SIDE={
 /* The one buying */
 iwant:'buyer', doyouhave:'buyer', howmuchthis:'buyer', howmuchcost:'buyer',
 expensive:'buyer', tooexpensive:'buyer', reduce:'buyer', illgive:'buyer',
 illtake:'buyer', imbuying:'buyer', imgoing:'buyer',
 /* The one selling: she answers whether she has it, and she asks what you
    will pay. Fewer lines, so each round draws an equal number from each side
    rather than letting "buyer" be a safe guess. */
 yesihave:'seller', nodonthave:'seller', howmuch:'seller', thisis:'seller'
};
/* The order a haggle really runs in. */
var HAGGLE=['howmuchthis','expensive','reduce','illgive','illtake','thanks'];
var byM={}; M.forEach(function(x){byM[x.f]=x});
function sayM(f){var a=new Audio('/audio?f=market/'+encodeURIComponent(f+'.m4a'));
  a.play().catch(function(){});return a}
function sayFrom(d,f){var a=new Audio('/audio?f='+d+'/'+encodeURIComponent(f+'.m4a'));
  a.play().catch(function(){});return a}
/* "mɛma wo" then "aduonu" - a stem joined to something already recorded. */
function sayStem(stemF,d,f){
  var a=sayM(stemF);
  a.addEventListener('ended',function(){sayFrom(d,f)});
  return a;
}
function priceWord(n){ return PRICE[n]?PRICE[n].w:String(n) }
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));
  var t=a[i];a[i]=a[j];a[j]=t}return a}
function report(s,m){if(window.__sent||window.parent===window)return;window.__sent=1;
  parent.postMessage({type:'sg:complete',score:s,maxScore:m},'*')}

(function(){
  var steps=HAGGLE.slice();
  var placed=0,wrong=0;
  var chatEl=document.getElementById('chat'),poolEl=document.getElementById('pool'),
      statusEl=document.getElementById('status'),endEl=document.getElementById('end');
  function draw(){
    chatEl.innerHTML='';
    steps.forEach(function(f,i){
      var p=byM[f];
      var d=document.createElement('div');
      d.className='slot'+(i<placed?' filled':'');
      d.innerHTML=i<placed
        ? '<span>'+(i+1)+'.</span><span>'+p.w+'<small>'+p.e+'</small></span>'
        : '<span>'+(i+1)+'.</span><span>?</span>';
      chatEl.appendChild(d);
    });
  }
  function drawPool(){
    poolEl.innerHTML='';
    shuffle(steps.slice()).forEach(function(f){
      var p=byM[f];
      var b=document.createElement('button');b.className='tile';b.type='button';
      b.innerHTML=p.w+'<small>'+p.e+'</small>';
      b.onclick=function(){tap(b,f)};poolEl.appendChild(b);
    });
  }
  function tap(btn,f){
    if(placed>=steps.length)return;
    if(f===steps[placed]){
      btn.classList.add('gone');placed++;sayM(f);draw();
      statusEl.textContent=placed<steps.length?('✅ '+byM[f].w+'. Then what?')
        :'🎉 That is how a bargain runs!';
      if(placed===steps.length)finish();
    }else{
      wrong++;btn.classList.add('no');sayM(steps[placed]);
      statusEl.textContent='❌ Not yet — listen to what comes now.';
      setTimeout(function(){btn.classList.remove('no')},430);
    }
  }
  function finish(){
    poolEl.innerHTML='';
    statusEl.textContent=wrong===0?'Perfect — you know the whole dance!'
      :('Finished with '+wrong+(wrong===1?' mistake.':' mistakes.'));
    endEl.innerHTML='<button class="fin" id="again">🔄 Play again</button>';
    document.getElementById('again').onclick=function(){location.reload()};
    report(Math.max(3,steps.length-wrong),steps.length);
  }
  draw();drawPool();
})();
</script>
</body>
</html>
