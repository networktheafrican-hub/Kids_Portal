  .card{max-width:660px;margin:0 auto;background:#FFF8E6;border-radius:30px;padding:20px 16px 26px;
    border:6px solid #C8901E;box-shadow:0 10px 22px rgba(0,0,0,.12)}

    font-family:inherit;margin-top:16px}
  .dots{display:flex;gap:5px;justify-content:center;margin:12px 0 4px}
  .dots i{width:20px;height:11px;border-radius:4px;background:#EFE7D7;border:2px solid #14563A}
  .dots i.hit{background:#14563A}.dots i.miss{background:#A81B1B;border-color:#6E1111}
  .opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
  .opt{background:#fef7e6;border:4px solid #b48b3a;border-radius:22px;padding:12px 18px;
    min-width:96px;font-size:1.25rem;font-weight:bold;color:#1f3a2f;font-family:inherit;
    cursor:pointer;box-shadow:0 5px 0 #7a5a1f;transition:.12s}
  .opt:active{transform:translateY(3px);box-shadow:0 2px 0 #7a5a1f}
  .opt.ok{background:#14563A;color:#fff;border-color:#0d3a26}
  .opt.no{background:#A81B1B;color:#fff;border-color:#6E1111;animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
    75%{transform:translateX(7px)}}
  :focus-visible{outline:3px solid #A81B1B;outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  @media(min-width:700px){h1{font-size:2.2rem}}

  .q{background:#14563A;color:#fff;border:5px solid #f3d48a;border-radius:26px;padding:18px 16px;
    font-size:1.1rem;font-weight:bold;margin:14px 0;min-height:150px;display:flex;
    align-items:center;justify-content:center;flex-direction:column;gap:8px}

  .q .em{font-size:3.4rem;line-height:1}
  .q .spk{background:#fff1c7;border:3px solid #f7b86a;border-radius:40px;padding:8px 20px;
    font-size:1rem;font-weight:bold;color:#4d2f12;cursor:pointer;font-family:inherit}
  .head{font-size:.95rem;font-weight:bold;color:#4d2f12;background:#fff1c7;padding:7px 16px;
    border-radius:40px;display:inline-block;border:3px solid #f7b86a;margin-bottom:4px}
  .empty{padding:26px 10px}
  .empty .em{font-size:3.4rem;display:block}
  .empty h2{font-size:1.5rem;color:#A81B1B;margin:8px 0}
  .empty p{color:#5A6B60;font-weight:bold;max-width:360px;margin:8px auto}
  .big{font-size:1.3rem;font-weight:bold;color:#14563A;margin-top:12px}
  .sub2{font-size:.92rem;color:#5A6B60;font-weight:bold;max-width:340px;margin:6px auto 0}
  .opt{text-align:left}
</style>

    if(at>=quiz.length)return finish();
    lock=false;
    var x=quiz[at], q=build(x);
    qEl.innerHTML=q.html;
    statusEl.textContent=q.prompt;
    dots();
    optsEl.innerHTML='';
    q.opts.forEach(function(o){
      var b=document.createElement('button');b.className='opt';b.type='button';b.textContent=o;
      b.onclick=function(){answer(b,o,x,q)};optsEl.appendChild(b)});
    var spk=$('qspk');
    if(spk)spk.onclick=function(){say(x.d,x.f)};
    if(q.auto)say(x.d,x.f);
  }

  function answer(btn,chosen,x,q){
    if(lock)return;lock=true;
    var right=chosen===q.answer;marks[at]=right;
    if(right){score++;btn.classList.add('ok');statusEl.textContent='✅ '+x.w+' — '+x.e}
    else{btn.classList.add('no');
      Array.prototype.forEach.call(optsEl.children,function(c){
        if(c.textContent===q.answer)c.classList.add('ok')});
      statusEl.textContent='❌ '+x.w+' means '+x.e+'.'}
    results.push({item:x.w,chapter:x.c,ok:right});
    say(x.d,x.f);dots();at++;setTimeout(show,1700);
  }

  async function finish(){
    dots();optsEl.innerHTML='';
    qEl.innerHTML='<span class="em">'
      +(score===quiz.length?'🏆':score>=quiz.length*0.6?'🎉':'💪')+'</span>';
    statusEl.textContent='You got '+score+' out of '+quiz.length+'.';
    var res={};
    try{
      var r=await fetch('/api/practice/save',{method:'POST',
        headers:{'content-type':'application/json'},
        body:JSON.stringify({score:score,asked:quiz.length,results:results})});
      res=await r.json();
    }catch(err){}
    endEl.innerHTML='<p class="big">'
      +(res.first&&res.gained?('⭐ +'+res.gained+' stars for today'):'Practice saved')
      +'</p><p class="sub2">Come back tomorrow — the words you missed will come round again.</p>'
      +'<button class="fin" id="again">🔄 Practise more</button>';
    $('again').onclick=function(){location.reload()};
  }

  addEventListener('error',function(ev){
    if(stateEl)stateEl.textContent='Something went wrong: '+(ev.message||'script error');
  });

  (async function(){
    try{ ctx=await (await fetch('/api/practice')).json(); }
    catch(err){ ctx=null }
    if(!ctx||ctx.error){ stateEl.textContent='Please sign in again.'; return }

    var open={};(ctx.chapters||[]).forEach(function(c){open[c]=1});
    pool=BANK.filter(function(x){return open[x.c]});

    if(pool.length<8){
      stateEl.innerHTML='<div class="empty"><span class="em">🌱</span>'
        +'<h2>Not yet</h2><p>Finish a few activities first. Once you have,'
        +' Daily Practice brings those words back so you do not forget them.</p>'
        +'<p><a class="fin" href="/learn">Go to my lessons</a></p></div>';
      return;
    }

    var streak='';
    if((ctx.week||[]).length>1)streak=' · '+ctx.week.length+' days practised';
    headEl.textContent='Hello '+ctx.name+streak;

    quiz=choose();
    stateEl.style.display='none';
    $('game').style.display='block';
    show();
  })();

})();
</script>
</body>
</html>
