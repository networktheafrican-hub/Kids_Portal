<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>This One or That One?</title>
<!-- Kids_Portal · School/this-or-that.html · slug: sch-det -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#FBF6EC;font-family:'Comic Sans MS','Chalkboard SE','Segoe UI',cursive,sans-serif;
    padding:16px 12px 40px;color:#2d1b0a;text-align:center}
  .card{max-width:660px;margin:0 auto;background:#FFF8E6;border-radius:30px;padding:20px 16px 26px;
    border:6px solid #C8901E;box-shadow:0 10px 22px rgba(0,0,0,.12)}
  h1{font-size:1.7rem;color:#A81B1B;text-shadow:2px 2px 0 #feda7a}
  .sub{font-size:1rem;color:#4d2f12;background:#ffe39c;padding:6px 18px;border-radius:40px;
    display:inline-block;margin:10px 0;border:3px solid #f8b86a}
  .status{background:#fff1c7;border:3px solid #f7b86a;border-radius:40px;padding:9px 16px;
    font-weight:bold;font-size:1rem;margin:16px auto 0;max-width:470px;min-height:2.8em}
  .fin{background:#f5c542;border:4px solid #af6f2a;border-radius:40px;padding:12px 30px;
    font-size:1.15rem;font-weight:bold;color:#2d1b0a;box-shadow:0 5px 0 #7a4d1a;cursor:pointer;
    font-family:inherit;margin-top:16px}
  .dots{display:flex;gap:5px;justify-content:center;margin:12px 0 4px}
  .dots i{width:20px;height:11px;border-radius:4px;background:#EFE7D7;border:2px solid #14563A}
  .dots i.hit{background:#14563A}.dots i.miss{background:#A81B1B;border-color:#6E1111}
  .opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
  .opt{background:#fef7e6;border:4px solid #b48b3a;border-radius:22px;padding:12px 18px;
    min-width:96px;font-size:1.15rem;font-weight:bold;color:#1f3a2f;font-family:inherit;
    cursor:pointer;box-shadow:0 5px 0 #7a5a1f;transition:.12s}
  .opt:active{transform:translateY(3px);box-shadow:0 2px 0 #7a5a1f}
  .opt.ok{background:#14563A;color:#fff;border-color:#0d3a26}
  .opt.no{background:#A81B1B;color:#fff;border-color:#6E1111;animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
    75%{transform:translateX(7px)}}
  :focus-visible{outline:3px solid #A81B1B;outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  @media(min-width:700px){h1{font-size:2.2rem}}

  .gramtip{background:#21274D;color:#fff;border-radius:18px;padding:12px 15px;margin:14px 0;
    border:4px solid #C8901E;font-size:.88rem;font-weight:700;line-height:1.6}
  .gramtip b{color:#E9C97A}
  .gramtip .big{font-size:1.4rem;display:block;margin-top:5px}

  .desk{background:#d9e9b0;border:5px solid #14563A;border-radius:26px;padding:16px;margin:14px 0;
    position:relative;min-height:190px;display:flex;align-items:flex-end;justify-content:space-around}
  .spot{display:flex;flex-direction:column;align-items:center;gap:4px}
  .spot .ic{font-size:3rem;line-height:1}
  .spot .lab{font-size:.74rem;font-weight:bold;color:#14563A;background:#fff;border-radius:20px;
    padding:1px 10px;border:2px solid #14563A}
  .spot.far .ic{font-size:1.9rem;opacity:.85}
  .me3{position:absolute;left:12px;bottom:12px;font-size:2.2rem}
  .ask2{background:#14563A;color:#fff;border:4px solid #f3d48a;border-radius:20px;padding:13px;
    font-size:1.2rem;font-weight:bold}
  .ask2 small{display:block;font-size:.82rem;opacity:.85;font-weight:700;margin-top:3px}
  .opt{font-size:1.25rem}
</style>
</head>
<body>
<div class="card">
  <h1>👇 This One or That One?</h1>
  <span class="sub">nwoma wei · nwoma ɛno</span>
  <div class="dots" id="dots"></div>
  <div class="desk" id="desk"></div>
  <p class="ask2" id="ask"></p>
  <div class="opts" id="opts"></div>
  <p class="status" id="status"></p>
  <div class="gramtip">Near and one → <b>wei</b>. Far and one → <b>ɛno</b>.
    Near and many → <b>yɛinom</b>. Far and many → <b>wɔn no</b>.</div>
  <div id="end"></div>
</div>
<script>
var S=[
 {w:'sukuu',          e:'school',     f:'school',    ic:'🏫', g:'place'},
 {w:'adesuadan',      e:'classroom',  f:'classroom', ic:'🚪', g:'place'},
 {w:'ɔkyerɛkyerɛni',  e:'teacher',    f:'teacher',   ic:'👩🏾‍🏫', g:'place'},
 {w:'sukuuni',        e:'pupil',      f:'pupil',     ic:'🧒🏾', g:'place'},
 {w:'nwoma',          e:'book',       f:'book',      ic:'📕', g:'thing', count:1},
 {w:'twerɛdua',       e:'pen',        f:'pen',       ic:'🖊️', g:'thing', count:1},
 {w:'pɛnsere',        e:'pencil',     f:'pencil',    ic:'✏️', g:'thing', count:1},
 {w:'kyerɛwpono',     e:'desk',       f:'desk',      ic:'🪑', g:'thing', count:1},
 {w:'bɔɔdo',          e:'blackboard', f:'board',     ic:'📋', g:'thing'},
 {w:'dɔte',           e:'chalk',      f:'chalk',     ic:'🖍️', g:'thing', count:1},
 {w:'baage',          e:'bag',        f:'bag',       ic:'🎒', g:'thing', count:1},
 {w:'sua',            e:'learn',      f:'learn',     ic:'🎓', g:'do'},
 {w:'kenkan',         e:'read',       f:'read',      ic:'📖', g:'do'},
 {w:'twerɛ',          e:'write',      f:'write',     ic:'✍️', g:'do'},
 {w:'kyerɛ',          e:'teach',      f:'teach',     ic:'🧑🏾‍🏫', g:'do'},
 {w:'bisa',           e:'ask',        f:'ask',       ic:'🙋', g:'do'},
 {w:'bua',            e:'answer',     f:'answer',    ic:'💬', g:'do'}
];
/* this/that/these/those - the grammar of this chapter. The determiner comes
   AFTER the noun: nwoma wei, "this book". */
var DET=[
 {w:'wei',    e:'this',  f:'this',  near:true,  many:false, ic:'👇'},
 {w:'ɛno',    e:'that',  f:'that',  near:false, many:false, ic:'👉'},
 {w:'yɛinom', e:'these', f:'these', near:true,  many:true,  ic:'✋'},
 {w:'wɔn no', e:'those', f:'those', near:false, many:true,  ic:'👋'}
];
var SGRP={place:'At school',thing:'Things in the classroom',do:'What you do there'};
var COUNTABLE=S.filter(function(x){return x.count});
var byS={}; S.forEach(function(x){byS[x.f]=x; byS[x.w]=x});
DET.forEach(function(x){byS[x.f]=x; byS[x.w]=x});
function sayS(f){var a=new Audio('/audio?f=school/'+encodeURIComponent(f+'.m4a'));
  a.play().catch(function(){});return a}
/* noun, then determiner - the order the chapter teaches. */
function sayPhrase(noun,det){
  var a=sayS(noun.f);
  a.addEventListener('ended',function(){sayS(det.f)});
  return a;
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));
  var t=a[i];a[i]=a[j];a[j]=t}return a}
function report(s,m){if(window.__sent||window.parent===window)return;window.__sent=1;
  parent.postMessage({type:'sg:complete',score:s,maxScore:m},'*')}

(function(){
  var TOTAL=8;
  /* Each round fixes near/far and one/many, so exactly one determiner fits. */
  var quiz=[];
  for(var i=0;i<TOTAL;i++){
    var d=DET[i%DET.length];
    quiz.push({item:COUNTABLE[Math.floor(Math.random()*COUNTABLE.length)], det:d});
  }
  quiz=shuffle(quiz);
  var at=0,score=0,lock=false,marks=[];
  var deskEl=document.getElementById('desk'),askEl=document.getElementById('ask'),
      optsEl=document.getElementById('opts'),statusEl=document.getElementById('status'),
      dotsEl=document.getElementById('dots'),endEl=document.getElementById('end');
  function dots(){dotsEl.innerHTML='';for(var k=0;k<TOTAL;k++){var e=document.createElement('i');
    if(marks[k]===true)e.className='hit';else if(marks[k]===false)e.className='miss';
    dotsEl.appendChild(e)}}
  function draw(q){
    var n=q.det.many?3:1, ics='';
    for(var k=0;k<n;k++)ics+=q.item.ic;
    deskEl.innerHTML='<span class="me3">🧍</span>'
      +'<div class="spot'+(q.det.near?'':' far')+'" style="margin-left:'
      +(q.det.near?'0':'auto')+'">'
      +'<span class="ic">'+ics+'</span>'
      +'<span class="lab">'+(q.det.near?'right here':'over there')
      +' · '+(q.det.many?'many':'one')+'</span></div>';
  }
  function show(){
    if(at>=quiz.length)return finish();
    lock=false;var q=quiz[at];
    draw(q);
    askEl.innerHTML='How do you say "'+q.det.e+' '+q.item.e
      +(q.det.many?'s':'')+'"?<small>the pointing word comes after the thing</small>';
    statusEl.textContent='Choose the right ending.';dots();
    sayS(q.item.f);
    optsEl.innerHTML='';
    shuffle(DET.slice()).forEach(function(d){
      var b=document.createElement('button');b.className='opt';b.type='button';
      b.textContent=q.item.w+' '+d.w;b.dataset.f=d.f;
      b.onclick=function(){answer(b,d,q)};optsEl.appendChild(b)});
  }
  function answer(btn,d,q){
    if(lock)return;lock=true;
    var ok=d.f===q.det.f;marks[at]=ok;
    if(ok){score++;btn.classList.add('ok');
      statusEl.textContent='✅ '+q.item.w+' '+q.det.w+' — '+q.det.e+' '+q.item.e
        +(q.det.many?'s':'')+'.'}
    else{btn.classList.add('no');
      Array.prototype.forEach.call(optsEl.children,function(c){
        if(c.dataset.f===q.det.f)c.classList.add('ok')});
      statusEl.textContent='❌ '+(q.det.near?'It is near you':'It is far away')
        +' and there '+(q.det.many?'are many':'is one')+', so: '
        +q.item.w+' '+q.det.w+'.'}
    sayPhrase(q.item,q.det);
    dots();at++;setTimeout(show,2500);
  }
  function finish(){
    dots();deskEl.innerHTML='<span class="me3">🎉</span>';askEl.textContent='';
    optsEl.innerHTML='';
    statusEl.textContent='You got '+score+' out of '+TOTAL+'.';
    endEl.innerHTML='<button class="fin" id="again">🔄 Play again</button>';
    document.getElementById('again').onclick=function(){location.reload()};
    report(score,TOTAL);
  }
  show();
})();
</script>
</body>
</html>
