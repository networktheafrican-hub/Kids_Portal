<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Who Is Doing It?</title>
<!-- Kids_Portal · Sentences/verbs-lesson.html · slug: verb-lesson -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#FBF6EC;font-family:'Comic Sans MS','Chalkboard SE','Segoe UI',cursive,sans-serif;
    padding:16px 12px 40px;color:#2d1b0a;text-align:center}
  .card{max-width:660px;margin:0 auto;background:#FFF8E6;border-radius:30px;padding:20px 16px 26px;
    border:6px solid #C8901E;box-shadow:0 10px 22px rgba(0,0,0,.12)}
  h1{font-size:1.7rem;color:#A81B1B;text-shadow:2px 2px 0 #feda7a}
  .sub{font-size:1rem;color:#4d2f12;background:#ffe39c;padding:6px 18px;border-radius:40px;
    display:inline-block;margin:10px 0;border:3px solid #f8b86a}
  .status{background:#fff1c7;border:3px solid #f7b86a;border-radius:40px;padding:9px 16px;
    font-weight:bold;font-size:1rem;margin:16px auto 0;max-width:470px;min-height:2.8em}
  .fin{background:#f5c542;border:4px solid #af6f2a;border-radius:40px;padding:12px 30px;
    font-size:1.15rem;font-weight:bold;color:#2d1b0a;box-shadow:0 5px 0 #7a4d1a;cursor:pointer;
    font-family:inherit;margin-top:16px}
  .dots{display:flex;gap:5px;justify-content:center;margin:12px 0 4px}
  .dots i{width:20px;height:11px;border-radius:4px;background:#EFE7D7;border:2px solid #14563A}
  .dots i.hit{background:#14563A}.dots i.miss{background:#A81B1B;border-color:#6E1111}
  .opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
  .opt{background:#fef7e6;border:4px solid #b48b3a;border-radius:22px;padding:12px 18px;
    min-width:96px;font-size:1.25rem;font-weight:bold;color:#1f3a2f;font-family:inherit;
    cursor:pointer;box-shadow:0 5px 0 #7a5a1f;transition:.12s}
  .opt:active{transform:translateY(3px);box-shadow:0 2px 0 #7a5a1f}
  .opt.ok{background:#14563A;color:#fff;border-color:#0d3a26}
  .opt.no{background:#A81B1B;color:#fff;border-color:#6E1111;animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
    75%{transform:translateX(7px)}}
  :focus-visible{outline:3px solid #A81B1B;outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  @media(min-width:700px){h1{font-size:2.2rem}}

  .grp{font-size:1.08rem;color:#A81B1B;font-weight:bold;margin-top:18px}
  .prons{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:8px}
  .pr{background:#fff;border:4px solid #efc48c;border-radius:22px;padding:11px 8px;cursor:pointer;
    font-family:inherit;box-shadow:0 5px 0 #b6956a;text-align:center}
  .pr .e{font-size:1.7rem;display:block;line-height:1}
  .pr .f{font-size:1.15rem;font-weight:bold;color:#492f16}
  .pr .arrow{font-size:.9rem;color:#A81B1B;font-weight:bold}
  .pr .en{font-size:.78rem;color:#5A6B60;font-weight:bold}
  .pr.playing{box-shadow:0 0 0 4px #14563A}
  .vbs{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px;margin-top:8px}
  .vb{background:#fff;border:4px solid #efc48c;border-radius:22px;padding:8px;cursor:pointer;
    font-family:inherit;box-shadow:0 5px 0 #b6956a;text-align:center}
  .vb .w{font-size:1.08rem;font-weight:bold;color:#492f16}
  .vb .en{font-size:.78rem;color:#5A6B60;font-weight:bold}
  .vb.playing{box-shadow:0 0 0 4px #14563A}
  .rule{background:#14563A;color:#fff;border:5px solid #f3d48a;border-radius:26px;padding:16px;
    margin-top:16px;font-size:1.1rem;font-weight:bold;line-height:1.7}
  .rule b{color:#f3d48a;font-size:1.3rem}
  .hint{font-size:.95rem;font-weight:bold;color:#4d2f12;background:#fff1c7;padding:7px 16px;
    border-radius:40px;max-width:430px;margin:12px auto 0;border:3px solid #f7b86a}
</style>
</head>
<body>
<div class="card">
  <h1>🗣️ Who Is Doing It?</h1>
  <span class="sub">Pronouns and verbs together</span>
  <p class="hint">🔊 Tap anything to hear it</p>
  <p class="grp">The people words</p>
  <div class="prons" id="prons"></div>
  <p class="rule">Some of them get shorter when a verb comes:<br>
    <b>ɔno</b> → <b>ɔ</b> &nbsp; <b>yɛn</b> → <b>yɛ</b> &nbsp;
    <b>wɔn</b> → <b>wɔ</b> &nbsp; <b>ɛno</b> → <b>ɛ</b><br>
    Then they join the verb into one word: <b>ɔ + didi = ɔdidi</b></p>
  <p class="grp">The doing words</p>
  <div class="vbs" id="vbs"></div>
  <p class="status" id="status">Tap them all, then try the games.</p>
  <div id="end"></div>
</div>
<script>
/* Subject pronouns. Some contract when a verb follows - that contraction is
   the whole point of this chapter, so it is shown explicitly everywhere. */
var P=[
 {full:'me',  sub:'me', en:'I',        f:'me',   e:'🧒', contracts:false},
 {full:'wo',  sub:'wo', en:'you',      f:'wo',   e:'👉', contracts:false},
 {full:'ɔno', sub:'ɔ',  en:'he / she', f:'ono',  e:'🧑', contracts:true},
 {full:'yɛn', sub:'yɛ', en:'we',       f:'yen',  e:'👨‍👩‍👧', contracts:true},
 {full:'mo',  sub:'mo', en:'you (all)',f:'mo',   e:'👥', contracts:false},
 {full:'wɔn', sub:'wɔ', en:'they',     f:'won',  e:'👨‍👩‍👧‍👦', contracts:true},
 {full:'ɛno', sub:'ɛ',  en:'it',       f:'eno',  e:'📦', contracts:true}
];
var V=[
 {w:'didi',  en:'eat',   f:'didi',  act:'eat'},
 {w:'nom',   en:'drink', f:'nom',   act:'drink'},
 {w:'da',    en:'sleep', f:'da',    act:'sleep'},
 {w:'nante', en:'walk',  f:'nante', act:'walk'},
 {w:'su',    en:'cry',   f:'su',    act:'cry'},
 {w:'sere',  en:'laugh', f:'sere',  act:'laugh'},
 {w:'goro',  en:'play',  f:'goro',  act:'play'},
 {w:'dware', en:'bath',  f:'dware', act:'bath'}
];
/* Joined recordings we actually have. Anything not listed plays the pronoun
   and the verb one after the other instead - still correct, just two clips. */
var JOINED={
 'me|didi':'medidi','wo|didi':'wodidi','ɔ|didi':'odidi','yɛ|didi':'yedidi',
 'mo|didi':'modidi','wɔ|didi':'wodidi2','ɛ|didi':'edidi',
 'ɔ|su':'osu','yɛ|nante':'yenante','ɔ|da':'oda','wo|sere':'wosere'
};
function sentence(p,v){return p.sub+v.w}
function sayV(f){var a=new Audio('/audio?f=verbs/'+encodeURIComponent(f+'.m4a'));
  a.play().catch(function(){});return a}
/* Play a whole sentence: one clip if we recorded it, otherwise pronoun then verb. */
function saySentence(p,v){
  var key=p.sub+'|'+v.w, one=JOINED[key];
  if(one)return sayV(one);
  var a=sayV(p.f);
  a.addEventListener('ended',function(){sayV(v.f)});
  return a;
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));
  var t=a[i];a[i]=a[j];a[j]=t}return a}
function report(s,m){if(window.__sent||window.parent===window)return;window.__sent=1;
  parent.postMessage({type:'sg:complete',score:s,maxScore:m},'*')}

/* Stick figures - a verb needs a body doing something, which emoji cannot show. */
function actor(act,size){
  size=size||150;
  var SK='#8D5524',LN='#3A2A1C',SH='#14563A';
  var head='<circle cx="50" cy="20" r="13" fill="'+SK+'" stroke="'+LN+'" stroke-width="3"/>';
  var S='<svg viewBox="0 0 100 100" width="'+size+'" height="'+size+'">';
  var E='</svg>';
  var L='stroke="'+SK+'" stroke-width="7" stroke-linecap="round" fill="none"';
  var T='<path d="M50 33 L50 62" stroke="'+SH+'" stroke-width="13" stroke-linecap="round"/>';
  if(act==='eat')return S+head+T
    +'<path d="M50 42 L66 30" '+L+'/><path d="M50 44 L34 56" '+L+'/>'
    +'<circle cx="70" cy="26" r="6" fill="#C8901E" stroke="'+LN+'" stroke-width="2"/>'
    +'<path d="M44 62 L38 88 M56 62 L62 88" '+L+'/>'+E;
  if(act==='drink')return S+head+T
    +'<path d="M50 42 L64 28" '+L+'/><path d="M50 46 L36 58" '+L+'/>'
    +'<rect x="60" y="18" width="12" height="14" rx="2" fill="#1A4FA0" stroke="'+LN+'" stroke-width="2"/>'
    +'<path d="M44 62 L38 88 M56 62 L62 88" '+L+'/>'+E;
  if(act==='sleep')return S
    +'<circle cx="30" cy="60" r="13" fill="'+SK+'" stroke="'+LN+'" stroke-width="3"/>'
    +'<path d="M43 62 L74 62" stroke="'+SH+'" stroke-width="13" stroke-linecap="round"/>'
    +'<path d="M74 62 L86 74" '+L+'/>'
    +'<rect x="14" y="70" width="76" height="8" rx="4" fill="#C8901E" stroke="'+LN+'" stroke-width="2"/>'
    +'<text x="52" y="34" font-size="16" fill="'+LN+'" font-weight="bold">z</text>'
    +'<text x="66" y="22" font-size="12" fill="'+LN+'" font-weight="bold">z</text>'+E;
  if(act==='walk')return S+head+T
    +'<path d="M50 42 L34 52 M50 44 L66 54" '+L+'/>'
    +'<path d="M50 62 L36 88 M50 62 L64 84" '+L+'/>'+E;
  if(act==='cry')return S+head+T
    +'<path d="M50 42 L34 32 M50 42 L66 32" '+L+'/>'
    +'<circle cx="45" cy="22" r="2.5" fill="#1A4FA0"/><circle cx="55" cy="22" r="2.5" fill="#1A4FA0"/>'
    +'<path d="M45 26 L44 34 M55 26 L56 34" stroke="#1A4FA0" stroke-width="3" stroke-linecap="round"/>'
    +'<path d="M44 62 L38 88 M56 62 L62 88" '+L+'/>'+E;
  if(act==='laugh')return S+head+T
    +'<path d="M50 40 L30 30 M50 40 L70 30" '+L+'/>'
    +'<path d="M42 22 Q50 32 58 22" stroke="'+LN+'" stroke-width="3" fill="none" stroke-linecap="round"/>'
    +'<path d="M44 62 L38 88 M56 62 L62 88" '+L+'/>'+E;
  if(act==='play')return S+head+T
    +'<path d="M50 40 L28 34 M50 42 L72 34" '+L+'/>'
    +'<circle cx="80" cy="30" r="9" fill="#C8901E" stroke="'+LN+'" stroke-width="3"/>'
    +'<path d="M46 62 L34 86 M56 62 L68 86" '+L+'/>'+E;
  return S+head+T
    +'<path d="M50 42 L36 34 M50 44 L64 36" '+L+'/>'
    +'<path d="M44 62 L38 88 M56 62 L62 88" '+L+'/>'
    +'<path d="M28 14 Q34 26 30 34 M70 14 Q64 26 68 34" stroke="#1A4FA0" stroke-width="4" '
    +'fill="none" stroke-linecap="round"/>'
    +'<ellipse cx="50" cy="92" rx="30" ry="7" fill="#1A4FA0" opacity=".45"/>'+E;
}

(function(){
  var heard={},cur=null,curEl=null,NEED=P.length+V.length;
  var statusEl=document.getElementById('status'),endEl=document.getElementById('end');
  function play(f,el,key){
    if(cur)cur.pause(); if(curEl)curEl.classList.remove('playing');
    cur=sayV(f);curEl=el;el.classList.add('playing');
    cur.addEventListener('ended',function(){el.classList.remove('playing')});
    cur.addEventListener('error',function(){el.classList.remove('playing')});
    heard[key]=1;
    var n=Object.keys(heard).length;
    statusEl.textContent=n<NEED?('You have heard '+n+' of '+NEED+'.'):'You heard them all! 🎉';
    if(n>=NEED&&!endEl.innerHTML){
      endEl.innerHTML='<button class="fin" id="done">✅ I can make sentences</button>';
      document.getElementById('done').onclick=function(){report(5,5)};
    }
  }
  var pronsEl=document.getElementById('prons');
  P.forEach(function(p){
    var b=document.createElement('button');b.className='pr';b.type='button';
    b.innerHTML='<span class="e">'+p.e+'</span><span class="f">'+p.full+'</span>'
      +(p.contracts?'<span class="arrow">→ '+p.sub+'</span>':'<span class="arrow">→ '+p.sub+'</span>')
      +'<span class="en">'+p.en+'</span>';
    b.onclick=function(){play(p.f,b,'p'+p.en)};
    pronsEl.appendChild(b);
  });
  var vbsEl=document.getElementById('vbs');
  V.forEach(function(v){
    var b=document.createElement('button');b.className='vb';b.type='button';
    b.innerHTML=actor(v.act,58)+'<div class="w">'+v.w+'</div><div class="en">'+v.en+'</div>';
    b.onclick=function(){play(v.f,b,'v'+v.en)};
    vbsEl.appendChild(b);
  });
})();
</script>
</body>
</html>
