<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Meeting Someone</title>
<!-- Kids_Portal · Talking/meeting-someone.html · slug: talk-chat -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#FBF6EC;font-family:'Comic Sans MS','Chalkboard SE','Segoe UI',cursive,sans-serif;
    padding:16px 12px 40px;color:#2d1b0a;text-align:center}
  .card{max-width:660px;margin:0 auto;background:#FFF8E6;border-radius:30px;padding:20px 16px 26px;
    border:6px solid #C8901E;box-shadow:0 10px 22px rgba(0,0,0,.12)}
  h1{font-size:1.7rem;color:#A81B1B;text-shadow:2px 2px 0 #feda7a}
  .sub{font-size:1rem;color:#4d2f12;background:#ffe39c;padding:6px 18px;border-radius:40px;
    display:inline-block;margin:10px 0;border:3px solid #f8b86a}
  .status{background:#fff1c7;border:3px solid #f7b86a;border-radius:40px;padding:9px 16px;
    font-weight:bold;font-size:1rem;margin:16px auto 0;max-width:470px;min-height:2.8em}
  .fin{background:#f5c542;border:4px solid #af6f2a;border-radius:40px;padding:12px 30px;
    font-size:1.15rem;font-weight:bold;color:#2d1b0a;box-shadow:0 5px 0 #7a4d1a;cursor:pointer;
    font-family:inherit;margin-top:16px}
  .dots{display:flex;gap:5px;justify-content:center;margin:12px 0 4px}
  .dots i{width:20px;height:11px;border-radius:4px;background:#EFE7D7;border:2px solid #14563A}
  .dots i.hit{background:#14563A}.dots i.miss{background:#A81B1B;border-color:#6E1111}
  .opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
  .opt{background:#fef7e6;border:4px solid #b48b3a;border-radius:22px;padding:12px 18px;
    min-width:96px;font-size:1.25rem;font-weight:bold;color:#1f3a2f;font-family:inherit;
    cursor:pointer;box-shadow:0 5px 0 #7a5a1f;transition:.12s}
  .opt:active{transform:translateY(3px);box-shadow:0 2px 0 #7a5a1f}
  .opt.ok{background:#14563A;color:#fff;border-color:#0d3a26}
  .opt.no{background:#A81B1B;color:#fff;border-color:#6E1111;animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
    75%{transform:translateX(7px)}}
  :focus-visible{outline:3px solid #A81B1B;outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  @media(min-width:700px){h1{font-size:2.2rem}}

  .chat{background:#EFE7D7;border:4px solid #14563A;border-radius:24px;padding:14px;margin:14px 0;
    min-height:230px;display:flex;flex-direction:column;gap:9px}
  .bub{max-width:82%;padding:11px 14px;border-radius:18px;font-weight:bold;font-size:1rem;
    line-height:1.35;border:3px solid #14563A}
  .bub small{display:block;font-size:.76rem;font-weight:700;opacity:.75;margin-top:2px}
  .bub.them{background:#fff;align-self:flex-start;border-bottom-left-radius:5px}
  .bub.you{background:#C8901E;color:#3A2A05;align-self:flex-end;border-bottom-right-radius:5px}
  .who{font-size:.78rem;font-weight:800;color:#5A6B60;margin-bottom:-4px}
  .picks{display:flex;flex-direction:column;gap:9px;margin-top:6px}
  .pick{background:#fef7e6;border:4px solid #b48b3a;border-radius:20px;padding:13px;
    font-size:1.02rem;font-weight:bold;font-family:inherit;cursor:pointer;color:#1f3a2f;
    box-shadow:0 5px 0 #7a5a1f;text-align:left}
  .pick:active{transform:translateY(3px);box-shadow:0 2px 0 #7a5a1f}
  .pick.ok{background:#14563A;color:#fff;border-color:#0d3a26}
  .pick.no{background:#A81B1B;color:#fff;border-color:#6E1111;animation:shake .35s}
  .pick small{display:block;font-size:.8rem;opacity:.8;font-weight:700}
</style>
</head>
<body>
<div class="card">
  <h1>🗣️ Meeting Someone</h1>
  <span class="sub">Ama is talking to you. What do you say?</span>
  <div class="dots" id="dots"></div>
  <div class="chat" id="chat"></div>
  <div class="picks" id="picks"></div>
  <p class="status" id="status"></p>
  <div id="end"></div>
</div>
<script>
var T=[
 {w:'Wo din de sɛn?', e:'What is your name?',  f:'whatname',  g:'meet', ask:1},
 {w:'Me din de…',     e:'My name is…',         f:'myname',    g:'meet', stem:1, slot:'name'},
 {w:'Wo ho te sɛn?',  e:'How are you?',        f:'howareyou', g:'meet', ask:1},
 {w:'Me ho yɛ',       e:'I am fine',           f:'imfine',    g:'meet'},
 {w:'Na wo nso ɛ?',   e:'And you?',            f:'andyou',    g:'meet'},
 {w:'Ɛhe na wofiri?', e:'Where are you from?', f:'wherefrom', g:'meet', ask:1},
 {w:'Mefiri…',        e:'I am from…',          f:'imfrom',    g:'meet', stem:1, slot:'town'},
 {w:'Wote he?',       e:'Where do you live?',  f:'wherelive', g:'meet', ask:1},
 {w:'Mete…',          e:'I live at…',          f:'ilive',     g:'meet', stem:1, slot:'town'},
 {w:'Medaase',        e:'Thank you',           f:'thanks',    g:'polite'},
 {w:'Mepa wo kyɛw',   e:'Please, excuse me',   f:'please',    g:'polite'},
 {w:'Aane',           e:'Yes',                 f:'yes',       g:'polite'},
 {w:'Daabi',          e:'No',                  f:'no',        g:'polite'},
 {w:'Kafra',          e:'Sorry',               f:'sorry',     g:'polite'},
 {w:'Akwaaba',        e:'Welcome',             f:'welcome',   g:'going'},
 {w:'Nante yie',      e:'Goodbye, go well',    f:'goodbye',   g:'going'},
 {w:'Yɛbɛhyia',       e:'See you again',       f:'seeyou',    g:'going'},
 {w:'Mewɔ…',          e:'I have…',             f:'ihave',     g:'mine', stem:1, slot:'thing'},
 {w:'Mepɛ…',          e:'I like…',             f:'ilike',     g:'mine', stem:1, slot:'thing'}
];
var TGRP={meet:'Meeting someone',polite:'Being polite',going:'Coming and going',
          mine:'Saying what is yours'};
var byF={}; T.forEach(function(x){byF[x.f]=x});

/* Things a learner can put after mewɔ / mepɛ, drawn from earlier chapters so
   the phrase joins to words they already own. */
var THINGS=[
 {w:'amango',   e:'a mango',    d:'fruits',  f:'mango',    ic:'🥭'},
 {w:'kwadu',    e:'a banana',   d:'fruits',  f:'banana',   ic:'🍌'},
 {w:'ankaa',    e:'an orange',  d:'fruits',  f:'orange',   ic:'🍊'},
 {w:'kube',     e:'a coconut',  d:'fruits',  f:'coconut',  ic:'🥥'},
 {w:'kraman',   e:'a dog',      d:'animals', f:'dog',      ic:'🐕'},
 {w:'agyinamoa',e:'a cat',      d:'animals', f:'cat',      ic:'🐈'},
 {w:'akokɔ',    e:'a chicken',  d:'animals', f:'chicken',  ic:'🐔'},
 {w:'abirekyie',e:'a goat',     d:'animals', f:'goat',     ic:'🐐'},
 {w:'ɛmo',      e:'rice',       d:'food',    f:'rice',     ic:'🍚'},
 {w:'paanoo',   e:'bread',      d:'food',    f:'paanoo',   ic:'🍞'},
 {w:'nsuomnam', e:'fish',       d:'food',    f:'fish',     ic:'🐟'},
 {w:'bayerɛ',   e:'yam',        d:'food',    f:'yam',      ic:'🍠'}
];
var TOWNS=['Kumasi','Accra','Takoradi','Tamale','Cape Coast','Koforidua','Sunyani','Ho'];

function sayT(f){var a=new Audio('/audio?f=talking/'+encodeURIComponent(f+'.m4a'));
  a.play().catch(function(){});return a}
function sayAny(d,f){var a=new Audio('/audio?f='+encodeURIComponent(d)+'/'+encodeURIComponent(f+'.m4a'));
  a.play().catch(function(){});return a}
/* Play a stem then the thing after it, so "mepɛ" + "amango" sounds like a
   sentence without needing a recording of every combination. */
function sayPair(stemF,d,f){
  var a=sayT(stemF);
  a.addEventListener('ended',function(){sayAny(d,f)});
  return a;
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));
  var t=a[i];a[i]=a[j];a[j]=t}return a}
function report(s,m){if(window.__sent||window.parent===window)return;window.__sent=1;
  parent.postMessage({type:'sg:complete',score:s,maxScore:m},'*')}

(function(){
  /* A real exchange rather than isolated phrases - the learner answers Ama
     turn by turn and watches the conversation build up on screen. */
  var SCRIPT=[
   {them:'welcome', want:'thanks'},
   {them:'whatname', want:'myname'},
   {them:'howareyou', want:'imfine'},
   {them:'wherefrom', want:'imfrom'},
   {them:'wherelive', want:'ilive'},
   {them:'goodbye', want:'seeyou'}
  ];
  var TOTAL=SCRIPT.length;
  var at=0,score=0,lock=false,marks=[];
  var chatEl=document.getElementById('chat'),picksEl=document.getElementById('picks'),
      statusEl=document.getElementById('status'),dotsEl=document.getElementById('dots'),
      endEl=document.getElementById('end');
  function dots(){dotsEl.innerHTML='';for(var k=0;k<TOTAL;k++){var e=document.createElement('i');
    if(marks[k]===true)e.className='hit';else if(marks[k]===false)e.className='miss';
    dotsEl.appendChild(e)}}
  function bubble(cls,who,x){
    var w=document.createElement('div');w.className='who';w.textContent=who;
    var b=document.createElement('div');b.className='bub '+cls;
    b.innerHTML=x.w+'<small>'+x.e+'</small>';
    if(cls==='them')chatEl.appendChild(w);
    chatEl.appendChild(b);
    chatEl.scrollTop=chatEl.scrollHeight;
  }
  function show(){
    if(at>=TOTAL)return finish();
    lock=false;
    var step=SCRIPT[at], them=byF[step.them], want=byF[step.want];
    bubble('them','👧 Ama', them);
    sayT(them.f);
    statusEl.textContent='What do you answer?';
    dots();
    var pool=T.filter(function(x){return x.f!==want.f&&!x.ask}).slice();
    picksEl.innerHTML='';
    shuffle(shuffle(pool).slice(0,2).concat([want])).forEach(function(o){
      var b=document.createElement('button');b.className='pick';b.type='button';
      b.innerHTML=o.w+'<small>'+o.e+'</small>';
      b.onclick=function(){answer(b,o,want)};
      picksEl.appendChild(b);
    });
  }
  function answer(btn,o,want){
    if(lock)return;lock=true;
    var right=o.f===want.f;marks[at]=right;
    if(right){score++;btn.classList.add('ok');statusEl.textContent='✅ Yes!'}
    else{btn.classList.add('no');
      Array.prototype.forEach.call(picksEl.children,function(c){
        if(c.textContent.indexOf(want.w)===0)c.classList.add('ok')});
      statusEl.textContent='❌ You would say: '+want.w;}
    bubble('you','', want);
    sayT(want.f);
    dots();at++;
    setTimeout(function(){picksEl.innerHTML='';show()},1900);
  }
  function finish(){
    dots();picksEl.innerHTML='';
    statusEl.textContent='You had a whole conversation — '+score+' of '+TOTAL+' right.';
    endEl.innerHTML='<button class="fin" id="again">🔄 Talk again</button>';
    document.getElementById('again').onclick=function(){location.reload()};
    report(score,TOTAL);
  }
  show();
})();
</script>
</body>
</html>
