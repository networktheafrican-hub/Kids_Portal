<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Build the Word</title>
<!-- Kids_Portal · Twi Alphabets/build-the-word.html · slug: word-build -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#FBF6EC;font-family:'Comic Sans MS','Chalkboard SE','Segoe UI',cursive,sans-serif;
    padding:16px 12px 40px;color:#2d1b0a;text-align:center}
  .card{max-width:660px;margin:0 auto;background:#FFF8E6;border-radius:30px;padding:20px 16px 26px;
    border:6px solid #C8901E;box-shadow:0 10px 22px rgba(0,0,0,.12)}
  h1{font-size:1.7rem;color:#A81B1B;text-shadow:2px 2px 0 #feda7a}
  .sub{font-size:1rem;color:#4d2f12;background:#ffe39c;padding:6px 18px;border-radius:40px;
    display:inline-block;margin:10px 0;border:3px solid #f8b86a}
  .status{background:#fff1c7;border:3px solid #f7b86a;border-radius:40px;padding:9px 16px;
    font-weight:bold;font-size:1rem;margin:16px auto 0;max-width:470px;min-height:2.8em}
  .fin{background:#f5c542;border:4px solid #af6f2a;border-radius:40px;padding:12px 30px;
    font-size:1.15rem;font-weight:bold;color:#2d1b0a;box-shadow:0 5px 0 #7a4d1a;cursor:pointer;
    font-family:inherit;margin-top:16px}
  .dots{display:flex;gap:5px;justify-content:center;margin:12px 0 4px}
  .dots i{width:20px;height:11px;border-radius:4px;background:#EFE7D7;border:2px solid #14563A}
  .dots i.hit{background:#14563A}.dots i.miss{background:#A81B1B;border-color:#6E1111}
  .opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
  .opt{background:#fef7e6;border:4px solid #b48b3a;border-radius:22px;padding:12px 18px;
    min-width:96px;font-size:1.25rem;font-weight:bold;color:#1f3a2f;font-family:inherit;
    cursor:pointer;box-shadow:0 5px 0 #7a5a1f;transition:.12s}
  .opt:active{transform:translateY(3px);box-shadow:0 2px 0 #7a5a1f}
  .opt.ok{background:#14563A;color:#fff;border-color:#0d3a26}
  .opt.no{background:#A81B1B;color:#fff;border-color:#6E1111;animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
    75%{transform:translateX(7px)}}
  :focus-visible{outline:3px solid #A81B1B;outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  @media(min-width:700px){h1{font-size:2.2rem}}

  .clue{background:#14563A;color:#fff;border:5px solid #f3d48a;border-radius:26px;padding:18px;
    margin:14px 0;min-height:130px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:6px}
  .clue .em{font-size:3.4rem;line-height:1}
  .clue .en{font-size:1.05rem}
  .slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:12px 0}
  .slot{width:44px;height:52px;border-radius:12px;background:#fff;border:3px dashed #597b8f;
    display:grid;place-items:center;font-size:1.5rem;font-weight:bold;color:#003153}
  .slot.filled{background:#C8901E;color:#fff;border-style:solid;border-color:#14563A}
  .pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .tile{background:#fef7e6;border:4px solid #b48b3a;border-radius:18px;width:56px;padding:9px 4px;
    font-size:1.5rem;font-weight:bold;color:#1f3a2f;font-family:inherit;cursor:pointer;
    box-shadow:0 5px 0 #7a5a1f}
  .tile:active{transform:translateY(3px);box-shadow:0 2px 0 #7a5a1f}
  .tile.gone{opacity:.25;pointer-events:none}
  .tile.no{background:#A81B1B;color:#fff;border-color:#6E1111;animation:shake .35s}
</style>
</head>
<body>
<div class="card">
  <h1>✏️ Build the Word</h1>
  <span class="sub">Tap the letters in order</span>
  <div class="dots" id="dots"></div>
  <div class="clue" id="clue"></div>
  <div class="slots" id="slots"></div>
  <div class="pool" id="pool"></div>
  <p class="status" id="status"></p>
  <div id="end"></div>
</div>
<script>
/* The 22 words from the alphabet lesson - one per letter. Chosen to teach
   letters, but each is a real word worth knowing on its own. */
var W=[
 {L:'A',w:'Akoma',   en:'heart',    e:'❤️',  f:'akoma'},
 {L:'B',w:'Bankye',  en:'cassava',  e:'🍠',  f:'bankye'},
 {L:'D',w:'Dadeɛ',   en:'metal',    e:'🔨',  f:'dadee'},
 {L:'E',w:'Ekuro',   en:'wound',    e:'🩹',  f:'ekuro'},
 {L:'Ɛ',w:'Ɛkɔm',    en:'hunger',   e:'🍽️',  f:'ekom'},
 {L:'F',w:'Fitaa',   en:'white',    e:'☁️',  f:'fitaa'},
 {L:'G',w:'Gogo',    en:'loose',    e:'🫳',  f:'gogo'},
 {L:'H',w:'Hunu',    en:'see',      e:'👀',  f:'hunu'},
 {L:'I',w:'Di',      en:'eat',      e:'🍚',  f:'di'},
 {L:'K',w:'Kuruwa',  en:'cup',      e:'🥤',  f:'kuruwa'},
 {L:'L',w:'Lɔre',    en:'lorry',    e:'🚛',  f:'lore'},
 {L:'M',w:'Mukaase', en:'kitchen',  e:'🍳',  f:'mukaase'},
 {L:'N',w:'Nante',   en:'walk',     e:'🚶',  f:'nante'},
 {L:'O',w:'Osuro',   en:'fear',     e:'😨',  f:'osuro'},
 {L:'Ɔ',w:'Ɔwɔ',     en:'snake',    e:'🐍',  f:'owo'},
 {L:'P',w:'Pra',     en:'sweep',    e:'🧹',  f:'pra'},
 {L:'R',w:'Raw',     en:'scratch',  e:'✍️',  f:'raw'},
 {L:'S',w:'Samina',  en:'soap',     e:'🧼',  f:'samina'},
 {L:'T',w:'Tafere',  en:'lick',     e:'👅',  f:'tafere'},
 {L:'U',w:'Wukuada', en:'Wednesday',e:'📅',  f:'wukuada'},
 {L:'W',w:'Wie',     en:'finish',   e:'🏁',  f:'wie'},
 {L:'Y',w:'Yoma',    en:'camel',    e:'🐫',  f:'yoma'}
];
var LFILE={'A':'letter-a','B':'letter-b','D':'letter-d','E':'letter-e','Ɛ':'letter-ɛ','F':'letter-f',
 'G':'letter-g','H':'letter-h','I':'letter-i','K':'letter-k','L':'letter-l','M':'letter-m',
 'N':'letter-n','O':'letter-o','Ɔ':'letter-ɔ','P':'letter-p','R':'letter-r','S':'letter-s',
 'T':'letter-t','U':'letter-u','W':'letter-w','Y':'letter-y'};
/* Word recordings do not exist yet - these calls stay silent until
   audio/alphabet-words/<f>.m4a is uploaded, then start working with no change. */
function sayWord(f){var a=new Audio('/audio?f=alphabet-words/'+encodeURIComponent(f+'.m4a'));
  a.play().catch(function(){});return a}
function sayLetter(L){var f=LFILE[L];if(!f)return;
  var a=new Audio('/audio?f=twi-alphabet/'+encodeURIComponent(f+'.m4a'));
  a.play().catch(function(){});return a}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));
  var t=a[i];a[i]=a[j];a[j]=t}return a}
function report(s,m){if(window.__sent||window.parent===window)return;window.__sent=1;
  parent.postMessage({type:'sg:complete',score:s,maxScore:m},'*')}

(function(){
  var TOTAL=6;
  /* Short words only - a five-year-old spelling "Mukaase" letter by letter
     is a chore, not a game. */
  var SHORT=W.filter(function(x){return x.w.length<=6});
  var quiz=shuffle(SHORT.slice()).slice(0,TOTAL);
  var at=0,score=0,placed=0,wrong=0,marks=[];
  var clueEl=document.getElementById('clue'),slotsEl=document.getElementById('slots'),
      poolEl=document.getElementById('pool'),statusEl=document.getElementById('status'),
      dotsEl=document.getElementById('dots'),endEl=document.getElementById('end');
  function dots(){dotsEl.innerHTML='';for(var k=0;k<TOTAL;k++){var e=document.createElement('i');
    if(marks[k]===true)e.className='hit';else if(marks[k]===false)e.className='miss';
    dotsEl.appendChild(e)}}
  function letters(w){return w.split('')}
  function drawSlots(q){
    slotsEl.innerHTML='';
    letters(q.w).forEach(function(ch,i){
      var s=document.createElement('div');
      s.className='slot'+(i<placed?' filled':'');
      s.textContent=i<placed?ch:'';
      slotsEl.appendChild(s);
    });
  }
  function show(){
    if(at>=quiz.length)return finish();
    placed=0;var q=quiz[at];
    clueEl.innerHTML='<span class="em">'+q.e+'</span><span class="en">'+q.en+'</span>';
    statusEl.textContent='Which letter comes first?';
    drawSlots(q);dots();sayWord(q.f);
    poolEl.innerHTML='';
    shuffle(letters(q.w)).forEach(function(ch){
      var b=document.createElement('button');b.className='tile';b.type='button';b.textContent=ch;
      b.onclick=function(){tap(b,ch,q)};poolEl.appendChild(b);
    });
  }
  function tap(btn,ch,q){
    var want=letters(q.w)[placed];
    if(ch===want){
      btn.classList.add('gone');placed++;drawSlots(q);
      if(placed===q.w.length){
        marks[at]=wrong===0;
        if(wrong===0)score++;
        statusEl.textContent='✅ '+q.w+' — '+q.en;
        sayWord(q.f);
        var w=wrong;wrong=0;at++;
        setTimeout(show,1500);
      }else{
        statusEl.textContent='Good. Next letter.';
      }
    }else{
      wrong++;btn.classList.add('no');
      statusEl.textContent='❌ Not that one. Look at the word again.';
      setTimeout(function(){btn.classList.remove('no')},400);
    }
  }
  function finish(){
    dots();clueEl.innerHTML='<span class="em">🎉</span>';
    slotsEl.innerHTML='';poolEl.innerHTML='';
    statusEl.textContent='You spelled '+score+' of '+TOTAL+' with no mistakes.';
    endEl.innerHTML='<button class="fin" id="again">🔄 Play again</button>';
    document.getElementById('again').onclick=function(){location.reload()};
    report(Math.max(2,score+2),TOTAL+2);
  }
  show();
})();
</script>
</body>
</html>
