<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Two Letters, One Sound</title>
<!-- Kids_Portal · Twi Alphabets/digraph-lesson.html · slug: alphabet-digraph -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#FBF6EC;font-family:'Comic Sans MS','Chalkboard SE','Segoe UI',cursive,sans-serif;
    padding:16px 12px 40px;color:#2d1b0a;text-align:center}
  .card{max-width:660px;margin:0 auto;background:#FFF8E6;border-radius:30px;padding:20px 16px 26px;
    border:6px solid #C8901E;box-shadow:0 10px 22px rgba(0,0,0,.12)}
  h1{font-size:1.7rem;color:#A81B1B;text-shadow:2px 2px 0 #feda7a}
  .sub{font-size:1rem;color:#4d2f12;background:#ffe39c;padding:6px 18px;border-radius:40px;
    display:inline-block;margin:10px 0;border:3px solid #f8b86a}
  .status{background:#fff1c7;border:3px solid #f7b86a;border-radius:40px;padding:9px 16px;
    font-weight:bold;font-size:1rem;margin:16px auto 0;max-width:470px;min-height:2.8em}
  .fin{background:#f5c542;border:4px solid #af6f2a;border-radius:40px;padding:12px 30px;
    font-size:1.15rem;font-weight:bold;color:#2d1b0a;box-shadow:0 5px 0 #7a4d1a;cursor:pointer;
    font-family:inherit;margin-top:16px}
  .dots{display:flex;gap:5px;justify-content:center;margin:12px 0 4px}
  .dots i{width:20px;height:11px;border-radius:4px;background:#EFE7D7;border:2px solid #14563A}
  .dots i.hit{background:#14563A}.dots i.miss{background:#A81B1B;border-color:#6E1111}
  .opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
  .opt{background:#fef7e6;border:4px solid #b48b3a;border-radius:22px;padding:12px 18px;
    min-width:96px;font-size:1.3rem;font-weight:bold;color:#1f3a2f;font-family:inherit;
    cursor:pointer;box-shadow:0 5px 0 #7a5a1f;transition:.12s}
  .opt:active{transform:translateY(3px);box-shadow:0 2px 0 #7a5a1f}
  .opt.ok{background:#14563A;color:#fff;border-color:#0d3a26}
  .opt.no{background:#A81B1B;color:#fff;border-color:#6E1111;animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
    75%{transform:translateX(7px)}}
  :focus-visible{outline:3px solid #A81B1B;outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  @media(min-width:700px){h1{font-size:2.2rem}}

  .gramtip{background:#21274D;color:#fff;border-radius:18px;padding:13px 16px;margin:14px 0;
    border:4px solid #C8901E;font-size:.92rem;font-weight:700;line-height:1.6}
  .gramtip b{color:#E9C97A}
  .gramtip .big{font-size:1.5rem;display:block;margin-top:4px;letter-spacing:2px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:12px;
    margin-top:12px}
  .dg{background:#fff;border:4px solid #efc48c;border-radius:26px;padding:13px 6px 11px;
    cursor:pointer;font-family:inherit;box-shadow:0 7px 0 #b6956a;display:flex;
    flex-direction:column;align-items:center;gap:4px;transition:transform .08s}
  .dg:active{transform:translateY(4px);box-shadow:0 3px 0 #b6956a}
  .dg .two{font-size:2.5rem;font-weight:900;color:#14563A;letter-spacing:1px;line-height:1}
  .dg .ic{font-size:1.7rem;line-height:1}
  .dg .w{font-size:1.02rem;font-weight:bold;color:#7b341e;background:#fef3c7;
    padding:2px 11px;border-radius:30px;border:2px dotted #d97706;word-break:break-word}
  .dg .en{font-size:.72rem;color:#5A6B60;font-weight:bold;text-transform:uppercase}
  .dg.playing{border-color:#14563A;box-shadow:0 0 0 4px #14563A}
  .dg.got .w{background:#dcfce7;border-color:#22c55e}
  .bar{height:16px;border-radius:99px;background:#fff;border:3px solid #A81B1B;overflow:hidden;
    margin:18px auto 0;max-width:420px}
  .bar i{display:block;height:100%;width:0;background:#f97316;transition:width .3s}
</style>
</head>
<body>
<div class="card">
  <h1>🔤 Two Letters, One Sound</h1>
  <span class="sub">Twi digraphs</span>

  <div class="gramtip">
    Some sounds in Twi need <b>two letters together</b>. They are not two sounds —
    they are one, and you cannot split them.
    <span class="big">kw · ky · gy · hy</span>
    Tap a card: you hear the sound, then a word that uses it.
  </div>

  <div class="grid" id="grid"></div>
  <div class="bar"><i id="bar"></i></div>
  <p class="status" id="status">Tap every one to hear it.</p>
  <div id="end"></div>
</div>
<script>
/* Nine digraphs: two letters that make one sound. The recording teaches the
   sound; the example word shows it doing its work in a real word. */
var D=[
 {d:'dw', f:'dw', w:'dware',      wf:'bath',       e:'bath',        ic:'🚿'},
 {d:'gy', f:'gy', w:'gyae',       wf:'stop',       e:'stop',        ic:'🛑'},
 {d:'hw', f:'hw', w:'hwɛ',        wf:'look',       e:'look',        ic:'👀'},
 {d:'hy', f:'hy', w:'hyɛ ntadeɛ', wf:'getdressed', e:'get dressed', ic:'👕'},
 {d:'kw', f:'kw', w:'kwan',       wf:'road',       e:'road',        ic:'🛣️'},
 {d:'ky', f:'ky', w:'kyerɛw',     wf:'write',      e:'write',       ic:'✍️'},
 {d:'nw', f:'nw', w:'nwansena',   wf:'housefly',   e:'housefly',    ic:'🪰'},
 {d:'ny', f:'ny', w:'nyame',      wf:'god',        e:'God',         ic:'🙏'},
 {d:'tw', f:'tw', w:'twa mu',     wf:'crossover',  e:'cross over',  ic:'🚸'}
];
/* The pairs a learner actually confuses - same first letter, different second. */
var PAIRS=[['kw','ky'],['dw','tw'],['hw','hy'],['nw','ny']];
var byD={}; D.forEach(function(x){byD[x.d]=x});
function sayD(f){var a=new Audio('/audio?f=digraphs/'+encodeURIComponent(f+'.m4a'));
  a.play().catch(function(){});return a}
/* The sound, then the word that uses it. */
function sayBoth(x){
  var a=sayD(x.f);
  a.addEventListener('ended',function(){sayD(x.wf)});
  return a;
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));
  var t=a[i];a[i]=a[j];a[j]=t}return a}
function report(s,m){if(window.__sent||window.parent===window)return;window.__sent=1;
  parent.postMessage({type:'sg:complete',score:s,maxScore:m},'*')}

(function(){
  var heard={},cur=null,curEl=null;
  var gridEl=document.getElementById('grid'),statusEl=document.getElementById('status'),
      barEl=document.getElementById('bar'),endEl=document.getElementById('end');
  D.forEach(function(x){
    var b=document.createElement('button');b.className='dg';b.type='button';
    b.setAttribute('aria-label',x.d+', as in '+x.w);
    b.innerHTML='<span class="two">'+x.d+'</span>'
      +'<span class="ic">'+x.ic+'</span>'
      +'<span class="w">'+x.w+'</span>'
      +'<span class="en">'+x.e+'</span>';
    b.onclick=function(){
      if(cur)cur.pause(); if(curEl)curEl.classList.remove('playing');
      curEl=b;b.classList.add('playing');
      cur=sayD(x.f);
      cur.addEventListener('ended',function(){
        var w=sayD(x.wf);
        w.addEventListener('ended',function(){b.classList.remove('playing')});
        w.addEventListener('error',function(){b.classList.remove('playing')});
      });
      cur.addEventListener('error',function(){b.classList.remove('playing')});
      b.classList.add('got');
      heard[x.d]=1;
      var n=Object.keys(heard).length;
      barEl.style.width=Math.round(n/D.length*100)+'%';
      statusEl.textContent=n<D.length
        ? '🔊 '+x.d+' — as in '+x.w+'  ·  '+n+' of '+D.length
        : '🎉 You heard all nine!';
      if(n>=D.length&&!endEl.innerHTML){
        endEl.innerHTML='<button class="fin" id="done">✅ I know the digraphs</button>';
        document.getElementById('done').onclick=function(){report(5,5)};
      }
    };
    gridEl.appendChild(b);
  });
})();
</script>
</body>
</html>
