<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Missing Letters</title>
<!-- Kids_Portal · Twi Alphabets/missing-letters.html · slug: alphabet-missing -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#FBF6EC;font-family:'Comic Sans MS','Chalkboard SE','Segoe UI',cursive,sans-serif;
    padding:16px 12px 40px;color:#2d1b0a;text-align:center}
  .card{max-width:660px;margin:0 auto;background:#FFF8E6;border-radius:30px;padding:20px 16px 26px;
    border:6px solid #C8901E;box-shadow:0 10px 22px rgba(0,0,0,.12)}
  h1{font-size:1.7rem;color:#A81B1B;text-shadow:2px 2px 0 #feda7a}
  .sub{font-size:1rem;color:#4d2f12;background:#ffe39c;padding:6px 18px;border-radius:40px;
    display:inline-block;margin:10px 0;border:3px solid #f8b86a}
  .strip{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;background:#b2d8e8;
    border:5px solid #2a6d8c;border-radius:26px;padding:14px 12px;margin:16px 0}
  .cell{width:52px;height:56px;border-radius:16px;display:grid;place-items:center;
    font-size:1.7rem;font-weight:bold;background:#fff;color:#003153;border:3px solid #597b8f}
  .cell.gap{background:#fff7d6;border:3px dashed #cb7b2c;color:#cb7b2c;font-size:1.5rem}
  .cell.gap.now{border-color:#A81B1B;background:#ffe0dc;box-shadow:0 0 0 4px #ffd966;
    animation:pulse 1.1s infinite}
  .cell.gap.filled{background:#14563A;color:#fff;border:3px solid #0d3a26}
  .pool{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:4px}
  .tile{background:#fef7e6;border:4px solid #b48b3a;border-radius:20px;width:62px;padding:9px 4px;
    font-size:1.7rem;font-weight:bold;color:#1f3a2f;font-family:inherit;cursor:pointer;
    box-shadow:0 5px 0 #7a5a1f;transition:.12s}
  .tile:active{transform:translateY(3px);box-shadow:0 2px 0 #7a5a1f}
  .tile.gone{opacity:.25;pointer-events:none}
  .tile.no{background:#A81B1B;color:#fff;border-color:#6E1111;animation:shake .35s}
  .status{background:#fff1c7;border:3px solid #f7b86a;border-radius:40px;padding:9px 16px;
    font-weight:bold;font-size:1rem;margin:16px auto 0;max-width:470px;min-height:2.8em}
  .fin{background:#f5c542;border:4px solid #af6f2a;border-radius:40px;padding:12px 30px;
    font-size:1.15rem;font-weight:bold;color:#2d1b0a;box-shadow:0 5px 0 #7a4d1a;cursor:pointer;
    font-family:inherit;margin-top:16px}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
    75%{transform:translateX(7px)}}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 4px #ffd966}50%{box-shadow:0 0 0 8px #ffe9a3}}
  :focus-visible{outline:3px solid #A81B1B;outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  @media(min-width:700px){h1{font-size:2.2rem}.cell{width:60px;height:64px;font-size:2rem}
    .tile{width:72px;font-size:2rem}}
</style>
</head>
<body>
<div class="card">
  <h1>🕳️ Missing Letters</h1>
  <span class="sub">Some letters ran away. Put them back!</span>

  <div class="strip" id="strip"></div>
  <div class="pool" id="pool"></div>
  <p class="status" id="status">Fill the flashing gap first.</p>
  <div id="end"></div>
</div>

<script>
(function(){
  var ORDER=['A','B','D','E','Ɛ','F','G','H','I','K','L','M','N','O','Ɔ','P','R','S','T','U','W','Y'];
  var FILE={'A':'letter-a','B':'letter-b','D':'letter-d','E':'letter-e','Ɛ':'letter-ɛ','F':'letter-f',
    'G':'letter-g','H':'letter-h','I':'letter-i','K':'letter-k','L':'letter-l','M':'letter-m',
    'N':'letter-n','O':'letter-o','Ɔ':'letter-ɔ','P':'letter-p','R':'letter-r','S':'letter-s',
    'T':'letter-t','U':'letter-u','W':'letter-w','Y':'letter-y'};
  var RUN=8, GAPS=3;

  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));
    var t=a[i];a[i]=a[j];a[j]=t}return a}

  var audio=null;
  function say(L){ if(!FILE[L])return; if(audio)audio.pause();
    audio=new Audio('/audio?f=twi-alphabet/'+encodeURIComponent(FILE[L]+'.m4a'));
    audio.play().catch(function(){}); }

  // A consecutive run with holes punched in it. Never the first or last cell,
  // so every gap has a visible letter on both sides to reason from.
  var start=Math.floor(Math.random()*(ORDER.length-RUN));
  var run=ORDER.slice(start,start+RUN);
  var inner=[]; for(var k=1;k<RUN-1;k++)inner.push(k);
  var holes=shuffle(inner).slice(0,GAPS).sort(function(a,b){return a-b});

  var filled=0, wrong=0;
  var stripEl=document.getElementById('strip'),poolEl=document.getElementById('pool'),
      statusEl=document.getElementById('status'),endEl=document.getElementById('end');

  function drawStrip(){
    stripEl.innerHTML='';
    run.forEach(function(L,idx){
      var c=document.createElement('div');
      var hi=holes.indexOf(idx);
      if(hi<0){ c.className='cell'; c.textContent=L; }
      else if(hi<filled){ c.className='cell gap filled'; c.textContent=L; }
      else { c.className='cell gap'+(hi===filled?' now':''); c.textContent='?'; }
      stripEl.appendChild(c);
    });
  }

  function drawPool(){
    // The three answers, plus three near neighbours as distractors.
    var answers=holes.map(function(i){return run[i]});
    var others=shuffle(ORDER.filter(function(L){return answers.indexOf(L)<0})).slice(0,3);
    poolEl.innerHTML='';
    shuffle(answers.concat(others)).forEach(function(L){
      var b=document.createElement('button');
      b.className='tile';b.type='button';b.textContent=L;b.dataset.L=L;
      b.onclick=function(){tap(b,L)};
      poolEl.appendChild(b);
    });
  }

  function tap(btn,L){
    if(filled>=holes.length)return;
    var want=run[holes[filled]];
    if(L===want){
      btn.classList.add('gone');
      filled++;
      say(L);
      drawStrip();
      statusEl.textContent = filled<holes.length
        ? '✅ '+L+' goes there. Next gap!'
        : '🎉 Every letter is back home!';
      if(filled===holes.length)finish();
    }else{
      wrong++;
      btn.classList.add('no');
      say(want);
      var before=run[holes[filled]-1];
      statusEl.textContent='❌ Not '+L+'. What comes after '+before+'?';
      setTimeout(function(){btn.classList.remove('no')},400);
    }
  }

  function finish(){
    poolEl.innerHTML='';
    var score=Math.max(2,6-wrong*2);
    statusEl.textContent = wrong===0
      ? 'Perfect — no mistakes at all!'
      : 'Finished with '+wrong+(wrong===1?' mistake.':' mistakes.');
    endEl.innerHTML='<button class="fin" id="again">🔄 New letters</button>';
    document.getElementById('again').onclick=function(){location.reload()};
    report(score,6);
  }

  var sent=false;
  function report(s,m){ if(sent||window.parent===window)return; sent=true;
    parent.postMessage({type:'sg:complete',score:s,maxScore:m},'*'); }

  drawStrip();drawPool();
})();
</script>
</body>
</html>
