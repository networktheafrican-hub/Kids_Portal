<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Counting in Twi</title>
<!-- Kids_Portal · Twi Numbers/counting-lesson.html · slug: numbers-lesson -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#FBF6EC;font-family:'Comic Sans MS','Chalkboard SE','Segoe UI',cursive,sans-serif;
    padding:16px 12px 40px;color:#2d1b0a;text-align:center}
  .card{max-width:660px;margin:0 auto;background:#FFF8E6;border-radius:30px;padding:20px 16px 26px;
    border:6px solid #C8901E;box-shadow:0 10px 22px rgba(0,0,0,.12)}
  h1{font-size:1.7rem;color:#A81B1B;text-shadow:2px 2px 0 #feda7a}
  .sub{font-size:1rem;color:#4d2f12;background:#ffe39c;padding:6px 18px;border-radius:40px;
    display:inline-block;margin:10px 0;border:3px solid #f8b86a}
  .status{background:#fff1c7;border:3px solid #f7b86a;border-radius:40px;padding:9px 16px;
    font-weight:bold;font-size:1rem;margin:16px auto 0;max-width:470px;min-height:2.8em}
  .fin{background:#f5c542;border:4px solid #af6f2a;border-radius:40px;padding:12px 30px;
    font-size:1.15rem;font-weight:bold;color:#2d1b0a;box-shadow:0 5px 0 #7a4d1a;cursor:pointer;
    font-family:inherit;margin-top:16px}
  .dots{display:flex;gap:5px;justify-content:center;margin:12px 0 4px}
  .dots i{width:20px;height:11px;border-radius:4px;background:#EFE7D7;border:2px solid #14563A}
  .dots i.hit{background:#14563A}.dots i.miss{background:#A81B1B;border-color:#6E1111}
  .opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
  .opt{background:#fef7e6;border:4px solid #b48b3a;border-radius:22px;padding:12px 18px;
    min-width:96px;font-size:1.25rem;font-weight:bold;color:#1f3a2f;font-family:inherit;
    cursor:pointer;box-shadow:0 5px 0 #7a5a1f;transition:.12s}
  .opt:active{transform:translateY(3px);box-shadow:0 2px 0 #7a5a1f}
  .opt.ok{background:#14563A;color:#fff;border-color:#0d3a26}
  .opt.no{background:#A81B1B;color:#fff;border-color:#6E1111;animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
    75%{transform:translateX(7px)}}
  :focus-visible{outline:3px solid #A81B1B;outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  @media(min-width:700px){h1{font-size:2.2rem}}

  .rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:11px;
    background:#feeac2;padding:14px;border-radius:26px;border:5px solid #c28d4b;margin-top:14px}
  .r{background:#fff;border:3px solid #efc48c;border-radius:40px;padding:10px 12px;display:flex;
    align-items:center;gap:10px;box-shadow:0 4px 0 #b6956a;cursor:pointer;text-align:left}
  .r:hover{filter:brightness(1.04)}
  .r.playing{box-shadow:0 0 0 4px #14563A}
  .r .num{font-size:1.9rem;background:#c0d9b4;min-width:52px;text-align:center;border-radius:40px;
    color:#1e4a2b;border:2px solid #7eae6a;font-weight:bold;flex:0 0 auto}
  .r .tw{background:#ffe1b3;padding:2px 12px;border-radius:30px;font-size:1.15rem;font-weight:bold;
    color:#492f16}
  .r .pic{margin-left:auto;font-size:1.5rem;letter-spacing:-2px;max-width:120px;text-align:right;
    line-height:1.1}
  .hint{text-align:center;font-size:.95rem;font-weight:bold;color:#4d2f12;background:#fff1c7;
    padding:7px 16px;border-radius:40px;max-width:400px;margin:12px auto 0;border:3px solid #f7b86a}
</style>
</head>
<body>
<div class="card">
  <h1>🔢 Counting in Twi</h1>
  <span class="sub">Baako to du — one to ten</span>
  <p class="hint">🔊 Tap any number to hear it</p>
  <div class="rows" id="rows"></div>
  <p class="status" id="status">Tap them all, then try the games.</p>
  <div id="end"></div>
</div>
<script>
var N=[
 {n:1,w:'baako',  f:'one',   e:'🥭'},
 {n:2,w:'mmienu', f:'two',   e:'🍌'},
 {n:3,w:'mmiensa',f:'three', e:'🥥'},
 {n:4,w:'ɛnan',   f:'four',  e:'🍍'},
 {n:5,w:'enum',   f:'five',  e:'🐟'},
 {n:6,w:'nsia',   f:'six',   e:'🥚'},
 {n:7,w:'nson',   f:'seven', e:'🌽'},
 {n:8,w:'nwɔtwe', f:'eight', e:'🍠'},
 {n:9,w:'nkron',  f:'nine',  e:'🥜'},
 {n:10,w:'du',    f:'ten',   e:'⭐'}
];
function sayN(f){var a=new Audio('/audio?f=twi-numbers/'+encodeURIComponent(f+'.m4a'));
  a.play().catch(function(){});return a}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));
  var t=a[i];a[i]=a[j];a[j]=t}return a}
function report(s,m){if(window.__sent||window.parent===window)return;window.__sent=1;
  parent.postMessage({type:'sg:complete',score:s,maxScore:m},'*')}

(function(){
  var tapped={},cur=null,curEl=null;
  var rowsEl=document.getElementById('rows'),statusEl=document.getElementById('status'),
      endEl=document.getElementById('end');

  N.forEach(function(x){
    var d=document.createElement('button');
    d.className='r';d.type='button';
    d.innerHTML='<span class="num">'+x.n+'</span><span class="tw">'+x.w+'</span>'
      +'<span class="pic">'+new Array(x.n+1).join(x.e)+'</span>';
    d.onclick=function(){
      if(cur)cur.pause();
      if(curEl)curEl.classList.remove('playing');
      cur=sayN(x.f);curEl=d;d.classList.add('playing');
      cur.addEventListener('ended',function(){d.classList.remove('playing')});
      cur.addEventListener('error',function(){d.classList.remove('playing')});
      tapped[x.n]=1;
      var c=Object.keys(tapped).length;
      statusEl.textContent=c<10?('You have heard '+c+' of 10.'):'You heard them all! 🎉';
      if(c===10&&!endEl.innerHTML){
        endEl.innerHTML='<button class="fin" id="done">✅ I know my numbers</button>';
        document.getElementById('done').onclick=function(){report(5,5)};
      }
    };
    rowsEl.appendChild(d);
  });
})();
</script>
</body>
</html>
