<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Market Basket</title>
<!-- Kids_Portal · Twi Numbers/market-basket.html · slug: numbers-add -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#FBF6EC;font-family:'Comic Sans MS','Chalkboard SE','Segoe UI',cursive,sans-serif;
    padding:16px 12px 40px;color:#2d1b0a;text-align:center}
  .card{max-width:660px;margin:0 auto;background:#FFF8E6;border-radius:30px;padding:20px 16px 26px;
    border:6px solid #C8901E;box-shadow:0 10px 22px rgba(0,0,0,.12)}
  h1{font-size:1.7rem;color:#A81B1B;text-shadow:2px 2px 0 #feda7a}
  .sub{font-size:1rem;color:#4d2f12;background:#ffe39c;padding:6px 18px;border-radius:40px;
    display:inline-block;margin:10px 0;border:3px solid #f8b86a}
  .status{background:#fff1c7;border:3px solid #f7b86a;border-radius:40px;padding:9px 16px;
    font-weight:bold;font-size:1rem;margin:16px auto 0;max-width:470px;min-height:2.8em}
  .fin{background:#f5c542;border:4px solid #af6f2a;border-radius:40px;padding:12px 30px;
    font-size:1.15rem;font-weight:bold;color:#2d1b0a;box-shadow:0 5px 0 #7a4d1a;cursor:pointer;
    font-family:inherit;margin-top:16px}
  .dots{display:flex;gap:5px;justify-content:center;margin:12px 0 4px}
  .dots i{width:20px;height:11px;border-radius:4px;background:#EFE7D7;border:2px solid #14563A}
  .dots i.hit{background:#14563A}.dots i.miss{background:#A81B1B;border-color:#6E1111}
  .opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
  .opt{background:#fef7e6;border:4px solid #b48b3a;border-radius:22px;padding:12px 18px;
    min-width:96px;font-size:1.25rem;font-weight:bold;color:#1f3a2f;font-family:inherit;
    cursor:pointer;box-shadow:0 5px 0 #7a5a1f;transition:.12s}
  .opt:active{transform:translateY(3px);box-shadow:0 2px 0 #7a5a1f}
  .opt.ok{background:#14563A;color:#fff;border-color:#0d3a26}
  .opt.no{background:#A81B1B;color:#fff;border-color:#6E1111;animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}
    75%{transform:translateX(7px)}}
  :focus-visible{outline:3px solid #A81B1B;outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  @media(min-width:700px){h1{font-size:2.2rem}}

  .stall{background:#d9e9b0;border:5px solid #14563A;border-radius:26px;padding:16px 12px;
    margin:14px 0;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
    min-height:118px}
  .heap{background:#fff;border:3px solid #7eae6a;border-radius:20px;padding:10px 12px;
    min-width:96px;max-width:190px}
  .heap .things{font-size:1.6rem;line-height:1.35;letter-spacing:1px;word-break:break-all}
  .heap .cap{font-size:.9rem;font-weight:bold;color:#1e4a2b;background:#c0d9b4;border-radius:20px;
    padding:1px 10px;display:inline-block;margin-top:5px}
  .sign{font-size:2.2rem;font-weight:bold;color:#A81B1B}
  .basket{background:#fff1c7;border:4px dashed #cb7b2c;border-radius:20px;padding:12px 16px;
    font-size:1.5rem;font-weight:bold;color:#cb7b2c;min-width:74px}
  .tale{background:#fff;border:3px solid #efc48c;border-radius:26px;padding:11px 14px;
    font-size:1.05rem;font-weight:bold;color:#492f16;margin-top:4px}
</style>
</head>
<body>
<div class="card">
  <h1>🧺 Market Basket</h1>
  <span class="sub">Add them up, answer in Twi</span>
  <div class="dots" id="dots"></div>
  <p class="tale" id="tale"></p>
  <div class="stall" id="stall"></div>
  <div class="opts" id="opts"></div>
  <p class="status" id="status">How many altogether?</p>
  <div id="end"></div>
</div>
<script>
var N=[
 {n:1,w:'baako',  f:'one',   e:'🥭'},
 {n:2,w:'mmienu', f:'two',   e:'🍌'},
 {n:3,w:'mmiensa',f:'three', e:'🥥'},
 {n:4,w:'ɛnan',   f:'four',  e:'🍍'},
 {n:5,w:'enum',   f:'five',  e:'🐟'},
 {n:6,w:'nsia',   f:'six',   e:'🥚'},
 {n:7,w:'nson',   f:'seven', e:'🌽'},
 {n:8,w:'nwɔtwe', f:'eight', e:'🍠'},
 {n:9,w:'nkron',  f:'nine',  e:'🥜'},
 {n:10,w:'du',    f:'ten',   e:'⭐'}
];
function sayN(f){var a=new Audio('/audio?f=twi-numbers/'+encodeURIComponent(f+'.m4a'));
  a.play().catch(function(){});return a}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));
  var t=a[i];a[i]=a[j];a[j]=t}return a}
function report(s,m){if(window.__sent||window.parent===window)return;window.__sent=1;
  parent.postMessage({type:'sg:complete',score:s,maxScore:m},'*')}

(function(){
  var TOTAL=8;
  var SELLER=['Ama','Kofi','Akosua','Yaw','Abena','Kwame'];
  var GOODS=[{e:'🥭',n:'mangoes'},{e:'🍌',n:'bananas'},{e:'🥥',n:'coconuts'},
             {e:'🍍',n:'pineapples'},{e:'🥚',n:'eggs'},{e:'🌽',n:'corn'}];
  var word=function(n){return N[n-1].w}, file=function(n){return N[n-1].f};
  var pick1=function(a){return a[Math.floor(Math.random()*a.length)]};

  /* Both parts at least 1, total never above 10, so every answer is a word
     the child has actually been taught. */
  function makeSum(){
    var total=2+Math.floor(Math.random()*9);          // 2..10
    var a=1+Math.floor(Math.random()*(total-1));      // 1..total-1
    return {a:a,b:total-a,t:total,g:pick1(GOODS),who:pick1(SELLER)};
  }

  var quiz=[];for(var i=0;i<TOTAL;i++)quiz.push(makeSum());
  var at=0,score=0,lock=false,marks=[];
  var stallEl=document.getElementById('stall'),optsEl=document.getElementById('opts'),
      statusEl=document.getElementById('status'),dotsEl=document.getElementById('dots'),
      taleEl=document.getElementById('tale'),endEl=document.getElementById('end');

  function dots(){dotsEl.innerHTML='';for(var k=0;k<TOTAL;k++){var e=document.createElement('i');
    if(marks[k]===true)e.className='hit';else if(marks[k]===false)e.className='miss';
    dotsEl.appendChild(e)}}

  function heap(n,g){return '<div class="heap"><div class="things">'
    +new Array(n+1).join(g.e)+'</div><span class="cap">'+word(n)+'</span></div>'}

  function show(){
    if(at>=quiz.length)return finish();
    lock=false;var q=quiz[at];
    taleEl.textContent=q.who+' has '+q.a+' '+q.g.n+'. She buys '+q.b+' more.';
    stallEl.innerHTML=heap(q.a,q.g)+'<span class="sign">+</span>'+heap(q.b,q.g)
      +'<span class="sign">=</span><div class="basket">?</div>';
    statusEl.textContent='How many altogether?';
    dots();

    var wrong=shuffle(N.filter(function(x){return x.n!==q.t})).slice(0,3)
      .map(function(x){return x.w});
    optsEl.innerHTML='';
    shuffle(wrong.concat([word(q.t)])).forEach(function(o){
      var b=document.createElement('button');
      b.className='opt';b.type='button';b.textContent=o;
      b.onclick=function(){answer(b,o,q)};
      optsEl.appendChild(b);
    });
  }

  function answer(btn,chosen,q){
    if(lock)return;lock=true;
    var right=chosen===word(q.t);marks[at]=right;
    stallEl.querySelector('.basket').innerHTML=q.t;
    if(right){score++;btn.classList.add('ok');
      statusEl.textContent='✅ Yes! '+q.a+' + '+q.b+' = '+q.t+' — '+word(q.t)+'.'}
    else{btn.classList.add('no');
      Array.prototype.forEach.call(optsEl.children,function(c){
        if(c.textContent===word(q.t))c.classList.add('ok')});
      statusEl.textContent='❌ '+q.a+' + '+q.b+' = '+q.t+', and that is '+word(q.t)+'.'}
    sayN(file(q.t));dots();at++;setTimeout(show,1800);
  }

  function finish(){
    dots();taleEl.textContent='';stallEl.innerHTML='<span class="sign">🎉</span>';
    optsEl.innerHTML='';
    statusEl.textContent='You got '+score+' out of '+TOTAL+'.';
    endEl.innerHTML='<button class="fin" id="again">🔄 Play again</button>';
    document.getElementById('again').onclick=function(){location.reload()};
    report(score,TOTAL);
  }
  show();
})();
</script>
</body>
</html>
